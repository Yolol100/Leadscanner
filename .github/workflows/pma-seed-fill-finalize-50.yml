name: PMA Seed Fill and Finalize 50 Human Drafts

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/pma-seed-fill-finalize-50.yml'

permissions:
  contents: read

concurrency:
  group: pma-seed-fill-finalize-50-20260910
  cancel-in-progress: false

jobs:
  seed-fill-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '20'

    steps:
      - name: Checkout temporary execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require Sheet and mailbox credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          test -n "${OUTREACH_MAIL_PASSWORD:-}" || { echo '::error::OUTREACH_MAIL_PASSWORD is required'; exit 1; }
          echo 'RUNTIME_CREDENTIALS=present'

      - name: Load private outreach footer config
        run: python3 scripts/outreach_private_config.py

      - name: Seed only web-verified PMA member domains
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/seed_verified_pma_domains_v2.py | tee pma-seed.log
          grep -q '^PMA_DOMAIN_SEED=green .*smtp_send=not_invoked$' pma-seed.log

      - name: Qualify seeded domains and prepare only A-fit human copy
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/targeted_us_quote_fill_fresh.py --target-new 40 --max-assess 220 --report pma-targeted-fill.json | tee pma-targeted-fill.log
          grep -q '^FRESH_US_QUOTE_FILL=complete .*smtp_send=not_invoked$' pma-targeted-fill.log

      - name: Count human-ready leads before mailbox writes
        id: count
        shell: bash
        run: |
          set -euo pipefail
          out="$(python3 ops/finalize_50_human_drafts.py --count-only)"
          printf '%s\n' "$out" | tee pma-human-ready-count.log
          ready="$(printf '%s\n' "$out" | sed -n 's/^FINAL_HUMAN_READY=//p' | tail -n 1)"
          test -n "$ready" || { echo '::error::Could not resolve human-ready count'; exit 2; }
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "PMA_HUMAN_READY=${ready}"

      - name: Create exactly 50 idempotent IMAP drafts only when ready
        if: steps.count.outputs.ready >= 50
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/finalize_50_human_drafts.py | tee final-50-human-drafts.log
          grep -q '^LEADS50_FINAL=green selected=50 drafts=50 .*smtp_send=not_invoked$' final-50-human-drafts.log

      - name: Fail closed if fewer than 50 are human-ready
        if: steps.count.outputs.ready < 50
        shell: bash
        run: |
          echo "::error::Only ${{ steps.count.outputs.ready }} human-ready leads; mailbox remains untouched."
          exit 2

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pma-seed-fill-finalize-${{ github.run_id }}
          path: |
            pma-seed.log
            seed-verified-pma-domains.json
            pma-targeted-fill.json
            pma-targeted-fill.log
            pma-human-ready-count.log
            selected-50-final.json
            draft-receipts-final.json
            final-50-human-drafts.log
          if-no-files-found: ignore
          retention-days: 14
