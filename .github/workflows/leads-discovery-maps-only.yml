name: Leads Discovery Maps Only

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Komma- of newlinegescheiden plaatsen/regio’s'
        required: true
        type: string
      keywords:
        description: 'Komma- of newlinegescheiden branches/zoektermen'
        required: true
        type: string
      target_candidates:
        description: 'Doel aantal unieke kandidaten (1-5000)'
        required: true
        default: '2000'
        type: string
      maps_depth:
        description: 'Google Maps diepte (1-10)'
        required: true
        default: '1'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: leads-discovery-maps-only
  cancel-in-progress: true

jobs:
  discovery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[lead-discovery-maps]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-discovery.txt

      - name: Install discovery dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt

      - name: Resolve and validate discovery request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_REGIONS: ${{ inputs.regions }}
          INPUT_KEYWORDS: ${{ inputs.keywords }}
          INPUT_TARGET: ${{ inputs.target_candidates }}
          INPUT_MAPS_DEPTH: ${{ inputs.maps_depth }}
        run: |
          set -euo pipefail
          mkdir -p results/google-maps
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "issues":
              event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
              request = json.loads(event["issue"].get("body") or "{}")
          else:
              request = {
                  "regions": os.environ["INPUT_REGIONS"],
                  "keywords": os.environ["INPUT_KEYWORDS"],
                  "target_candidates": os.environ["INPUT_TARGET"],
                  "maps_depth": os.environ["INPUT_MAPS_DEPTH"],
              }

          def clean_list(value, *, label, maximum):
              if isinstance(value, str):
                  items = [item.strip() for item in re.split(r"[,\n]+", value) if item.strip()]
              elif isinstance(value, list):
                  items = [str(item).strip() for item in value if str(item).strip()]
              else:
                  raise SystemExit(f"{label} must be a string or list")
              out = []
              seen = set()
              for item in items:
                  key = item.casefold()
                  if key not in seen:
                      seen.add(key)
                      out.append(item)
              if not 1 <= len(out) <= maximum:
                  raise SystemExit(f"{label} must contain 1-{maximum} unique values")
              return out

          regions = clean_list(request.get("regions") or request.get("region") or [], label="regions", maximum=20)
          keywords = clean_list(request.get("keywords") or [], label="keywords", maximum=100)
          target = int(request.get("target_candidates") or 2000)
          depth = int(request.get("maps_depth") or 1)
          if not 1 <= target <= 5000:
              raise SystemExit("target_candidates must be 1-5000")
          if not 1 <= depth <= 10:
              raise SystemExit("maps_depth must be 1-10")

          Path("results/google-maps-queries.txt").write_text(
              "".join(f"{keyword} {region}\n" for region in regions for keyword in keywords),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"target={target}\n")
              out.write(f"maps_depth={depth}\n")
              out.write(f"query_count={len(regions) * len(keywords)}\n")
          print(
              f"MAPS_ONLY_REQUEST=green regions={len(regions)} keywords={len(keywords)} "
              f"queries={len(regions) * len(keywords)} target={target} depth={depth}"
          )
          PY

      - name: Google Maps discovery
        env:
          MAPS_DEPTH: ${{ steps.request.outputs.maps_depth }}
        run: |
          set -euo pipefail
          docker pull gosom/google-maps-scraper:v1.18.1
          docker run --rm             -v "$PWD/results/google-maps-queries.txt:/queries.txt:ro"             -v "$PWD/results/google-maps:/out"             gosom/google-maps-scraper:v1.18.1             -input /queries.txt             -results /out/results.csv             -depth "$MAPS_DEPTH"             -exit-on-inactivity 3m

      - name: Build compatible hybrid discovery from Maps
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("results/overture-empty.json").write_text(
              json.dumps({"candidates": []}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          PYTHONPATH=scripts python3 scripts/hybrid_discovery.py             --overture results/overture-empty.json             --google-maps-csv results/google-maps/results.csv             --output results/hybrid-discovery.json             --max-results "$TARGET"             --require-website

      - name: Filter discovery-level competitors
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/filter_discovery_candidates.py             --input results/hybrid-discovery.json             --output results/phase2-discovery.json

      - name: Prove discovery-only boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/phase2-discovery.json").read_text(encoding="utf-8"))
          safety = report.get("safety") or {}
          for key in (
              "verification_performed",
              "contact_basis_evaluated",
              "copy_created",
              "draft_created",
              "email_send",
              "email_candidates_in_final_output",
          ):
              if safety.get(key) is not False:
                  raise SystemExit(f"discovery-only safety boundary failed: {key}")
          print("MAPS_ONLY_DISCOVERY_BOUNDARY=green")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-discovery-maps-${{ github.run_number }}
          path: |
            results/phase2-discovery.json
            results/hybrid-discovery.json
          if-no-files-found: error
          retention-days: 1
