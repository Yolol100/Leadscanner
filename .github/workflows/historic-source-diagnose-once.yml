name: One-time historical source identity diagnosis (read-only)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[historical-source-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt
      - name: Read source and print fixed anonymous counters only
        env:
          PYTHONPATH: scripts
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_source_diagnose.py
