name: Instantly Write Self Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: instantly-write-selftest
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'INSTANTLY WRITE SELF TEST' &&
      github.event.issue.body == 'COMMAND=WRITE_SELF_TEST'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Execute isolated Instantly write self-test
        id: selftest
        continue-on-error: true
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instantly_write_selftest.py --report instantly-selftest-result.json | tee instantly-selftest-result.txt

      - name: Report safe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SELFTEST_OUTCOME" = 'success' ] && [ -f instantly-selftest-result.json ]; then
            summary="$(jq -r '"INSTANTLY_WRITE_SELFTEST=" + (.status // "unknown") + "\nMODE=" + (.mode // "isolated_write_test") + "\nLIST_CREATED=" + ((.list_created // false)|tostring) + "\nLEAD_CREATED=" + ((.lead_created // false)|tostring) + "\nREADBACK_VERIFIED=" + ((.readback_verified // false)|tostring) + "\nLEAD_CLEANUP=" + ((.lead_cleanup // false)|tostring) + "\nLIST_CLEANUP=" + ((.list_cleanup // false)|tostring) + "\nEMAIL_USED=false\nSEND_PERMISSION=none\nACTIVATION_INVOKED=false"' instantly-selftest-result.json)"
          else
            summary='INSTANTLY_WRITE_SELFTEST=blocked\nEMAIL_USED=false\nSEND_PERMISSION=none\nACTIVATION_INVOKED=false'
          fi

          payload="$(jq -n --arg body "$summary" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null

          if [ "$SELFTEST_OUTCOME" = 'success' ]; then
            close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -d "$close_payload" >/dev/null
          fi

      - name: Fail closed
        if: steps.selftest.outcome != 'success'
        run: exit 1
