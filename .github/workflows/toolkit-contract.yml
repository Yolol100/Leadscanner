name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'tool-registry.json'
      - 'LEADS-INTEGRATION.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'package.json'
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate standalone Leads toolkit contract
        run: |
          python3 - <<'PY'
          import json, pathlib
          c=json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert c['repository']=='Yolol100/Leadscanner'
          assert c['repository_role']=='central_leads_github_runtime'
          caps=c['capabilities']
          expected_caps={
              'prospect_discovery','prospect_intelligence','prospect_signal_discovery',
              'prospect_qualification','contact_enrichment','zero_touch_prepare',
              'website_evidence_scan','sender_readiness','inbox_placement',
              'mailbox_draft','outreach_delivery','dashboard',
          }
          assert set(caps) >= expected_caps, f'missing capabilities: {expected_caps-set(caps)}'
          scanner=caps['website_evidence_scan']
          assert scanner['read_only'] is True
          assert scanner['requires_account'] is False
          assert scanner['requires_api_key'] is False
          discovery=caps['prospect_discovery']
          assert discovery['send_permission']=='none'
          assert discovery['default_excluded_countries']==[]
          assert discovery['default_preferred_countries'][:2]==['US','NL']
          assert discovery['agency_exclusion_default'] is True
          assert 'directory_sitemap' in discovery['source_types']
          for key in ('OUTREACH_MAIL_PASSWORD','OUTREACH_MAILBOXES_JSON','OUTREACH_SEED_INBOXES_JSON','REOON_API_KEY'):
              assert key in discovery['forbidden_secrets']
          qualification=caps['prospect_qualification']
          assert qualification['send_permission']=='none'
          assert qualification['automatic_score_effect'] is True
          assert qualification['compliance_effect'] is False
          assert qualification['max_candidates_per_run']==25
          assert 'ProspectQualifications' in qualification['outputs']
          for key in ('OUTREACH_MAIL_PASSWORD','OUTREACH_MAILBOXES_JSON','OUTREACH_SEED_INBOXES_JSON','REOON_API_KEY'):
              assert key in qualification['forbidden_secrets']
          contact=caps['contact_enrichment']
          assert contact['send_permission']=='none'
          assert contact['input_boundary']=='qualified ProspectCandidates only'
          prepare=caps['zero_touch_prepare']
          assert prepare['send_permission']=='none'
          assert prepare['scheduled_default']=='prepare'
          assert 'status=prepared' in prepare['queue_contract']
          assert 'manual_review' in prepare['queue_contract']
          assert prepare['required_secrets']==['GOOGLE_SERVICE_ACCOUNT_JSON']
          for key in ('OUTREACH_MAIL_PASSWORD','OUTREACH_MAILBOXES_JSON','OUTREACH_SEED_INBOXES_JSON','REOON_API_KEY'):
              assert key in prepare['forbidden_secrets']
          readiness=caps['sender_readiness']
          assert readiness['send_permission']=='none'
          assert 'provider_managed' in readiness['provider_managed_relay']
          placement=caps['inbox_placement']
          assert placement['manual_only'] is True
          assert placement['manual_default']=='validate'
          assert placement['max_seed_inboxes']==5
          draft=caps['mailbox_draft']
          assert draft['manual_only'] is True
          assert draft['send_permission']=='none'
          assert draft['recipient_boundary']=='self_only for automated test route'
          assert draft['transport']=='IMAP APPEND + same-folder readback only'
          outreach=caps['outreach_delivery']
          assert outreach['manual_default']=='validate'
          assert 'REOON_API_KEY' in outreach['forbidden_secrets']
          assert outreach['live_gate']=='sender_readiness -> website target/evidence -> LeadPromo copy -> compliance -> SMTP'
          assert 'OUTREACH_POSTAL_ADDRESS' in outreach['optional_variables']
          assert 'website_scan' in outreach['target_evidence_contract']
          assert caps['dashboard']['send_permission']=='none'

          ids=[t['id'] for t in c['scanner_tools']]
          assert len(ids)==len(set(ids)), 'duplicate scanner tool ids'
          covered=set()
          for a in c['usage_assertions']:
              assert a['tool'] in ids
              p=pathlib.Path(a['path']); assert p.is_file(), f'missing {p}'
              assert a['contains'] in p.read_text(encoding='utf-8'), f"{a['tool']} not wired in {p}"
              covered.add(a['tool'])
          assert covered==set(ids), f'unwired scanner tools: {set(ids)-covered}'

          for required in (
              '.github/workflows/prospect-discovery.yml',
              '.github/workflows/leads-autopilot.yml',
              '.github/workflows/contact-enrichment.yml',
              '.github/workflows/sender-readiness.yml',
              '.github/workflows/inbox-placement.yml',
              '.github/workflows/myhost-draft-test.yml',
              '.github/workflows/outreach-smtp.yml',
              'scripts/prospect_discovery.py',
              'scripts/prospect_discovery_runtime.py',
              'scripts/prospect_target_policy.py',
              'scripts/prospect_qualification.py',
              'scripts/prospect_contact_enrichment.py',
              'scripts/outreach_prepare.py',
              'scripts/outreach_sender_readiness.py',
              'scripts/outreach_inbox_placement.py',
              'scripts/outreach_imap_draft.py',
              'scripts/outreach_target_evidence_preflight.py',
              'scripts/outreach_direct_smtp_runtime.py',
              'scripts/outreach_compliance_preflight.py',
              'scripts/outreach_replyhub.py',
          ):
              assert pathlib.Path(required).is_file(), f'missing Leads runtime file {required}'

          scan_workflow=pathlib.Path('.github/workflows/scan.yml').read_text(encoding='utf-8')
          assert "- 'sites.txt'" not in scan_workflow, 'sites.txt must not be a GitHub push trigger'

          discovery_workflow=pathlib.Path('.github/workflows/prospect-discovery.yml').read_text(encoding='utf-8')
          assert "PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES" in discovery_workflow
          assert "|| 'NL'" not in discovery_workflow
          assert "PROSPECT_DISCOVERY_PREFERRED_COUNTRIES" in discovery_workflow
          assert "US,NL,GB" in discovery_workflow
          assert "PROSPECT_DISCOVERY_EXCLUDE_AGENCIES" in discovery_workflow

          autopilot=pathlib.Path('.github/workflows/leads-autopilot.yml').read_text(encoding='utf-8')
          autopilot_trigger=autopilot.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in autopilot_trigger
          assert 'schedule:' in autopilot_trigger
          assert 'ops/leads-autopilot-request.txt' in autopilot_trigger
          assert 'scripts/prospect_qualification.py' in autopilot
          assert 'scripts/prospect_contact_enrichment.py' in autopilot
          assert 'scripts/outreach_prepare.py' in autopilot
          assert 'outreach_direct_smtp_runtime.py' not in autopilot
          assert 'OUTREACH_MAIL_PASSWORD' not in autopilot
          assert 'OUTREACH_MAILBOXES_JSON' not in autopilot
          assert 'OUTREACH_SEED_INBOXES_JSON' not in autopilot
          assert 'send permission:' in autopilot and 'none' in autopilot

          prepare_runtime=pathlib.Path('scripts/outreach_prepare.py').read_text(encoding='utf-8')
          assert '"status": "prepared"' in prepare_runtime
          assert '"compliance_status": "manual_review"' in prepare_runtime
          assert '"compliance_basis": ""' in prepare_runtime
          assert 'smtplib' not in prepare_runtime

          qualification_runtime=pathlib.Path('scripts/prospect_qualification.py').read_text(encoding='utf-8')
          assert 'QUALIFICATION_SHEET = "ProspectQualifications"' in qualification_runtime
          assert 'OPPORTUNITY_WEIGHT' in qualification_runtime
          assert 'STRONG_SHOP_HINTS' in qualification_runtime
          assert 'send_permission' in qualification_runtime

          draft_workflow=pathlib.Path('.github/workflows/myhost-draft-test.yml').read_text(encoding='utf-8')
          draft_trigger=draft_workflow.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in draft_trigger
          assert 'push:' not in draft_trigger
          assert 'schedule:' not in draft_trigger
          assert 'draft-test-request.txt' not in draft_workflow
          assert 'OUTREACH_DRAFT_SELF_ONLY' in draft_workflow
          assert 'outreach_imap_draft.py' in draft_workflow
          assert 'GOOGLE_SERVICE_ACCOUNT_JSON' not in draft_workflow
          assert 'outreach_direct_smtp_runtime.py' not in draft_workflow

          outreach_workflow=pathlib.Path('.github/workflows/outreach-smtp.yml').read_text(encoding='utf-8')
          order=[
              'Run sender preflight',
              'Run extended outreach contract preflight',
              'Run live sender readiness gate',
              'Run website target and evidence preflight',
              'Run LeadPromo copy preflight',
              'Run outreach compliance preflight',
              'Process approved outreach queue through mijn.host SMTP',
          ]
          positions=[outreach_workflow.index(name) for name in order]
          assert positions==sorted(positions), 'live outreach gate order drifted'
          assert "steps.policy.outputs.effective_mode == 'live'" in outreach_workflow
          assert "OUTREACH_READINESS_REQUIRE_GREEN: 'true'" in outreach_workflow
          assert 'OUTREACH_POSTAL_ADDRESS' in outreach_workflow
          assert 'outreach_target_evidence_preflight.py' in outreach_workflow

          integration=pathlib.Path('LEADS-INTEGRATION.md').read_text(encoding='utf-8')
          assert '## Capability 6 — mailbox_draft' in integration, 'integration docs omit mailbox_draft'
          assert '## Capability 11 — prospect_qualification' in integration
          assert '## Capability 12 — zero_touch_prepare' in integration
          assert '-> live sender readiness gate\n-> website target + evidence preflight\n-> LeadPromo copy preflight' in integration, 'integration docs omit website target/evidence gate'
          assert 'laat `NL` standaard toe' in integration
          assert '`US` eerst, `NL` tweede' in integration
          assert 'webactueel.nl' in integration
          assert 'website_scan:<JSON>' in integration
          assert 'provider_managed' in integration
          assert 'ProspectQualifications' in integration
          for doc in ('README.md','AGENTS.md'):
              text=pathlib.Path(doc).read_text(encoding='utf-8')
              assert 'mailbox_draft' in text, f'{doc} omits mailbox_draft'
              assert 'toolkit-contract.json' in text, f'{doc} does not point to machine contract'
              assert 'LEADS-INTEGRATION.md' in text, f'{doc} does not point to human contract'

          registry=json.load(open('tool-registry.json', encoding='utf-8'))
          assert registry['repository_role']=='central_leads_github_runtime'
          assert set(registry['capabilities']) >= expected_caps
          assert registry['capabilities']['website_evidence_scan']['read_only'] is True
          assert registry['capabilities']['prospect_qualification']['max_candidates_per_run']==25
          assert registry['capabilities']['zero_touch_prepare']['send_permission']=='none'
          assert registry['capabilities']['mailbox_draft']['send_permission']=='none'
          assert registry['capabilities']['outreach_delivery']['live_gate']=='sender_readiness -> website target/evidence -> LeadPromo copy -> compliance -> SMTP'
          assert registry['policy']['prospect_target_policy_enforced'] is True
          assert registry['policy']['prospect_qualification_evidence_bound'] is True
          assert registry['policy']['zero_touch_prepare_no_send'] is True
          assert registry['policy']['changes_compliance_automatically'] is False
          assert registry['policy']['prepared_copy_never_send_permission'] is True
          assert registry['policy']['outreach_requires_website_scan_evidence'] is True
          assert registry['tools']['axe_core']['automatic_score_effect'] is False
          print('toolkit-contract: OK')
          PY
