name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'tool-registry.json'
      - 'LEADS-INTEGRATION.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Leads v17.1 signal policy and v17.3 copy runtime
        run: |
          python3 - <<'PY'
          import json, pathlib
          c=json.load(open('toolkit-contract.json', encoding='utf-8'))
          r=json.load(open('tool-registry.json', encoding='utf-8'))

          route=c['default_route']
          assert c['schema_version']=='3.2'
          assert c['repository']=='Yolol100/Leadscanner'
          assert route['id']=='filter_core_v17'
          assert route['source_set_version']=='17.1.0-signal-policy'
          assert route['copy_policy_version']=='17.3.0'
          assert route['copy_source_version']=='17.3.0'
          assert route['send_permission']=='none'
          assert route['one_offer'] is True

          hard=set(c['hard_filter']['all_required'])
          assert 'real_company_and_official_site_or_bounded_website_absent_exception' in hard
          assert 'public_business_email_from_official_source' in hard
          assert c['hard_filter']['failure_action']=='skip_and_refill'

          signal=c['signal_policy']
          assert signal['module']=='src/tools/prospect-signal-policy.mjs'
          assert signal['active_ads']=='discovery_priority_only'
          assert signal['inactive_social']=='discovery_priority_only'
          assert signal['llms_txt']=='not_standalone_search_visibility_evidence'

          copy=c['copy_contract']
          assert copy['module']=='scripts/outreach_copy_v17_3.py'
          assert copy['policy_version']=='17.3.0'
          assert copy['policy_source_version']=='17.3.0'
          assert copy['human_language_gate_required'] is True
          assert copy['prepared_artifact_claim_requires_readback'] is True
          assert copy['unsupported_inferred_claims_forbidden'] is True
          assert c['mailbox_contract']['copy_gate']=='scripts/outreach_copy_v17_3.py::initial_copy_errors'

          assert r['version']=='5.3'
          p=r['policy']
          assert p['default_source_set_version']=='17.1.0-signal-policy'
          assert p['copy_policy_version']=='17.3.0'
          assert p['copy_source_version']=='17.3.0'
          assert p['copy_module']=='scripts/outreach_copy_v17_3.py'
          assert p['unsupported_inferred_claims_forbidden'] is True
          assert p['signal_policy_module']=='src/tools/prospect-signal-policy.mjs'
          assert p['draft_only'] is True and p['send_permission']=='none'
          assert r['capabilities']['prospect_signal_policy']['llms_txt']=='not_standalone_search_visibility_evidence'
          assert r['capabilities']['mailbox_draft']['copy_validator']=='scripts/outreach_copy_v17_3.py::initial_copy_errors'

          for item in (
            'src/tools/prospect-signal-policy.mjs',
            'test/prospect-signal-policy.test.mjs',
            'scripts/outreach_copy_v17_2.py',
            'scripts/outreach_copy_v17_3.py',
            'scripts/outreach_queue_imap_draft.py',
            'tests/test_outreach_copy_v17_3.py',
            '.github/workflows/sync-selected-myhost-drafts-command.yml',
          ):
            assert pathlib.Path(item).is_file(), item

          copy_text=pathlib.Path('scripts/outreach_copy_v17_3.py').read_text(encoding='utf-8')
          queue_text=pathlib.Path('scripts/outreach_queue_imap_draft.py').read_text(encoding='utf-8')
          assert 'POLICY_VERSION = "17.3.0"' in copy_text
          assert 'unsupported inferred claim' in copy_text
          assert 'artifact readback proof' in copy_text
          assert 'from outreach_copy_v17_3 import initial_copy_errors' in queue_text
          assert 'artifact_readback_ready' in queue_text

          integration=pathlib.Path('LEADS-INTEGRATION.md').read_text(encoding='utf-8')
          agents=pathlib.Path('AGENTS.md').read_text(encoding='utf-8')
          readme=pathlib.Path('README.md').read_text(encoding='utf-8')
          assert 'V17.3' in integration and 'send_permission=none' in integration
          assert '17.1.0-signal-policy' in agents and 'V17.3.0' in agents
          assert '63 scenarios' in readme
          print('toolkit-contract Leads v17.1 signal policy / v17.3 copy runtime: OK')
          PY
