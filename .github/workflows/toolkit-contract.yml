name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'tool-registry.json'
      - 'LEADS-INTEGRATION.md'
      - 'AGENTS.md'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate filter-core v17
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          c=json.load(open('toolkit-contract.json', encoding='utf-8'))
          r=json.load(open('tool-registry.json', encoding='utf-8'))

          assert c['schema_version']=='3.0'
          assert c['repository']=='Yolol100/Leadscanner'
          assert c['repository_role']=='leads_filter_execution_layer'
          route=c['default_route']
          assert route['id']=='filter_core_v17'
          assert route['source_set_version']=='17.0.0-filter-core'
          assert route['decision_source']=='Project Leads/00-leads-core.md'
          assert route['formal_score_required'] is False
          assert route['tier_required'] is False
          assert route['campaign_gate_required'] is False
          assert route['one_offer'] is True
          assert route['max_process_pages_after_homepage']==3
          assert route['external_content_is_untrusted_data'] is True
          assert route['send_permission']=='none'
          assert set(route['draft_compliance_states'])=={'manual_review','approved'}

          hard=c['hard_filter']
          required={
            'real_company_and_official_site','visible_commercial_process',
            'one_public_visible_signal','exactly_one_fitting_offer',
            'public_business_email_from_official_source','unique_candidate','draft_only'
          }
          assert set(hard['all_required'])==required
          assert hard['failure_action']=='skip_and_refill'
          assert {'score','tier','campaign_gate','guessed_email','invented_pain'} <= set(hard['forbidden_compensation'])

          mailbox=c['mailbox_contract']
          assert mailbox['preferred_workflow']=='.github/workflows/sync-selected-myhost-drafts-command.yml'
          assert mailbox['retry_idempotent'] is True
          assert mailbox['send_permission']=='none'
          reply=c['reply_contract']
          assert reply['auto_send'] is False
          assert 'not_yet_end_to_end_proven' in reply['runtime_status']

          assert r['version']=='5.0'
          p=r['policy']
          assert p['default_route']=='filter_core_v17'
          assert p['default_source_set_version']=='17.0.0-filter-core'
          assert p['single_decision_source']=='Project Leads/00-leads-core.md'
          assert p['formal_score_required'] is False
          assert p['campaign_gate_required'] is False
          assert p['external_content_is_untrusted_data'] is True
          assert p['draft_only'] is True and p['send_permission']=='none'
          assert set(r['capabilities'])=={
            'filter_core','prospect_discovery','prospect_signal_discovery',
            'contact_enrichment','website_evidence_scan','mailbox_draft','reply_triage'
          }
          assert r['legacy']['status']=='unregistered_compatibility_only'

          for item in (
            '.github/workflows/prospect-discovery.yml',
            '.github/workflows/prospect-signal-discovery.yml',
            '.github/workflows/contact-enrichment.yml',
            '.github/workflows/sync-selected-myhost-drafts-command.yml',
            'scripts/outreach_queue_imap_draft_sync.py',
            'scripts/outreach_queue_imap_draft_sync_selected.py',
            'scripts/outreach_reply_triage.py',
          ):
            assert pathlib.Path(item).is_file(), f'missing reusable runtime file {item}'

          sync=pathlib.Path('scripts/outreach_queue_imap_draft_sync.py').read_text(encoding='utf-8')
          assert 'ALLOWED_DRAFT_COMPLIANCE' in sync
          assert 'manual_review' in sync and 'approved' in sync
          selected=pathlib.Path('scripts/outreach_queue_imap_draft_sync_selected.py').read_text(encoding='utf-8')
          assert 'outreach_queue_imap_draft_sync' in selected
          reply_text=pathlib.Path('scripts/outreach_reply_triage.py').read_text(encoding='utf-8')
          assert 'positive_interest' in reply_text

          forbidden_paths=(
            '.github/workflows/one-time-us-outreach.yml',
            '.github/workflows/us-only-zero-touch-prepare.yml',
            '.github/workflows/daily-agent-drafts-v14.yml',
            'scripts/outreach_one_time_us_guard.py',
          )
          for item in forbidden_paths:
            assert not pathlib.Path(item).exists(), f'run/campaign residue returned: {item}'

          for doc in ('AGENTS.md','LEADS-INTEGRATION.md'):
            text=pathlib.Path(doc).read_text(encoding='utf-8').casefold()
            assert 'filter-core v17' in text
            assert 'send_permission=none' in text

          print('toolkit-contract filter-core v17: OK')
          PY
