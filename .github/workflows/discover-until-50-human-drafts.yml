name: Discover Until 50 Human mijn.host Drafts

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/discover-until-50-human-drafts.yml'

permissions:
  contents: read

concurrency:
  group: discover-until-50-human-drafts-20260910
  cancel-in-progress: false

jobs:
  discover-fill-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '20'
      PROSPECT_DISCOVERY_MODE: discover
      PROSPECT_DISCOVERY_MAX_TOTAL: '200'
      PROSPECT_DISCOVERY_TARGET_NEW: '200'
      PROSPECT_DISCOVERY_TIMEOUT_SECONDS: '8'
      PROSPECT_DISCOVERY_MAX_BYTES: '2097152'
      PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS: '0.25'
      PROSPECT_DISCOVERY_USER_AGENT: WebactueelProspectDiscovery/1.0 (+https://andrewbaeten.nl)
      PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES: NL,DE,BE,GB,UK
      PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: US
      PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: 'true'

    steps:
      - name: Checkout temporary execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require bounded Sheet and mailbox credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          test -n "${OUTREACH_MAIL_PASSWORD:-}" || { echo '::error::OUTREACH_MAIL_PASSWORD is required'; exit 1; }
          echo 'RUNTIME_CREDENTIALS=present'

      - name: Load private outreach footer config
        run: python3 scripts/outreach_private_config.py

      - name: Discover and qualify fresh approved US sources until 50 are human-ready
        shell: bash
        run: |
          set -euo pipefail

          count_ready() {
            local out ready
            out="$(python3 ops/finalize_50_human_drafts.py --count-only)"
            printf '%s\n' "$out"
            ready="$(printf '%s\n' "$out" | sed -n 's/^FINAL_HUMAN_READY=//p' | tail -n 1)"
            test -n "$ready" || { echo '::error::Could not read FINAL_HUMAN_READY count'; exit 2; }
            printf '%s' "$ready"
          }

          ready="$(count_ready | tail -n 1)"
          echo "READY_AT_START=${ready}"

          for wave in 1 2 3 4 5; do
            if [ "$ready" -ge 50 ]; then
              break
            fi

            echo "DISCOVERY_WAVE=${wave} ready_before=${ready}"
            python3 scripts/prospect_discovery_runtime.py \
              --mode discover \
              --report "prospect-discovery-fresh-${wave}.json" \
              | tee "prospect-discovery-fresh-${wave}.log"

            discovered="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("discovered",0)))' "prospect-discovery-fresh-${wave}.json")"
            echo "DISCOVERY_WAVE_RESULT=${wave} discovered=${discovered}"

            python3 ops/targeted_us_quote_fill_fresh.py \
              --target-new 40 \
              --max-assess 250 \
              --report "fresh-us-quote-fill-${wave}.json" \
              | tee "fresh-us-quote-fill-${wave}.log"

            ready="$(count_ready | tail -n 1)"
            echo "READY_AFTER_WAVE=${wave} count=${ready}"

            prepared="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("prepared",0)))' "fresh-us-quote-fill-${wave}.json")"
            if [ "$discovered" -eq 0 ] && [ "$prepared" -eq 0 ]; then
              echo "NO_MORE_APPROVED_SOURCE_HEADROOM=wave_${wave}"
              break
            fi
          done

          echo "FINAL_READY_BEFORE_DRAFT=${ready}"
          if [ "$ready" -lt 50 ]; then
            echo "::error::Only ${ready} human-ready leads after exhausting bounded fresh discovery waves."
            exit 2
          fi

      - name: Create exactly 50 idempotent human drafts and verify 50/50 readback
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/finalize_50_human_drafts.py | tee final-50-human-drafts.log
          grep -q '^LEADS50_FINAL=green selected=50 drafts=50 .*smtp_send=not_invoked$' final-50-human-drafts.log

      - name: Write final execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Discover until 50 human mijn.host drafts'
            echo '- campaign: `US manufacturing / quote_intake`'
            echo '- discovery: `approved + enabled Project Leads sources only; fresh canonical domains only`'
            echo '- qualification: `A only; official homepage + max one same-site quote/intake page`'
            echo '- contact: `public official business email + aligned domain + MX ready`'
            echo '- copy: `specific official-site anchor + natural one-to-one wording; no prospect-facing AI/automation/bot/ROI/agent jargon`'
            echo '- queue: `manual_review; compliance basis blank; no send permission`'
            echo '- mailbox: `info@andrewbaeten.nl via mijn.host IMAP Drafts only`'
            echo '- draft proof: `deterministic unique header + exact 50/50 same-folder readback`'
            echo '- SMTP: `not invoked`'
            echo '- main branch: `untouched`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded evidence receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discover-until-50-human-drafts-${{ github.run_id }}
          path: |
            prospect-discovery-fresh-*.json
            prospect-discovery-fresh-*.log
            fresh-us-quote-fill-*.json
            fresh-us-quote-fill-*.log
            selected-50-final.json
            draft-receipts-final.json
            final-50-human-drafts.log
          if-no-files-found: ignore
          retention-days: 14
