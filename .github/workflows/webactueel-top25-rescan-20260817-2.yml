name: Webactueel Top25 Rescan 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-top25-rescan-20260817-2.yml'

permissions:
  contents: read

concurrency:
  group: webactueel-top25-rescan-20260817-2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify scanner dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check:crawler
          npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare explicit 25-site input
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sites = [
            'https://www.tuinvisioen.nl/',
            'https://www.dakdekkerbrummer.nl/',
            'https://www.installatiebedrijfkamp.nl/',
            'https://jvkdaken.nl/dakdekker-rotterdam/',
            'https://www.pimvanalphen.nl/',
            'https://roofix-dakdekkers.nl/dakdekker-rotterdam',
            'https://schildersbedrijf-denhaag.nl/',
            'https://vandongen-installateurs.nl/',
            'https://www.vijfsterrenschilders.nl/',
            'https://www.bartlansdaaltuinaanleg.nl/',
            'https://www.benroos.nl/dakdekker-rotterdam/',
            'https://www.callunatuindesign.nl/',
            'https://dakadviesgroep.nl/dakdekker-rotterdam/',
            'https://www.denhaanrenovators.nl/nl/home',
            'https://www.heijstekschilders.nl/',
            'https://gecotuin.nl/',
            'https://www.groenprojectenmadestein.nl/hovenier-westland/',
            'https://hagemaninstallatie.nl/',
            'https://www.snijdershoveniers.nl/',
            'https://kalmaschilders.nl/',
            'https://kuijpers-tuinen.nl/',
            'https://www.parkstaeteschilderwerken.nl/',
            'https://selektdak.nl/regio/dakdekker-rotterdam/',
            'https://www.spijkersdakgroep.nl/zuid-holland/rotterdam/',
            'https://www.spotshoveniers.nl/'
          ];
          if (sites.length !== 25 || new Set(sites).size !== 25) throw new Error('Top25 input must contain 25 unique URLs');
          fs.writeFileSync('sites.txt', sites.join('\n') + '\n');
          NODE

      - name: Run explicit 25-site rescan
        env:
          REQUIRE_SINGLE_TARGET: 'false'
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '2'
          MAX_REQUESTS_PER_MINUTE: '30'
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          echo "Explicit user-requested top-25 rescan. Failed sites are recorded and skipped; remaining sites continue." >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-top25-rescan-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7
