name: Webactueel Batch Rescan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-batch-rescan.yml'

permissions:
  contents: read

concurrency:
  group: webactueel-explicit-batch-rescan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify scanner dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check:crawler
          npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run explicit 60-site rescan
        env:
          REQUIRE_SINGLE_TARGET: 'false'
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '2'
          MAX_REQUESTS_PER_MINUTE: '30'
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Run supplemental checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'false'
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          echo "Explicit user-requested 60-site batch rescan." >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-batch-rescan-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7
