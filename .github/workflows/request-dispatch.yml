name: Website Scan Request Dispatch

on:
  push:
    branches: ['runtime/**']
    paths:
      - 'requests/scan.json'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate request and dispatch Website Scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dispatch.json
          import json, os
          from pathlib import Path

          request = json.loads(Path('requests/scan.json').read_text(encoding='utf-8'))
          if request.get('enabled') is not True:
              raise SystemExit('request is not enabled')
          if request.get('owner') != 'leads' or request.get('project_id') != 'project-leads':
              raise SystemExit('request owner/project mismatch')
          source = request.get('source_context') or {}
          if source.get('project_id') != 'project-leads' or not source.get('source_set_version'):
              raise SystemExit('invalid source context')
          target = request.get('target_url')
          if not isinstance(target, str) or not target.startswith(('https://', 'http://')):
              raise SystemExit('invalid target_url')
          hint = request.get('site_type_hint') or ''
          if hint not in ('', 'service', 'shop', 'booking'):
              raise SystemExit('invalid site_type_hint')
          payload = {
              'ref': os.environ['GITHUB_REF_NAME'],
              'inputs': {
                  'target_url': target,
                  'site_type_hint': hint,
                  'run_lighthouse': bool(request.get('run_lighthouse', False)),
                  'run_language_tool': bool(request.get('run_language_tool', False)),
                  'max_concurrency': str(request.get('max_concurrency', 2)),
                  'max_requests_per_minute': str(request.get('max_requests_per_minute', 30)),
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
      - name: Wait for canonical scan and persist provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          run_json=""
          for attempt in $(seq 1 60); do
            runs=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/runs?event=workflow_dispatch&per_page=50")
            run_json=$(RUNS="$runs" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['RUNS'])
          branch = os.environ['GITHUB_REF_NAME']
          for run in payload.get('workflow_runs', []):
              if run.get('head_branch') == branch and run.get('event') == 'workflow_dispatch':
                  print(json.dumps(run, separators=(',', ':')))
                  break
          PY
          )
            if [ -n "$run_json" ]; then
              run_id=$(RUN="$run_json" python -c "import json,os; print(json.loads(os.environ['RUN'])['id'])")
              break
            fi
            sleep 2
          done
          test -n "$run_id"

          status=""
          for attempt in $(seq 1 240); do
            run_json=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(RUN="$run_json" python -c "import json,os; print(json.loads(os.environ['RUN'])['status'])")
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done
          test "$status" = "completed"

          mkdir -p runtime
          RUN="$run_json" python - <<'PY'
          import json, os
          run = json.loads(os.environ['RUN'])
          payload = {
              'format': 'webactueel-leadscanner-run-meta/1.1',
              'workflow_name': run.get('name'),
              'run_id': run.get('id'),
              'run_number': run.get('run_number'),
              'run_attempt': run.get('run_attempt'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'head_sha': run.get('head_sha'),
              'head_branch': run.get('head_branch'),
              'event': run.get('event'),
              'run_url': run.get('html_url'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
          }
          with open('runtime/run-meta.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/run-meta.json
          git commit -m 'chore(runtime): record canonical Website Scan provenance'
          git push origin "HEAD:${GITHUB_REF_NAME}"
