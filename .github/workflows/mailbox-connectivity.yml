name: Mailbox Connectivity Check

on:
  workflow_dispatch:
    inputs:
      require_auth:
        description: 'Fail if mailbox authentication cannot be proven'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mailbox-connectivity.yml'
      - 'scripts/outreach_mailbox_connectivity.py'
      - 'scripts/outreach_preflight.py'
      - 'scripts/outreach_mailboxes.py'

permissions:
  contents: read

concurrency:
  group: mailbox-connectivity-check
  cancel-in-progress: true

jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install outreach runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Probe encrypted transport and authenticate when credentials exist
        env:
          OUTREACH_CONNECTIVITY_REQUIRE_AUTH: ${{ github.event_name == 'workflow_dispatch' && inputs.require_auth && 'true' || 'false' }}
          OUTREACH_DAILY_LIMIT: ${{ vars.OUTREACH_DAILY_LIMIT || '20' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DKIM_SELECTOR: ${{ vars.OUTREACH_DKIM_SELECTOR || 'x' }}
          OUTREACH_REQUIRED_SPF_TOKEN: ${{ vars.OUTREACH_REQUIRED_SPF_TOKEN || 'include:spf.mijn.host' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_mailbox_connectivity.py | tee mailbox-connectivity.txt
          {
            echo '## Mailbox connectivity'
            echo '```text'
            cat mailbox-connectivity.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
