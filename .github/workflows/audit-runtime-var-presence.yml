name: Audit Runtime Variable Presence

on:
  push:
    branches:
      - audit/repository-hygiene-vars-20260905
    paths:
      - '.github/workflows/audit-runtime-var-presence.yml'

permissions:
  contents: read

jobs:
  variable:
    name: var-${{ matrix.variable }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variable:
          - OUTREACH_SPREADSHEET_ID
          - OUTREACH_TIMEZONE
          - OUTREACH_MAILBOX_ID
          - OUTREACH_SMTP_HOST
          - OUTREACH_SMTP_PORT
          - OUTREACH_IMAP_HOST
          - OUTREACH_IMAP_PORT
          - OUTREACH_MAIL_USER
          - OUTREACH_SENDER_NAME
          - OUTREACH_SENDER_EMAIL
          - OUTREACH_DKIM_SELECTOR
          - OUTREACH_REQUIRED_SPF_TOKEN
    steps:
      - name: Require configured non-secret variable
        env:
          VALUE: ${{ vars[matrix.variable] }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VALUE"
