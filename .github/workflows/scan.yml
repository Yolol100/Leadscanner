name: Website Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optioneel: scan één website. Leeg = gebruik sites.txt'
        required: false
        type: string
      run_lighthouse:
        description: 'Lighthouse uitvoeren bij sterke kandidaten (kost extra tijd)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lead scanner
        env:
          TARGET_URL: ${{ inputs.target_url }}
          RUN_LIGHTHOUSE: ${{ inputs.run_lighthouse }}
        run: npm run scan

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadscanner-results-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
