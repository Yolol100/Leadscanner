name: Website Scan

on:
  push:
    branches: ['runtime/**']
    paths:
      - 'requests/scan.json'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Verplicht: scan precies deze officiële bedrijfswebsite'
        required: true
        type: string
      site_type_hint:
        description: 'Leads-context: service, shop of booking (optioneel maar aanbevolen)'
        required: false
        type: string
      run_lighthouse:
        description: 'Lighthouse uitvoeren bij sterke kandidaten (kost extra tijd)'
        required: true
        default: false
        type: boolean
      run_language_tool:
        description: 'Lokale vastgepinde LanguageTool-controle uitvoeren'
        required: true
        default: false
        type: boolean
      max_concurrency:
        description: 'Maximaal aantal websites tegelijk (1-4)'
        required: true
        default: '2'
        type: string
      max_requests_per_minute:
        description: 'Maximaal aantal website-starts per minuut (1-120); geen claim over alle subresources'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: leadscanner-full-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-request:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      target_url: ${{ steps.resolve.outputs.target_url }}
      site_type_hint: ${{ steps.resolve.outputs.site_type_hint }}
      run_lighthouse: ${{ steps.resolve.outputs.run_lighthouse }}
      run_language_tool: ${{ steps.resolve.outputs.run_language_tool }}
      max_concurrency: ${{ steps.resolve.outputs.max_concurrency }}
      max_requests_per_minute: ${{ steps.resolve.outputs.max_requests_per_minute }}
      require_single_target: ${{ steps.resolve.outputs.require_single_target }}
    steps:
      - name: Checkout request contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate trigger
        id: resolve
        shell: bash
        env:
          DISPATCH_TARGET_URL: ${{ inputs.target_url }}
          DISPATCH_SITE_TYPE_HINT: ${{ inputs.site_type_hint }}
          DISPATCH_RUN_LIGHTHOUSE: ${{ inputs.run_lighthouse || 'false' }}
          DISPATCH_RUN_LANGUAGE_TOOL: ${{ inputs.run_language_tool || 'false' }}
          DISPATCH_MAX_CONCURRENCY: ${{ inputs.max_concurrency || '2' }}
          DISPATCH_MAX_REQUESTS_PER_MINUTE: ${{ inputs.max_requests_per_minute || '30' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const output = process.env.GITHUB_OUTPUT;
          const write = (key, value) => fs.appendFileSync(output, `${key}=${String(value)}\n`);
          const safeId = (value) => typeof value === 'string' && /^[A-Za-z0-9._-]{3,80}$/.test(value);
          const safeText = (value) => typeof value === 'string' && value.trim().length > 0 && !/[\r\n]/.test(value);
          const safeInt = (value, min, max, fallback) => {
            const parsed = Number(value ?? fallback);
            if (!Number.isInteger(parsed) || parsed < min || parsed > max) throw new Error(`integer out of range ${min}-${max}`);
            return String(parsed);
          };
          const safeBool = (value, fallback = false) => {
            if (value === undefined || value === null || value === '') return String(fallback);
            if (value === true || value === 'true') return 'true';
            if (value === false || value === 'false') return 'false';
            throw new Error('boolean expected');
          };
          const defaults = {
            run: 'false', request_id: 'none', target_url: '', site_type_hint: '',
            run_lighthouse: 'false', run_language_tool: 'false', max_concurrency: '2',
            max_requests_per_minute: '30', require_single_target: 'false'
          };
          let resolved = {...defaults};

          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            const target = process.env.DISPATCH_TARGET_URL || '';
            new URL(target);
            const hint = process.env.DISPATCH_SITE_TYPE_HINT || '';
            if (hint && !['service', 'shop', 'booking'].includes(hint)) throw new Error('invalid site_type_hint');
            resolved = {
              run: 'true', request_id: `dispatch-${process.env.GITHUB_RUN_ID}`,
              target_url: target, site_type_hint: hint,
              run_lighthouse: safeBool(process.env.DISPATCH_RUN_LIGHTHOUSE),
              run_language_tool: safeBool(process.env.DISPATCH_RUN_LANGUAGE_TOOL),
              max_concurrency: safeInt(process.env.DISPATCH_MAX_CONCURRENCY, 1, 4, 2),
              max_requests_per_minute: safeInt(process.env.DISPATCH_MAX_REQUESTS_PER_MINUTE, 1, 120, 30),
              require_single_target: 'true'
            };
          } else if (process.env.GITHUB_EVENT_NAME === 'push') {
            const requestPath = path.join(process.env.GITHUB_WORKSPACE, 'requests/scan.json');
            if (!fs.existsSync(requestPath)) throw new Error('missing requests/scan.json for runtime push');
            const req = JSON.parse(fs.readFileSync(requestPath, 'utf8'));
            if (req.enabled === true) {
              if (!safeId(req.request_id)) throw new Error('invalid request_id');
              if (req.owner !== 'leads' || req.project_id !== 'project-leads') throw new Error('request owner/project mismatch');
              for (const key of ['for', 'task', 'why', 'trigger_when', 'do_not_trigger_when', 'requested_by']) {
                if (!safeText(req[key])) throw new Error(`missing or unsafe ${key}`);
              }
              if (!req.source_context || req.source_context.project_id !== 'project-leads' || !safeText(req.source_context.source_set_version)) {
                throw new Error('invalid source_context');
              }
              const target = req.target_url || '';
              new URL(target);
              const hint = req.site_type_hint || '';
              if (hint && !['service', 'shop', 'booking'].includes(hint)) throw new Error('invalid site_type_hint');
              resolved = {
                run: 'true', request_id: req.request_id, target_url: target, site_type_hint: hint,
                run_lighthouse: safeBool(req.run_lighthouse),
                run_language_tool: safeBool(req.run_language_tool),
                max_concurrency: safeInt(req.max_concurrency, 1, 4, 2),
                max_requests_per_minute: safeInt(req.max_requests_per_minute, 1, 120, 30),
                require_single_target: 'true'
              };
            }
          }

          for (const [key, value] of Object.entries(resolved)) write(key, value);
          NODE

  scan:
    needs: resolve-request
    if: needs.resolve-request.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Crawlee and Playwright
        run: npm run check:crawler
      - name: Verify toolbox dependencies
        run: npm run check:tools
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run lead scanner
        env:
          TARGET_URL: ${{ needs.resolve-request.outputs.target_url }}
          REQUIRE_SINGLE_TARGET: ${{ needs.resolve-request.outputs.require_single_target }}
          SITE_TYPE_HINT: ${{ needs.resolve-request.outputs.site_type_hint }}
          RUN_LIGHTHOUSE: ${{ needs.resolve-request.outputs.run_lighthouse }}
          MAX_CONCURRENCY: ${{ needs.resolve-request.outputs.max_concurrency }}
          MAX_REQUESTS_PER_MINUTE: ${{ needs.resolve-request.outputs.max_requests_per_minute }}
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan
      - name: Setup Java 17 for LanguageTool
        if: needs.resolve-request.outputs.run_language_tool == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Start pinned local LanguageTool
        if: needs.resolve-request.outputs.run_language_tool == 'true'
        run: bash scripts/start-languagetool.sh
      - name: Run supplemental toolbox checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: ${{ needs.resolve-request.outputs.run_language_tool }}
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich
      - name: Build Leads handoff
        run: npm run handoff:leads
      - name: Publish scan summary
        if: always()
        run: |
          echo "Request: ${{ needs.resolve-request.outputs.request_id }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: leadscanner-results-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
