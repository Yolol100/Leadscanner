name: Website Scan

on:
  push:
    branches: [main]
    paths:
      - 'sites.txt'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optioneel: scan één website. Leeg = gebruik sites.txt'
        required: false
        type: string
      run_lighthouse:
        description: 'Lighthouse uitvoeren bij sterke kandidaten (kost extra tijd)'
        required: true
        default: false
        type: boolean
      run_language_tool:
        description: 'Lokale LanguageTool-controle uitvoeren (geen account/API-key)'
        required: true
        default: false
        type: boolean
      max_concurrency:
        description: 'Maximaal aantal websites tegelijk (1-4)'
        required: true
        default: '2'
        type: string
      max_requests_per_minute:
        description: 'Crawlee startlimiet per minuut (1-120)'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: leadscanner-full-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22.23.2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Crawlee and Playwright
        run: npm run check:crawler

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run lead scanner
        env:
          TARGET_URL: ${{ inputs.target_url }}
          RUN_LIGHTHOUSE: ${{ inputs.run_lighthouse || 'false' }}
          MAX_CONCURRENCY: ${{ inputs.max_concurrency || '2' }}
          MAX_REQUESTS_PER_MINUTE: ${{ inputs.max_requests_per_minute || '30' }}
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_language_tool }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start local LanguageTool
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_language_tool }}
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental toolbox checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: ${{ inputs.run_language_tool || 'false' }}
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Publish scan summary
        if: always()
        run: |
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadscanner-results-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
