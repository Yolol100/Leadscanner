name: Website Scan

on:
  push:
    branches: [main]
    paths:
      - 'sites.txt'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Verplicht: scan precies deze officiële bedrijfswebsite'
        required: true
        type: string
      site_type_hint:
        description: 'Leads-context: service, shop of booking (optioneel maar aanbevolen)'
        required: false
        type: string
      run_lighthouse:
        description: 'Lighthouse uitvoeren bij sterke kandidaten (kost extra tijd)'
        required: true
        default: false
        type: boolean
      run_language_tool:
        description: 'Lokale vastgepinde LanguageTool-controle uitvoeren'
        required: true
        default: false
        type: boolean
      max_concurrency:
        description: 'Maximaal aantal websites tegelijk (1-4)'
        required: true
        default: '2'
        type: string
      max_requests_per_minute:
        description: 'Maximaal aantal website-starts per minuut (1-120); geen claim over alle subresources'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: leadscanner-full-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Crawlee and Playwright
        run: npm run check:crawler

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run lead scanner
        env:
          TARGET_URL: ${{ inputs.target_url }}
          REQUIRE_SINGLE_TARGET: ${{ github.event_name == 'workflow_dispatch' }}
          SITE_TYPE_HINT: ${{ inputs.site_type_hint }}
          RUN_LIGHTHOUSE: ${{ inputs.run_lighthouse || 'false' }}
          MAX_CONCURRENCY: ${{ inputs.max_concurrency || '2' }}
          MAX_REQUESTS_PER_MINUTE: ${{ inputs.max_requests_per_minute || '30' }}
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_language_tool }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_language_tool }}
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental toolbox checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: ${{ inputs.run_language_tool || 'false' }}
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadscanner-results-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
