name: Leadscanner Smoke Launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/lead-smoke.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch configured smoke run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s .github/lead-smoke.json
          jq -e '
            (.execution_mode == "preview" or .execution_mode == "draft") and
            (.confirm_review_drafts | type == "boolean")
          ' .github/lead-smoke.json >/dev/null
          payload=$(jq -c '{
            ref: "main",
            inputs: {
              execution_mode: .execution_mode,
              confirm_review_drafts: .confirm_review_drafts,
              approved_review_tokens: (.approved_review_tokens // ""),
              preview_run_id: (.preview_run_id // ""),
              region: (.region // ""),
              keywords: (.keywords // ""),
              target_candidates: ((.target_candidates // 20) | tostring),
              verify_limit: ((.verify_limit // 12) | tostring),
              radius_km: ((.radius_km // 5) | tostring)
            }
          }' .github/lead-smoke.json)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/leads-cold.yml/dispatches" \
            --data "$payload"
          echo "SMOKE_DISPATCH=green mode=$(jq -r .execution_mode .github/lead-smoke.json)"
