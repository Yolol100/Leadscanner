name: Webactueel Rest35 Rescan 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-rest35-rescan-20260817.yml'

permissions:
  contents: read

concurrency:
  group: webactueel-rest35-rescan-20260817
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify scanner dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check:crawler
          npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare explicit 35-site input
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sites = [
            'https://dakenisolatie.com/',
            'https://www.dakdekkers-vanleeuwen.nl/dakdekker-rotterdam/',
            'https://dak-brouwer.nl/rotterdam/',
            'https://dakkersland.nl/dakdekker-rotterdam/',
            'https://www.danielsnijders.nl/',
            'https://www.douwschilderwerken.nl/',
            'https://esveldinstallatie.nl/',
            'https://www.excellentgarden.nl/',
            'https://www.hanvosinstallaties.nl/installateur-in-zuidholland',
            'https://www.hollandwarmte.nl/',
            'https://www.hoogendoorntechniek.com/',
            'https://industriatechniek.nl/',
            'https://www.jpinstallatietechniek.nl/',
            'https://joostbakker.nl/',
            'https://www.schildersbedrijf-lmuyres.nl/',
            'https://mrdakdekkerrotterdam.nl/',
            'https://www.nestorservice.nl/',
            'https://nietzmanschilderwerken.nl/',
            'https://rkschilder.nl/',
            'https://schilderwerkenrsb.nl/',
            'https://rovaal-dakbeheer.nl/',
            'https://schildersbedrijfromario.nl/',
            'https://www.sibbingschilderwerken.nl/',
            'https://www.installatie-techniek.com/',
            'https://svenwarmtetechniek.nl/',
            'https://www.vdhdakonderhoud.nl/',
            'https://www.vdpdakbedekking.nl/',
            'https://www.janvandijkhoveniers.nl/',
            'https://vandijk-installaties.nl/',
            'https://van-trigtinstallaties.nl/',
            'https://www.vanderheidenschilderwerken.nl/',
            'https://voermanstuinen.nl/',
            'https://www.warmteenzo.nl/',
            'https://westland-hoveniers.nl/',
            'https://vdberg-hoveniers.nl/'
          ];
          if (sites.length !== 35 || new Set(sites).size !== 35) throw new Error('Rest35 input must contain 35 unique URLs');
          fs.writeFileSync('sites.txt', sites.join('\n') + '\n');
          NODE

      - name: Run explicit 35-site rescan
        env:
          REQUIRE_SINGLE_TARGET: 'false'
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '2'
          MAX_REQUESTS_PER_MINUTE: '30'
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          echo "Explicit user-requested rest-35 rescan. Failed sites are recorded and skipped; remaining sites continue." >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-rest35-rescan-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7
