name: Historical Website Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-site-research.yml'

permissions:
  contents: read

concurrency:
  group: historical-site-research
  cancel-in-progress: false

jobs:
  historical_site_scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install site research dependencies
        run: python3 -m pip install --disable-pip-version-check 'requests>=2,<3' 'google-auth>=2,<3'
      - name: Research up to 100 isolated historical contacts (review only; no sends)
        env:
          PYTHONPATH: scripts
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/instantly_historical_site_research.py \
            --offset "${{ matrix.offset }}" \
            --expected-count 1128 \
            --workers 100 \
            --save-candidates \
            --output "results/site-batch-${{ matrix.offset }}.json"
      - name: Upload aggregate-only batch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-research-${{ matrix.offset }}-${{ github.run_id }}
          path: results/site-batch-${{ matrix.offset }}.json
          if-no-files-found: warn
          retention-days: 7
