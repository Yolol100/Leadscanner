name: Review 450 - read-only quality by batch
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Review batch (1-5)
        type: choice
        required: true
        options: ['1','2','3','4','5']
      confirmation:
        description: Private task identity
        type: string
        required: true
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'review450-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: leadscanner-private-450-readonly-quality
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Syntax and QA-contract unit tests
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_qa450_batch.py' -q
      - name: Audit one authorized batch; never change the mailbox
        env:
          PYTHONPATH: scripts
          QA450_TASK: review450-20261015
          REQUESTED_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.batch || '' }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          case "$REQUESTED_BATCH" in
            1|2|3|4|5) export QA450_BATCH="$REQUESTED_BATCH" ;;
            *) echo "QA450_BATCH=blocked invalid_batch sent=0"; exit 1 ;;
          esac
          python3 scripts/qa450_batch.py
