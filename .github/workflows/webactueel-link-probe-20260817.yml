name: Webactueel Link Probe 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-link-probe-20260817.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Probe supplemental broken-link candidates
        run: |
          mkdir -p probe-results/screenshots
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { chromium } = require('playwright');
          const probes = [
            {slug:'danielsnijders-hovenier-de-lier', company:'Daniël Snijders Hoveniers & Bestratingen', canonical:'https://www.danielsnijders.nl/', url:'https://www.danielsnijders.nl/hovenier-de-lier'},
            {slug:'joostbakker-houtrotreparaties', company:'Joost Bakker Schilderwerken', canonical:'https://joostbakker.nl/', url:'https://joostbakker.nl/houtrotreparaties'},
            {slug:'joostbakker-overons', company:'Joost Bakker Schilderwerken', canonical:'https://joostbakker.nl/', url:'https://joostbakker.nl/overons'},
            {slug:'lmuyres-over-ons', company:'L. Muyres Schildersbedrijf', canonical:'https://www.schildersbedrijf-lmuyres.nl/', url:'https://www.schildersbedrijf-lmuyres.nl/over-ons/'},
            {slug:'lmuyres-faq', company:'L. Muyres Schildersbedrijf', canonical:'https://www.schildersbedrijf-lmuyres.nl/', url:'https://www.schildersbedrijf-lmuyres.nl/faq/'},
            {slug:'rkschilder-over-ons', company:'RK Schilder', canonical:'https://rkschilder.nl/', url:'https://rkschilder.nl/over-ons'},
            {slug:'rkschilder-werkgebieden', company:'RK Schilder', canonical:'https://rkschilder.nl/', url:'https://rkschilder.nl/werkgebieden'},
            {slug:'rkschilder-contact', company:'RK Schilder', canonical:'https://rkschilder.nl/', url:'https://rkschilder.nl/contact'},
            {slug:'rovaal-contact-us', company:'Rovaal Dakbeheer', canonical:'https://rovaal-dakbeheer.nl/', url:'https://rovaal-dakbeheer.nl/contact-us/'}
          ];
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:900}});
          const out = [];
          for (const p of probes) {
            const page = await context.newPage();
            let response = null, error = null;
            const started = new Date().toISOString();
            try {
              response = await page.goto(p.url, {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(700);
            } catch (e) { error = String(e && e.message || e); }
            const finalUrl = page.url();
            const title = await page.title().catch(()=> '');
            const text = (await page.locator('body').innerText().catch(()=> '')).replace(/\s+/g,' ').trim().slice(0,500);
            const screenshot = `probe-results/screenshots/${p.slug}.png`;
            await page.screenshot({path:screenshot, fullPage:true}).catch(()=>{});
            const screenshotSha256 = fs.existsSync(screenshot) ? crypto.createHash('sha256').update(fs.readFileSync(screenshot)).digest('hex') : null;
            out.push({...p, captured_at:started, status:response ? response.status() : null, final_url:finalUrl, title, text_sample:text, error, screenshot, screenshot_sha256:screenshotSha256});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('probe-results/probe-results.json', JSON.stringify(out,null,2));
          NODE
      - name: Publish probe summary
        run: cat probe-results/probe-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-link-probe-${{ github.run_number }}
          path: probe-results/
          if-no-files-found: error
          retention-days: 7
