name: Temporary Fill 50 Personalized Leads

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/fill-50-personalized-leads.yml'

permissions:
  contents: read

concurrency:
  group: temporary-fill-50-personalized-leads-20260909
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}

    steps:
      - name: Checkout temporary execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require Sheet runtime credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          echo 'SHEET_RUNTIME_CREDENTIAL=present'

      - name: Resume campaign until 50 personalized leads are prepared
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/fill_50_personalized_leads.py | tee fill-50-personalized-leads.log
          grep -q '^LEADS50_PREP=green selected=50 smtp_send=not_invoked imap_draft=not_invoked$' fill-50-personalized-leads.log

      - name: Upload fill receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fill-50-personalized-leads-${{ github.run_id }}
          path: |
            selected-50-leads.json
            fill-50-personalized-leads.log
            agent-qualification-w50-p*.json
            campaign-gate-w50-p*.json
            agent-prepare-w50-p*.json
            prospect-discovery-wave-50.json
            prospect-signal-wave-50.json
            agent-qualification-w51-p*.json
            campaign-gate-w51-p*.json
            agent-prepare-w51-p*.json
          if-no-files-found: ignore
          retention-days: 14
