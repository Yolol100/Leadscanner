name: Temporary Relay Header Proof

on:
  push:
    branches:
      - ops/leads-live-proof-20260905
    paths:
      - '.github/workflows/ops-relay-header-proof.yml'

permissions:
  contents: read

jobs:
  relay-header-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAP_HOST: mail.andrewbaeten.nl
      IMAP_PORT: '993'
      IMAP_USER: info@andrewbaeten.nl
      PLACEMENT_ID: placement-2f09cb73206c46588e0f2eaea62d8aa2
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
    steps:
      - name: Read existing self-only placement headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email
          import imaplib
          import ipaddress
          import os
          import re

          host = os.environ['IMAP_HOST']
          port = int(os.environ['IMAP_PORT'])
          user = os.environ['IMAP_USER']
          password = os.environ.get('OUTREACH_MAIL_PASSWORD', '')
          placement_id = os.environ['PLACEMENT_ID']
          if not password:
              raise SystemExit('OUTREACH_MAIL_PASSWORD missing')

          client = imaplib.IMAP4_SSL(host, port)
          try:
              client.login(user, password)
              typ, _ = client.select('INBOX', readonly=True)
              if typ != 'OK':
                  raise SystemExit('INBOX select failed')
              typ, data = client.search(None, 'TEXT', f'"{placement_id}"')
              ids = data[0].split() if typ == 'OK' and data else []
              if not ids:
                  typ, data = client.search(None, 'SUBJECT', '"Webactueel placement probe"')
                  ids = data[0].split() if typ == 'OK' and data else []
              if not ids:
                  raise SystemExit('placement message not found')

              selected = None
              for message_id in reversed(ids[-20:]):
                  typ, payload = client.fetch(message_id, '(RFC822)')
                  if typ != 'OK' or not payload:
                      continue
                  raw = next((part[1] for part in payload if isinstance(part, tuple) and len(part) > 1), None)
                  if not raw:
                      continue
                  msg = email.message_from_bytes(raw)
                  sender = (msg.get('From') or '').casefold()
                  recipient = (msg.get('To') or '').casefold()
                  body = ''
                  if msg.is_multipart():
                      for part in msg.walk():
                          if part.get_content_type() == 'text/plain':
                              body += (part.get_payload(decode=True) or b'').decode(part.get_content_charset() or 'utf-8', errors='replace')
                  else:
                      body = (msg.get_payload(decode=True) or b'').decode(msg.get_content_charset() or 'utf-8', errors='replace')
                  if user.casefold() in sender and user.casefold() in recipient and placement_id in body:
                      selected = msg
                      break
              if selected is None:
                  raise SystemExit('matching self-only placement message not found')

              received = selected.get_all('Received', [])
              global_ips = []
              from_hosts = []
              by_hosts = []
              for header in received:
                  for candidate in re.findall(r'(?<![\w.])(?:\d{1,3}\.){3}\d{1,3}(?![\w.])', header):
                      try:
                          ip = ipaddress.ip_address(candidate)
                      except ValueError:
                          continue
                      if ip.is_global and candidate not in global_ips:
                          global_ips.append(candidate)
                  match = re.search(r'\bfrom\s+([^\s(;]+)', header, re.I)
                  if match and match.group(1) not in from_hosts:
                      from_hosts.append(match.group(1))
                  match = re.search(r'\bby\s+([^\s(;]+)', header, re.I)
                  if match and match.group(1) not in by_hosts:
                      by_hosts.append(match.group(1))

              print(f'RELAY_HEADER_PROOF=found_self_only_message')
              print(f'RECEIVED_COUNT={len(received)}')
              print('GLOBAL_IPS=' + ','.join(global_ips))
              print('FROM_HOSTS=' + ','.join(from_hosts[:10]))
              print('BY_HOSTS=' + ','.join(by_hosts[:10]))
              if not global_ips:
                  raise SystemExit('no global relay IP found in Received headers')
          finally:
              try:
                  client.logout()
              except Exception:
                  pass
          PY
