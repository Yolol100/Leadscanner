name: One-time 2 robots-held plus 1 stale Draft to recovery (no send)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[myhost-final-three-verified-hold]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: All regressions and compile checks before touching IMAP
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify 509 Drafts, 664 exact held backups, 1173 union and UIDPLUS
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          from _once_myhost_existing_rewrite import inventory_existing
          from _once_myhost_safe_hold import HOLD_FOLDER, validate_hold_inventory
          from myhost_draft import connect_imap, find_drafts_folder, require_uidplus
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  client = connect_imap()
                  try:
                      folder = find_drafts_folder(client)
                      active, held = validate_hold_inventory(
                          client, folder, HOLD_FOLDER, inventory_existing, 1173)
                      require_uidplus(client, 'recoverable final revisions')
                      if (len(active), len(held)) != (509, 664):
                          raise RuntimeError('unexpected_509_664_mailbox_state')
                  finally:
                      client.logout()
          except Exception:
              print('FINAL_THREE_PREFLIGHT=red private_details_suppressed')
              raise SystemExit(1)
          print('FINAL_THREE_PREFLIGHT=green active=509 held=664 total=1173')
          PY
  hold_500:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Reverify exact two revisions in original identity window 500
        env:
          PYTHONPATH: scripts
          LEADSCANNER_TRUSTED_HOLD: 'true'
          LEADSCANNER_HOLD_REVISION: 'true'
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/_once_myhost_existing_rewrite.py --offset 500 --mode hold_revision
  hold_1000:
    needs: hold_500
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Reverify exact one revision in original identity window 1000
        env:
          PYTHONPATH: scripts
          LEADSCANNER_TRUSTED_HOLD: 'true'
          LEADSCANNER_HOLD_REVISION: 'true'
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/_once_myhost_existing_rewrite.py --offset 1000 --mode hold_revision

  diagnose:
    # Read-only recheck after the prior hold_500 failed; never rerun a writer.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[myhost-three-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Diagnose live mailbox count and two original windows, strictly read-only
        env:
          PYTHONPATH: scripts
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          import json
          from _once_myhost_existing_rewrite import run, inventory_existing
          from _once_myhost_safe_hold import HOLD_FOLDER, validate_hold_inventory
          from myhost_draft import connect_imap, find_drafts_folder
          safe_codes = {
              "three_revision_evidence_drift",
              "three_revision_mailbox_baseline_changed",
              "three_revision_final_inventory_mismatch",
              "hold_union_baseline_changed",
              "hold_folder_unrelated_content",
              "imap_duplicate_lead_id",
              "historical_source_invalid",
              "historical_registry_invalid",
              "imap_existing_target_not_unique",
          }
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  client = connect_imap()
                  try:
                      folder = find_drafts_folder(client)
                      active, held = validate_hold_inventory(
                          client, folder, HOLD_FOLDER, inventory_existing, 1173)
                  finally:
                      client.logout()
              print("THREE_READONLY_INVENTORY=green " +
                    json.dumps({"active": len(active), "held": len(held), "total": 1173}))
              for offset in (500, 1000):
                  with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                      output = run(offset, write=False, cleanup=False)
                  if output["status"] != "green" or output["emails_sent"] or output["drafts_created"]:
                      raise RuntimeError("unsafe_readonly_report")
                  print("THREE_READONLY_WINDOW=green " +
                        json.dumps({"offset": offset, "counts": output["counts"]},
                                   sort_keys=True))
          except Exception as exc:
              code = str(exc)
              if code not in safe_codes:
                  code = "unclassified_private_failure"
              print("THREE_READONLY=red reason=" + code)
              raise SystemExit(1)
          print("THREE_READONLY=green no_mailbox_writes=1")
          PY

  final_mailbox_readback:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[myhost-final-qa-readonly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Independently read final tagged Draft and recovery inventories, no writes
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          from _once_myhost_existing_rewrite import inventory_existing
          from _once_myhost_safe_hold import HOLD_FOLDER, validate_hold_inventory
          from myhost_draft import connect_imap, find_drafts_folder
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  client = connect_imap()
                  try:
                      folder = find_drafts_folder(client)
                      active, held = validate_hold_inventory(
                          client, folder, HOLD_FOLDER, inventory_existing, 1173)
                      if len(active) != 506 or len(held) != 667:
                          raise RuntimeError('final_mailbox_state_not_accepted')
                  finally:
                      client.logout()
          except Exception:
              print('FINAL_READONLY=red private_details_suppressed')
              raise SystemExit(1)
          print('FINAL_READONLY=green active=506 held=667 union=1173 no_mailbox_writes=1')
          PY

  quality_content_readonly:
    # One-off read-only check: no new Drafts, no sending, no hold moves.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[myhost-quality-readonly-509]')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Confirm quality classifier and read-only guards
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_draft_quality_readonly.py' -v
      - name: Read only exact 509 tagged Drafts with aggregate 50-item counts
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/draft_quality_readonly.py
