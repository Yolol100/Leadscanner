name: Verified 450 opening drafts - owner-only phased IMAP sync
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  opening-sync:
    # Superseded by conversations PRECHECK/PILOT/BATCH with private archive.
    # Never allow an old text sync to overwrite the new drafts.
    if: >-
      false &&
      github.event.issue.number == 1659 &&
      github.actor == 'Yolol100' &&
      github.event.comment.body == 'LEADS_OPENINGS_SYNC_ONLY: opening-review-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Local no-credential safety preflight
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_sync450_openings.py' -q
          python3 -m unittest discover -s tests -p 'test_reconcile450_current.py' -q
      - name: Stage safe review drafts in phases with exact IMAP readback
        env:
          PYTHONPATH: scripts
          OPENING450_TASK: opening-review-20261016
          OPENING450_MODE: install
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/sync450_openings.py
      - name: Independent read-only verification in fresh IMAP session
        env:
          PYTHONPATH: scripts
          OPENING450_TASK: opening-review-20261016
          OPENING450_MODE: readback
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/sync450_openings.py

  conversation-replacement:
    # Explicit owner-only action; no cron, send, dispatch or automatic trigger.
    if: >-
      github.event.issue.number == 1659 &&
      !github.event.issue.pull_request &&
      github.actor == 'Yolol100' &&
      github.event.comment.user.login == 'Yolol100' &&
      (github.event.comment.body == 'LEADS_CONVERSATIONS_V1:PRECHECK' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:PILOT' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_1' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_2' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_3' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_4' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_5' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:BATCH_2_TO_5' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:REVISION_PRECHECK' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:REVISION_PILOT' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:REVISION_ALL' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:REVISION_AUDIT' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_PRECHECK' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_PILOT' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_BATCH_1' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_BATCH_2' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_BATCH_3' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_BATCH_4' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:RECREATE_BATCH_5' ||
       github.event.comment.body == 'LEADS_CONVERSATIONS_V1:AUDIT' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:PRECHECK' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:PREPARE60' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:AUDIT' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:PILOT' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:BATCH_1' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:BATCH_2' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:BATCH_3' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:BATCH_4' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:BATCH_5' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_REMAINING' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_BATCH_1' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_BATCH_2' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_BATCH_3' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_BATCH_4' ||
       github.event.comment.body == 'LEADS_V2_DRAFTS:RECREATE_BATCH_5')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-draft.txt
      - run: python3 -m pip install -r requirements-draft.txt
      - name: Offline archive, authorization and draft safety regressions
        env:
          PYTHONPATH: scripts:tests
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_conversation_replacement.py' -q
          python3 -m unittest discover -s tests -p 'test_draft_management.py' -q
          python3 -m unittest discover -s tests -p 'test_draft_revision.py' -q
          python3 -m unittest discover -s tests -p 'test_recreate_reviewed_drafts.py' -q
          python3 -m unittest discover -s tests -p 'test_migrate_v2_drafts.py' -q
          python3 -m unittest discover -s tests -p 'test_v2_private_stale_inventory.py' -q
      - name: Run only explicitly authorized and privately verified IMAP operation
        env:
          PYTHONPATH: scripts
          CONVERSATION_MODE: ${{ github.event.comment.body }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          if [[ "$CONVERSATION_MODE" == LEADS_V2_DRAFTS:* ]]; then
            python3 scripts/migrate_v2_drafts.py
          else
            python3 scripts/draft_revision.py
          fi
