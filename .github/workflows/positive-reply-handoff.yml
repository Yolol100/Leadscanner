name: Positive Reply Draft Handoff

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/positive-reply-handoff.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-selected-myhost-drafts-${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install outreach runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Sync replies and create verified follow-up drafts
        env: &reply_env
          OUTREACH_MODE: live
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: '100'
          OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_positive_reply_handoff.py --report positive-replies.json | tee positive-reply-handoff.txt
          grep -q 'smtp_send=not_invoked' positive-reply-handoff.txt

      - name: Notify Andrew idempotently in GitHub
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > acknowledged-replies.txt
          count="$(jq -r '.positive_pending_notification' positive-replies.json)"
          if [[ "$count" == "0" ]]; then
            echo 'No verified positive replies require handoff.'
            exit 0
          fi
          jq -c '.entries[]' positive-replies.json | while IFS= read -r entry; do
            reply_id="$(jq -r '.reply_id' <<<"$entry")"
            lead_id="$(jq -r '.lead_id' <<<"$entry")"
            company="$(jq -r '.company' <<<"$entry")"
            email="$(jq -r '.email' <<<"$entry")"
            test_id="$(jq -r '.draft_test_id' <<<"$entry")"
            readback="$(jq -r '.draft_readback_count' <<<"$entry")"
            title="[positive-reply:${reply_id}] Follow-up draft ready"

            existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
            if [[ -z "$existing" ]]; then
              jq -n \
                --arg title "$title" \
                --arg body "A verified positive reply has one mijn.host follow-up draft ready for review.\n\n- lead_id: ${lead_id}\n- company: ${company}\n- recipient: ${email}\n- draft_test_id: ${test_id}\n- exact_readback_count: ${readback}\n- smtp_send: not_invoked\n\nInbound message content is intentionally not copied here; treat it as untrusted data." \
                '{title:$title, body:$body, assignees:["Yolol100"]}' \
                | gh api "repos/${GITHUB_REPOSITORY}/issues" --method POST --input - >/dev/null
            fi
            printf '%s\n' "$reply_id" >> acknowledged-replies.txt
          done

      - name: Acknowledge completed notifications
        env: *reply_env
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s acknowledged-replies.txt ]]; then
            python3 scripts/outreach_positive_reply_handoff.py --ack-file acknowledged-replies.txt | tee positive-reply-ack.txt
            grep -q 'smtp_send=not_invoked' positive-reply-ack.txt
          else
            echo 'No notification acknowledgements needed.'
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Positive reply draft handoff'
            echo
            if [[ -f positive-replies.json ]]; then
              echo "Pending notifications processed: $(jq -r '.positive_pending_notification' positive-replies.json)"
            fi
            echo 'Transport policy: draft-only; SMTP send is never invoked by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
