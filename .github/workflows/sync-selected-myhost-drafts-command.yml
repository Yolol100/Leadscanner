name: Create selected mijn.host concepts

on:
  workflow_dispatch:
    inputs:
      lead_ids:
        description: "Comma- or newline-separated DraftQueue lead IDs"
        required: true
        type: string
      expected_count:
        description: "Expected number of selected lead IDs"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: myhost-drafts
  cancel-in-progress: false

jobs:
  create-drafts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor == 'Yolol100' &&
        github.event.issue.title == 'SYNC SELECTED MYHOST DRAFTS' &&
        contains(github.event.issue.body, 'COMMAND=SYNC_SELECTED_MYHOST_DRAFTS')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Parse selected lead IDs
        id: command
        shell: bash
        env:
          DISPATCH_LEAD_IDS: ${{ inputs.lead_ids }}
          DISPATCH_EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$DISPATCH_LEAD_IDS" | tr ',' '\n' | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' > selected-lead-ids.txt
            expected="$DISPATCH_EXPECTED_COUNT"
          else
            jq -r '.issue.body // "" | split("\n")[] | select(startswith("LEAD_ID=")) | sub("^LEAD_ID="; "")' "$GITHUB_EVENT_PATH" > selected-lead-ids.txt
            expected="$(jq -r '.issue.body // "" | split("\n")[] | select(startswith("EXPECTED_COUNT=")) | sub("^EXPECTED_COUNT="; "")' "$GITHUB_EVENT_PATH")"
          fi
          if ! [[ "$expected" =~ ^[0-9]{1,3}$ ]] || [ "$expected" -lt 1 ] || [ "$expected" -gt 100 ]; then
            echo 'EXPECTED_COUNT must be 1-100' >&2; exit 2
          fi
          actual="$(grep -c . selected-lead-ids.txt || true)"
          [ "$actual" = "$expected" ] || { echo "Expected $expected IDs, got $actual" >&2; exit 2; }
          [ "$(sort selected-lead-ids.txt | uniq | wc -l)" = "$expected" ] || { echo 'Duplicate IDs' >&2; exit 2; }
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Create concepts and verify readback
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
        run: |
          PYTHONPATH=scripts python3 scripts/sync_selected_drafts.py \
            --lead-id-file selected-lead-ids.txt \
            --expected-count '${{ steps.command.outputs.expected }}' \
            --report sync-result.json | tee sync-result.txt
          grep -q '^MYHOST_DRAFT_SYNC=green ' sync-result.txt
          grep -q 'smtp_send=not_available' sync-result.txt
      - name: Comment and close
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^MYHOST_DRAFT_SYNC=green ' sync-result.txt 2>/dev/null; then
            body='MYHOST_DRAFT_SYNC_COMMAND=green\nConcepten aangemaakt en teruggelezen. Geen e-mail verzonden.'
          else
            body='MYHOST_DRAFT_SYNC_COMMAND=blocked\nGeen automatische verzending uitgevoerd.'
          fi
          gh issue comment '${{ github.event.issue.number }}' --body "$body"
          gh issue close '${{ github.event.issue.number }}'
