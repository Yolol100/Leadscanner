name: Sync selected mijn.host Drafts Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-selected-myhost-drafts-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'SYNC SELECTED MYHOST DRAFTS' &&
      contains(github.event.issue.body, 'COMMAND=SYNC_SELECTED_MYHOST_DRAFTS')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse explicit lead IDs
        id: command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t count_lines < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("EXPECTED_COUNT=")) | sub("^EXPECTED_COUNT="; "")' "$GITHUB_EVENT_PATH")
          mapfile -t lead_ids < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("LEAD_ID=")) | sub("^LEAD_ID="; "")' "$GITHUB_EVENT_PATH")
          if [ "${#count_lines[@]}" -ne 1 ]; then
            echo 'Expected exactly one EXPECTED_COUNT line.' >&2
            exit 2
          fi
          expected_count="${count_lines[0]}"
          if ! [[ "$expected_count" =~ ^[0-9]{1,3}$ ]] || [ "$expected_count" -lt 1 ] || [ "$expected_count" -gt 100 ]; then
            echo 'EXPECTED_COUNT must be between 1 and 100.' >&2
            exit 2
          fi
          if [ "${#lead_ids[@]}" -ne "$expected_count" ]; then
            echo "Expected ${expected_count} LEAD_ID lines; found ${#lead_ids[@]}." >&2
            exit 2
          fi
          : > selected-lead-ids.txt
          for lead_id in "${lead_ids[@]}"; do
            if ! [[ "$lead_id" =~ ^[A-Za-z0-9._:-]{1,180}$ ]]; then
              echo 'A LEAD_ID contains unsupported characters.' >&2
              exit 2
            fi
            printf '%s\n' "$lead_id" >> selected-lead-ids.txt
          done
          if [ "$(sort selected-lead-ids.txt | uniq | wc -l)" -ne "$expected_count" ]; then
            echo 'LEAD_ID lines contain duplicates.' >&2
            exit 2
          fi
          echo "expected_count=$expected_count" >> "$GITHUB_OUTPUT"

      - name: Compile selected sync runtime
        run: python3 -m py_compile scripts/outreach_queue_imap_draft_sync.py scripts/outreach_queue_imap_draft_sync_selected.py

      - name: Preflight exact selected drafts
        id: preflight
        continue-on-error: true
        env: &draft_env
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: '100'
          OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_queue_imap_draft_sync_selected.py \
            --lead-id-file selected-lead-ids.txt \
            --expected-count '${{ steps.command.outputs.expected_count }}' \
            --report sync-preflight.json | tee sync-preflight.txt
          grep -q '^MYHOST_SELECTED_DRAFT_SYNC=preflight_green ' sync-preflight.txt
          grep -q 'smtp_send=not_invoked' sync-preflight.txt

      - name: Apply exact selected drafts and verify readback
        id: apply
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env: *draft_env
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_queue_imap_draft_sync_selected.py \
            --lead-id-file selected-lead-ids.txt \
            --expected-count '${{ steps.command.outputs.expected_count }}' \
            --apply \
            --report sync-result.json | tee sync-result.txt
          grep -q '^MYHOST_SELECTED_DRAFT_SYNC=green ' sync-result.txt
          grep -q 'final_readback=${{ steps.command.outputs.expected_count }}' sync-result.txt
          grep -q 'smtp_send=not_invoked' sync-result.txt

      - name: Report selected sync result
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          EXPECTED_COUNT: ${{ steps.command.outputs.expected_count }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_OUTCOME" = 'success' ] && [ "$APPLY_OUTCOME" = 'success' ] && grep -q '^MYHOST_SELECTED_DRAFT_SYNC=green ' sync-result.txt 2>/dev/null; then
            result='MYHOST_SELECTED_DRAFT_SYNC_COMMAND=green'
            detail="$(tail -n 1 sync-result.txt)"
          else
            result='MYHOST_SELECTED_DRAFT_SYNC_COMMAND=blocked'
            detail="$(tail -n 1 sync-result.txt 2>/dev/null || tail -n 1 sync-preflight.txt 2>/dev/null || echo 'no result')"
          fi
          body="${result}\nEXPECTED_COUNT=${EXPECTED_COUNT}\n${detail}\nTRANSPORT=IMAP_DRAFT_SYNC_ONLY\nSMTP_SEND=not_invoked"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d "$close_payload" >/dev/null

      - name: Upload selected sync evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myhost-selected-draft-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selected-lead-ids.txt
            sync-preflight.json
            sync-preflight.txt
            sync-result.json
            sync-result.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail closed when selected synchronization failed
        if: steps.preflight.outcome != 'success' || steps.apply.outcome != 'success'
        shell: bash
        run: |
          echo 'Selected draft synchronization did not complete with exact mailbox readback.' >&2
          echo 'SMTP_SEND=not_invoked'
          exit 1
