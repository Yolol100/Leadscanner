name: Leadscanner — websiteonderzoek en mijn.host-concepten

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Onderzoek, zelftest mailbox, of handmatig concepten maken (zonder verzending)'
        required: true
        default: public_audit
        type: choice
        options:
          - public_audit
          - drafts
          - smoke
      region:
        description: 'Plaats of regio'
        default: Amsterdam
        type: string
      keywords:
        description: 'Branches/zoekwoorden, komma-gescheiden'
        default: fietsenwinkel,bloemist,kapsalon
        type: string
      target_candidates:
        description: 'Aantal kandidaten met website (1–5000)'
        default: '100'
        type: string
      verify_limit:
        description: 'Maximaal te onderzoeken bedrijven (1–100)'
        default: '100'
        type: string
      radius_km:
        description: 'Zoekstraal in kilometers (0.5–50)'
        default: '8'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/leads-cold.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-cold.txt'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '.github/workflows/leads-cold.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-cold.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt
      - name: Test only the active core, website, dedupe and draft path
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  public_audit:
    if: (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'public_audit') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[public-audit]'))
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Verify websites and email quality in runner memory only
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REGION: ${{ inputs.region }}
          KEYWORDS: ${{ inputs.keywords }}
          TARGET: ${{ inputs.target_candidates }}
          VERIFY: ${{ inputs.verify_limit }}
          RADIUS: ${{ inputs.radius_km }}
        run: |
          set -euo pipefail
          python3 scripts/leadscanner_core.py --mode public_audit \
            --region "${REGION:-Amsterdam}" --keywords "${KEYWORDS:-fietsenwinkel,bloemist,kapsalon}" \
            --discovery-limit "${TARGET:-60}" --verify-limit "${VERIFY:-60}" \
            --radius-km "${RADIUS:-5}" > "$RUNNER_TEMP/leadscanner-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "leadscanner-report.json").read_text())
          assert report["status"] in ("green", "yellow")
          assert report["automatic_send"] is False and report["recipient_data_exposed"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("### Leadscanner openbare kwaliteitscontrole\n\n")
              for key, value in report["counts"].items():
                  file.write(f"- {key}: {int(value)}\n")
              file.write("\n**Geen persoonsgegevens opgeslagen of mails verzonden.**\n")
          PY

  drafts:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'drafts' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Research, quality-check, create and verify mijn.host Drafts
        env:
          PYTHONPATH: scripts
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          LEADSCANNER_TRUSTED_MAIN_DRAFTS: 'true'
          REGION: ${{ inputs.region }}
          KEYWORDS: ${{ inputs.keywords }}
          TARGET: ${{ inputs.target_candidates }}
          VERIFY: ${{ inputs.verify_limit }}
          RADIUS: ${{ inputs.radius_km }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/leadscanner_core.py --mode drafts \
            --region "$REGION" --keywords "$KEYWORDS" \
            --discovery-limit "$TARGET" --verify-limit "$VERIFY" \
            --radius-km "$RADIUS" > "$RUNNER_TEMP/leadscanner-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "leadscanner-report.json").read_text())
          assert report["status"] == "green"
          assert report["automatic_send"] is False and report["recipient_data_exposed"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("### Leadscanner → mijn.host concepten\n\n")
              for key, value in report["counts"].items():
                  file.write(f"- {key}: {int(value)}\n")
              file.write("\n**Concepten exact teruggelezen. Geen SMTP-verzending.**\n")
          PY


  smoke:
    # A synthetic self-addressed Draft only; never a prospective recipient.
    # Main branch and trusted manual dispatch or explicitly marked main push.
    if: (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'smoke' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[myhost-smoke]'))
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify one synthetic Draft via IMAP and delete only its exact UID
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          from myhost_draft import live_self_draft_smoke
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  result = live_self_draft_smoke()
              if result != {
                  "status": "green",
                  "synthetic_draft_created": 1,
                  "exact_imap_readback": 1,
                  "synthetic_draft_cleaned": 1,
                  "emails_sent": 0,
                  "prospect_records_touched": 0,
              }:
                  raise RuntimeError("smoke_report_incomplete")
          except Exception:
              print("MYHOST_SMOKE=red safe_failure_no_emails_sent")
              sys.exit(1)
          print("MYHOST_SMOKE=green synthetic=1 exact_readback=1 cleaned=1 emails_sent=0")
          PY
