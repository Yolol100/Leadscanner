name: Leads Agent Sales Prepare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the pipeline or run bounded campaign-first agent-sales prepare automation
        required: true
        type: choice
        options:
          - validate
          - prepare
        default: validate
      agent_type:
        description: One campaign agent target. Auto preserves discovery-wide qualification but is not the preferred campaign mode.
        required: true
        type: choice
        options:
          - auto
          - front_desk_sales
          - quote_intake
          - customer_support
          - commerce
          - review_concierge
          - lead_reactivation
        default: auto
  schedule:
    - cron: '11,41 5-17 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'ops/leads-autopilot-request.txt'

permissions:
  contents: read

concurrency:
  group: leads-zero-touch-prepare
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve bounded automation mode and campaign target
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_AGENT_TYPE: ${{ inputs.agent_type }}
          DEFAULT_AGENT_TYPE: ${{ vars.AGENT_SALES_TARGET_TYPE || 'auto' }}
        run: |
          set -euo pipefail
          mode="validate"
          recheck="false"
          agent_type="${REQUESTED_AGENT_TYPE:-${DEFAULT_AGENT_TYPE:-auto}}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${REQUESTED_MODE:-validate}"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$agent_type" = "auto" ]; then
              mode="validate"
            else
              mode="prepare"
            fi
          elif [ -f ops/leads-autopilot-request.txt ]; then
            requested="$(tr -d '\r\n ' < ops/leads-autopilot-request.txt | tr '[:upper:]' '[:lower:]')"
            case "$requested" in
              prepare) mode="prepare" ;;
              prepare-recheck) mode="prepare"; recheck="true" ;;
              validate|'') mode="validate" ;;
              *) echo "unsupported request file mode: $requested" >&2; exit 2 ;;
            esac
          fi
          case "$agent_type" in
            auto|front_desk_sales|quote_intake|customer_support|commerce|review_concierge|lead_reactivation) ;;
            *) echo "unsupported AGENT_SALES_TARGET_TYPE: $agent_type" >&2; exit 2 ;;
          esac
          if [ "$mode" = "prepare" ] && [ "$agent_type" = "auto" ]; then
            echo "campaign-first prepare requires one explicit agent_type; auto is validate/exploration only" >&2
            exit 2
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "recheck=$recheck" >> "$GITHUB_OUTPUT"
          echo "agent_type=$agent_type" >> "$GITHUB_OUTPUT"
          echo "LEADS_AUTOPILOT_MODE=$mode"
          echo "LEADS_AUTOPILOT_RECHECK=$recheck"
          echo "LEADS_CAMPAIGN_AGENT_TYPE=$agent_type"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require Sheet runtime credential
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is required."; exit 1; }
          echo "SHEET_RUNTIME_AUTH=present"

      - name: Discover bounded prospects
        env:
          PROSPECT_DISCOVERY_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_DISCOVERY_MAX_TOTAL: ${{ vars.PROSPECT_DISCOVERY_MAX_TOTAL || '200' }}
          PROSPECT_DISCOVERY_TARGET_NEW: ${{ vars.PROSPECT_DISCOVERY_TARGET_NEW || '50' }}
          PROSPECT_DISCOVERY_TIMEOUT_SECONDS: ${{ vars.PROSPECT_DISCOVERY_TIMEOUT_SECONDS || '10' }}
          PROSPECT_DISCOVERY_MAX_BYTES: ${{ vars.PROSPECT_DISCOVERY_MAX_BYTES || '2097152' }}
          PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_DISCOVERY_USER_AGENT: ${{ vars.PROSPECT_DISCOVERY_USER_AGENT }}
          PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES: ${{ vars.PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES }}
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: ${{ vars.PROSPECT_DISCOVERY_PREFERRED_COUNTRIES || 'US,NL,GB,DE,FR,BE,ES,IT,SE,DK,NO,FI,AT,CH,IE,PT,PL,CZ' }}
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: ${{ vars.PROSPECT_DISCOVERY_EXCLUDE_AGENCIES || 'true' }}
          PROSPECT_DISCOVERY_EXTRA_EXCLUDE_TERMS: ${{ vars.PROSPECT_DISCOVERY_EXTRA_EXCLUDE_TERMS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_discovery_runtime.py --mode "$PROSPECT_DISCOVERY_MODE" --report prospect-discovery-report.json

      - name: Sanitize stale directory candidates
        if: steps.mode.outputs.mode == 'prepare'
        env:
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_QUALIFICATION_TIMEOUT_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_TIMEOUT_SECONDS || '10' }}
          PROSPECT_QUALIFICATION_MAX_BYTES: ${{ vars.PROSPECT_QUALIFICATION_MAX_BYTES || '524288' }}
          PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_QUALIFICATION_USER_AGENT: ${{ vars.PROSPECT_QUALIFICATION_USER_AGENT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_candidate_sanitizer.py

      - name: Collect bounded official-site signals
        env:
          PROSPECT_SIGNAL_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_SIGNAL_MAX_CANDIDATES: ${{ vars.PROSPECT_SIGNAL_MAX_CANDIDATES || '25' }}
          PROSPECT_SIGNAL_TIMEOUT_SECONDS: ${{ vars.PROSPECT_SIGNAL_TIMEOUT_SECONDS || '10' }}
          PROSPECT_SIGNAL_MAX_BYTES: ${{ vars.PROSPECT_SIGNAL_MAX_BYTES || '524288' }}
          PROSPECT_SIGNAL_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_SIGNAL_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_SIGNAL_USER_AGENT: ${{ vars.PROSPECT_SIGNAL_USER_AGENT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_signal_discovery_runtime.py --mode "$PROSPECT_SIGNAL_MODE" --report prospect-signal-report.json

      - name: Qualify prospects for the selected AI agent campaign
        env:
          PROSPECT_QUALIFICATION_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'qualify' || 'validate' }}
          PROSPECT_QUALIFICATION_FORCE_RECHECK: ${{ steps.mode.outputs.recheck }}
          PROSPECT_QUALIFICATION_RECHECK_DAYS: ${{ vars.PROSPECT_QUALIFICATION_RECHECK_DAYS || '30' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_QUALIFICATION_MAX_PER_RUN: ${{ steps.mode.outputs.recheck == 'true' && '25' || vars.PROSPECT_QUALIFICATION_MAX_PER_RUN || '25' }}
          PROSPECT_QUALIFICATION_TIMEOUT_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_TIMEOUT_SECONDS || '10' }}
          PROSPECT_QUALIFICATION_MAX_BYTES: ${{ vars.PROSPECT_QUALIFICATION_MAX_BYTES || '524288' }}
          PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_QUALIFICATION_USER_AGENT: ${{ vars.PROSPECT_QUALIFICATION_USER_AGENT }}
          AGENT_SALES_TARGET_TYPE: ${{ steps.mode.outputs.agent_type }}
          AGENT_SALES_FIRST_PARTY_REACTIVATION: ${{ vars.AGENT_SALES_FIRST_PARTY_REACTIVATION || 'false' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_agent_qualification.py --mode "$PROSPECT_QUALIFICATION_MODE" --report prospect-agent-qualification-report.json

      - name: Enforce one-agent campaign target before contact research
        env:
          AGENT_SALES_CAMPAIGN_GATE_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'audit' || 'validate' }}
          AGENT_SALES_TARGET_TYPE: ${{ steps.mode.outputs.agent_type }}
          AGENT_SALES_FIRST_PARTY_REACTIVATION: ${{ vars.AGENT_SALES_FIRST_PARTY_REACTIVATION || 'false' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_campaign_gate.py --mode "$AGENT_SALES_CAMPAIGN_GATE_MODE" --report prospect-campaign-gate-report.json

      - name: Enrich qualified official-site contacts
        env:
          CONTACT_ENRICHMENT_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          CONTACT_ENRICHMENT_MAX_PER_RUN: ${{ vars.CONTACT_ENRICHMENT_MAX_PER_RUN || '25' }}
          CONTACT_ENRICHMENT_MIN_INTERVAL: ${{ vars.CONTACT_ENRICHMENT_MIN_INTERVAL || '0.5' }}
          CONTACT_ENRICHMENT_TIMEOUT: ${{ vars.CONTACT_ENRICHMENT_TIMEOUT || '10' }}
          AGENT_SALES_TARGET_TYPE: ${{ steps.mode.outputs.agent_type }}
          AGENT_SALES_FIRST_PARTY_REACTIVATION: ${{ vars.AGENT_SALES_FIRST_PARTY_REACTIVATION || 'false' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_contact_enrichment_campaign.py

      - name: Refresh advisory prospect intelligence
        if: steps.mode.outputs.mode == 'prepare'
        env:
          PROSPECT_INTELLIGENCE_MODE: refresh
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_INTELLIGENCE_STALE_DAYS: ${{ vars.PROSPECT_INTELLIGENCE_STALE_DAYS || '30' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_intelligence_runtime.py --mode refresh --report prospect-intelligence-report.json

      - name: Load private outreach config
        if: steps.mode.outputs.mode == 'prepare'
        env:
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_private_config.py

      - name: Prepare campaign-first value-flow agent copy without send permission
        if: steps.mode.outputs.mode == 'prepare'
        env:
          OUTREACH_PREPARE_MODE: prepare
          AGENT_SALES_TARGET_TYPE: ${{ steps.mode.outputs.agent_type }}
          OUTREACH_CTA_VARIANT: ${{ vars.OUTREACH_CTA_VARIANT || 'A' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_PREPARE_MAX_PER_RUN: ${{ vars.OUTREACH_PREPARE_MAX_PER_RUN || '25' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_agent_prepare_v2.py --mode prepare --report outreach-agent-prepare-report.json

      - name: Write campaign-first agent-sales prepare summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Leads campaign-first agent-sales prepare"
            echo
            echo "- mode: \`${{ steps.mode.outputs.mode }}\`"
            echo "- force-recheck: \`${{ steps.mode.outputs.recheck }}\`"
            echo "- campaign agent: \`${{ steps.mode.outputs.agent_type }}\`"
            echo "- owner: \`leads\`"
            echo "- offer family: \`ai_agent\`"
            echo "- flow: \`CAMPAGNE -> VIND -> SANITIZE -> TARGET-AWARE AGENT-FIT -> CAMPAIGN-GATE -> CONTACT -> VALUE-FLOW MAIL\`"
            echo "- website: \`parsed homepage + at most one same-site process page; full technical scan only on evidence-gap\`"
            echo "- compliance: \`manual_review/fail-closed until an evidenced basis exists\`"
            echo "- send permission: \`none\`"
            echo
            echo "This workflow may discover, sanitize, qualify against the selected campaign agent, audit that campaign match, enrich qualified contacts and prepare bounded value-flow outreach. It never receives mailbox credentials and never calls SMTP."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepare receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leads-agent-sales-${{ github.run_id }}
          path: |
            prospect-discovery-report.json
            prospect-signal-report.json
            prospect-agent-qualification-report.json
            prospect-campaign-gate-report.json
            prospect-intelligence-report.json
            outreach-agent-prepare-report.json
          if-no-files-found: ignore
          retention-days: 14