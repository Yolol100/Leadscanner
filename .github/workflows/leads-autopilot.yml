name: Leads Zero-Touch Prepare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the pipeline or run bounded prepare automation
        required: true
        type: choice
        options:
          - validate
          - prepare
        default: validate
  schedule:
    - cron: '11 8 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'ops/leads-autopilot-request.txt'

permissions:
  contents: read

concurrency:
  group: leads-zero-touch-prepare
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve bounded automation mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${REQUESTED_MODE:-validate}"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            mode="prepare"
          elif [ -f ops/leads-autopilot-request.txt ]; then
            requested="$(tr -d '\r\n ' < ops/leads-autopilot-request.txt | tr '[:upper:]' '[:lower:]')"
            case "$requested" in
              prepare) mode="prepare" ;;
              validate|'') mode="validate" ;;
              *) echo "unsupported request file mode: $requested" >&2; exit 2 ;;
            esac
          else
            mode="validate"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "LEADS_AUTOPILOT_MODE=$mode"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require Sheet runtime credential
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is required."; exit 1; }
          echo "SHEET_RUNTIME_AUTH=present"

      - name: Discover bounded prospects
        env:
          PROSPECT_DISCOVERY_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_DISCOVERY_MAX_TOTAL: ${{ vars.PROSPECT_DISCOVERY_MAX_TOTAL || '25' }}
          PROSPECT_DISCOVERY_TARGET_NEW: ${{ vars.PROSPECT_DISCOVERY_TARGET_NEW || '10' }}
          PROSPECT_DISCOVERY_TIMEOUT_SECONDS: ${{ vars.PROSPECT_DISCOVERY_TIMEOUT_SECONDS || '10' }}
          PROSPECT_DISCOVERY_MAX_BYTES: ${{ vars.PROSPECT_DISCOVERY_MAX_BYTES || '2097152' }}
          PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_DISCOVERY_USER_AGENT: ${{ vars.PROSPECT_DISCOVERY_USER_AGENT }}
          PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES: ${{ vars.PROSPECT_DISCOVERY_EXCLUDE_COUNTRIES }}
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: ${{ vars.PROSPECT_DISCOVERY_PREFERRED_COUNTRIES || 'US,NL,GB,DE,FR,BE,ES,IT,SE,DK,NO,FI,AT,CH,IE,PT,PL,CZ' }}
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: ${{ vars.PROSPECT_DISCOVERY_EXCLUDE_AGENCIES || 'true' }}
          PROSPECT_DISCOVERY_EXTRA_EXCLUDE_TERMS: ${{ vars.PROSPECT_DISCOVERY_EXTRA_EXCLUDE_TERMS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_discovery_runtime.py --mode "$PROSPECT_DISCOVERY_MODE" --report prospect-discovery-report.json

      - name: Collect bounded official-site signals
        env:
          PROSPECT_SIGNAL_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_SIGNAL_MAX_CANDIDATES: ${{ vars.PROSPECT_SIGNAL_MAX_CANDIDATES || '10' }}
          PROSPECT_SIGNAL_TIMEOUT_SECONDS: ${{ vars.PROSPECT_SIGNAL_TIMEOUT_SECONDS || '10' }}
          PROSPECT_SIGNAL_MAX_BYTES: ${{ vars.PROSPECT_SIGNAL_MAX_BYTES || '524288' }}
          PROSPECT_SIGNAL_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_SIGNAL_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_SIGNAL_USER_AGENT: ${{ vars.PROSPECT_SIGNAL_USER_AGENT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_signal_discovery_runtime.py --mode "$PROSPECT_SIGNAL_MODE" --report prospect-signal-report.json

      - name: Qualify evidence-bound prospects
        env:
          PROSPECT_QUALIFICATION_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'qualify' || 'validate' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_QUALIFICATION_MAX_PER_RUN: ${{ vars.PROSPECT_QUALIFICATION_MAX_PER_RUN || '10' }}
          PROSPECT_QUALIFICATION_TIMEOUT_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_TIMEOUT_SECONDS || '10' }}
          PROSPECT_QUALIFICATION_MAX_BYTES: ${{ vars.PROSPECT_QUALIFICATION_MAX_BYTES || '524288' }}
          PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS: ${{ vars.PROSPECT_QUALIFICATION_MIN_INTERVAL_SECONDS || '0.5' }}
          PROSPECT_QUALIFICATION_USER_AGENT: ${{ vars.PROSPECT_QUALIFICATION_USER_AGENT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_qualification.py --mode "$PROSPECT_QUALIFICATION_MODE" --report prospect-qualification-report.json

      - name: Enrich qualified official-site contacts
        env:
          CONTACT_ENRICHMENT_MODE: ${{ steps.mode.outputs.mode == 'prepare' && 'discover' || 'validate' }}
          CONTACT_ENRICHMENT_MAX_PER_RUN: ${{ vars.CONTACT_ENRICHMENT_MAX_PER_RUN || '10' }}
          CONTACT_ENRICHMENT_MIN_INTERVAL: ${{ vars.CONTACT_ENRICHMENT_MIN_INTERVAL || '0.5' }}
          CONTACT_ENRICHMENT_TIMEOUT: ${{ vars.CONTACT_ENRICHMENT_TIMEOUT || '10' }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_contact_enrichment.py

      - name: Refresh advisory prospect intelligence
        if: steps.mode.outputs.mode == 'prepare'
        env:
          PROSPECT_INTELLIGENCE_MODE: refresh
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          PROSPECT_INTELLIGENCE_STALE_DAYS: ${{ vars.PROSPECT_INTELLIGENCE_STALE_DAYS || '30' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/prospect_intelligence_runtime.py --mode refresh --report prospect-intelligence-report.json

      - name: Prepare LeadPromo queue rows without send permission
        if: steps.mode.outputs.mode == 'prepare'
        env:
          OUTREACH_PREPARE_MODE: prepare
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_PREPARE_MAX_PER_RUN: ${{ vars.OUTREACH_PREPARE_MAX_PER_RUN || '10' }}
          OUTREACH_POSTAL_ADDRESS: ${{ vars.OUTREACH_POSTAL_ADDRESS }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_prepare.py --mode prepare --report outreach-prepare-report.json

      - name: Write zero-touch prepare summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Leads zero-touch prepare"
            echo
            echo "- mode: \`${{ steps.mode.outputs.mode }}\`"
            echo "- owner: \`leads\`"
            echo "- flow: \`VIND -> KWALIFICEER -> CONTACT + MAIL\`"
            echo "- compliance: \`manual_review/fail-closed until an evidenced basis exists\`"
            echo "- send permission: \`none\`"
            echo
            echo "This workflow may discover, score, enrich and prepare bounded evidence-bound lead state. It never receives mailbox credentials and never calls SMTP."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepare receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leads-zero-touch-${{ github.run_id }}
          path: |
            prospect-discovery-report.json
            prospect-signal-report.json
            prospect-qualification-report.json
            prospect-intelligence-report.json
            outreach-prepare-report.json
          if-no-files-found: ignore
          retention-days: 14
