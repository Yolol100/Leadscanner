name: Leadscanner schedule health - read only
on:
  schedule:
    # Run after the weekly 06:23 UTC discovery and weekday 07:17 UTC research.
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/schedule_health.py
      - tests/test_schedule_health.py
      - .github/workflows/lead-schedule-health.yml
permissions:
  contents: read
  actions: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Offline scheduled health fault scenarios
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_schedule_health.py' -v
  health:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fail on missed cron, failed required job or stale run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/schedule_health.py
