name: Temporary Batch 12 Parallel Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-batch12-parallel-audit.yml'

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build exact read-only chunk
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          mkdir -p results/source
          gh issue view 1336 --repo "$GITHUB_REPOSITORY" --json body -q .body > results/full.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("results/full.json").read_text())
          n=int(os.environ["CHUNK"])
          ids=r["audited_lead_ids"][n*13:(n+1)*13]
          keep=set(ids)
          r["audited_lead_ids"]=ids
          r["rewrites"]={k:v for k,v in (r.get("rewrites") or {}).items() if k in keep}
          r["replacements"]={k:v for k,v in (r.get("replacements") or {}).items() if k in keep}
          r["holds"]=[x for x in (r.get("holds") or []) if x in keep]
          assert r["audit_only"] is True and len(ids)==13
          Path("results/request.json").write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          print(f"CHUNK_REQUEST=green chunk={n} audited={len(ids)}")
          PY
      - name: Download canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/11069173400/zip" > results/source.zip
          unzip -q results/source.zip -d results/source
      - name: Audit official evidence read-only
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_content_remediation.py             --request results/request.json             --source-root results/source             --config config/growth-subscription.json             --report results/report.json > results/audit.txt
          cat results/audit.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("results/report.json").read_text())
          assert r["audit_only"] is True
          assert r["read_only"] is True
          assert r["audited_count"] == 13
          assert r["unassessed_count"] == 0
          assert r["final_exact_changed_count"] == 0
          assert r["automatic_send"] is False
          assert r["send_capability"] == "unavailable"
          print(f"BATCH12_CHUNK_AUDIT=green chunk={os.environ['CHUNK']}")
          print("BATCH12_CHUNK_REPORT="+json.dumps(r,ensure_ascii=False,separators=(",",":")))
          PY
