name: Overture keyless discovery

on:
  pull_request:
    paths:
      - 'scripts/overture_discovery.py'
      - 'tests/test_overture_discovery.py'
      - 'requirements-discovery.txt'
      - '.github/workflows/overture-discovery.yml'
  workflow_dispatch:
    inputs:
      region:
        description: "Dutch place or municipality name; leave empty when bbox is supplied"
        required: false
        default: "Rotterdam"
        type: string
      bbox:
        description: "Optional west,south,east,north; overrides region"
        required: false
        default: ""
        type: string
      radius_km:
        description: "Radius around resolved region centre (0.5-50)"
        required: true
        default: "8"
        type: string
      keywords:
        description: "Comma-separated English category/name keywords, e.g. bakery,baker"
        required: false
        default: ""
        type: string
      max_results:
        description: "Maximum candidate hints (1-500)"
        required: true
        default: "20"
        type: string
      require_website:
        description: "Keep only records with an Overture website hint"
        required: true
        default: true
        type: boolean
      probe_websites:
        description: "Directly read back the website hint, without authorizing identity"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: overture-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt
      - name: Run bounded no-key discovery smoke
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/overture_discovery.py             --region Rotterdam             --radius-km 1.5             --keyword restaurant             --max-results 3             --require-website             --output results/overture-discovery-smoke.json
      - name: Verify no-key and no-contact handoff
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results/overture-discovery-smoke.json").read_text())
          assert data["authentication"] == "none"
          assert data["source"] == "Overture Maps Places"
          assert 0 <= data["candidate_count"] <= 3
          assert data["privacy_and_scope"]["emails_emitted"] is False
          assert data["privacy_and_scope"]["phones_emitted"] is False
          assert data["privacy_and_scope"]["socials_emitted"] is False
          assert data["privacy_and_scope"]["contact_basis_evaluated"] is False
          assert data["privacy_and_scope"]["draftqueue_write"] is False
          assert data["privacy_and_scope"]["email_send"] is False
          assert all(c["identity_status"] == "needs_leads_verification" for c in data["candidates"])
          print(f"OVERTURE_LIVE_SMOKE=green candidates={data['candidate_count']} authentication=none")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: overture-discovery-smoke-${{ github.run_number }}
          path: results/overture-discovery-smoke.json
          if-no-files-found: warn
          retention-days: 1

  discover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt
      - name: Run keyless discovery
        shell: bash
        env:
          REGION: ${{ inputs.region }}
          BBOX: ${{ inputs.bbox }}
          RADIUS_KM: ${{ inputs.radius_km }}
          KEYWORDS: ${{ inputs.keywords }}
          MAX_RESULTS: ${{ inputs.max_results }}
          REQUIRE_WEBSITE: ${{ inputs.require_website }}
          PROBE_WEBSITES: ${{ inputs.probe_websites }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          args=(--radius-km "$RADIUS_KM" --max-results "$MAX_RESULTS" --output results/overture-discovery.json)
          if [ -n "$BBOX" ]; then
            args+=(--bbox "$BBOX")
          else
            [ -n "$REGION" ] || { echo 'region or bbox is required' >&2; exit 2; }
            args+=(--region "$REGION")
          fi
          IFS=',' read -ra raw_keywords <<< "$KEYWORDS"
          for keyword in "${raw_keywords[@]}"; do
            keyword="$(printf '%s' "$keyword" | xargs)"
            [ -n "$keyword" ] && args+=(--keyword "$keyword")
          done
          [ "$REQUIRE_WEBSITE" = "true" ] && args+=(--require-website)
          [ "$PROBE_WEBSITES" = "true" ] && args+=(--probe-websites)
          python3 scripts/overture_discovery.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overture-discovery-${{ github.run_number }}
          path: results/overture-discovery.json
          if-no-files-found: error
          retention-days: 1
