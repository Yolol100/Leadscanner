name: Leads Opening Bulk Remediation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: >-
    ${{ contains(github.event.issue.body, '"operation":"apply"') && 'leads-content-remediation-write' || format('opening-bulk-audit-{0}', github.event.issue.number) }}
  cancel-in-progress: false
  queue: max

jobs:
  opening-bulk:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[growth-opening-bulk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve encrypted bounded bulk request
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
        run: |
          mkdir -p results/source results/audit
          PYTHONPATH=scripts python3 scripts/opening_transport.py resolve
          if test "${{ steps.request.outputs.is_key }}" = "false"; then
            python3 - <<'PY'
          import json
          request = json.load(open('results/request.json'))
          if request.get('orchestrator') is not True:
              raise SystemExit('bulk workflow requires orchestrator=true')
          PY
          fi
      - name: Download immutable source and audit
        if: steps.request.outputs.is_key == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
        run: |
          set -euo pipefail
          archive=$(python3 -c 'import json; print(json.load(open("results/request.json"))["source_archive_artifact_id"])')
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$archive/zip" > results/source.zip
          unzip -q results/source.zip -d results/source
          audit=$(python3 -c 'import json; print(json.load(open("results/request.json")).get("audit_artifact_id", 0))')
          if [ "$audit" != 0 ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$audit/zip" > results/audit.zip
            unzip -q results/audit.zip -d results/audit
            PYTHONPATH=scripts python3 scripts/opening_transport.py decode-audit
            test -f results/audit/opening-report.json
          fi
      - name: Parallel website audit and serial bounded mailbox lane
        if: steps.request.outputs.is_key == 'false'
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
          LEADSCANNER_WEBSITE_TOTAL_CONCURRENCY: '240'
          LEADSCANNER_WEBSITE_SHARD_CONCURRENCY: '60'
          LEADSCANNER_WEBSITE_PER_HOST: '2'
        run: |
          set -euo pipefail
          args=()
          if test -f results/audit/opening-report.json; then args+=(--audit results/audit/opening-report.json); fi
          PYTHONPATH=scripts python3 scripts/myhost_opening_bulk.py --request results/request.json --source-root results/source "${args[@]}" --report results/opening-report.json > results/private-result.txt
      - name: Encrypt exact readback evidence
        if: always() && steps.request.outputs.is_key == 'false'
        env:
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
        run: PYTHONPATH=scripts python3 scripts/opening_transport.py publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: opening-bulk-${{ github.event.issue.number }}
          path: |
            results/public-key.json
            results/opening-report.enc.json
            results/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Close request with aggregate summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if test -f results/summary.json; then
            python3 -c 'import json; print("OPENING_BULK_RESULT=" + json.dumps(json.load(open("results/summary.json"))))' > results/comment.txt
          elif test -f results/public-key.json; then
            echo 'Encrypted transport public key available in run artifact. No mailbox operation performed.' > results/comment.txt
          else
            echo 'Bulk opening remediation blocked before a complete report. Nothing was sent.' > results/comment.txt
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file results/comment.txt
          gh issue close "$ISSUE_NUMBER" --reason completed
