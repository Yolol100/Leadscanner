name: Temporary my.host V17.2.2 Copy Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tmp-myhost-v1722-copy-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'AUDIT MYHOST V17.2.2 COPY' &&
      contains(github.event.issue.body, 'COMMAND=AUDIT_MYHOST_V1722_COPY')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse expected count
        id: command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t count_lines < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("EXPECTED_COUNT=")) | sub("^EXPECTED_COUNT="; "")' "$GITHUB_EVENT_PATH")
          if [ "${#count_lines[@]}" -ne 1 ]; then
            echo 'Expected exactly one EXPECTED_COUNT line.' >&2
            exit 2
          fi
          expected_count="${count_lines[0]}"
          if ! [[ "$expected_count" =~ ^[0-9]{1,3}$ ]] || [ "$expected_count" -lt 1 ] || [ "$expected_count" -gt 500 ]; then
            echo 'EXPECTED_COUNT must be between 1 and 500.' >&2
            exit 2
          fi
          echo "expected_count=$expected_count" >> "$GITHUB_OUTPUT"

      - name: Load private outreach config
        env:
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_private_config.py

      - name: Audit actual Drafts bodies read-only
        id: audit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: '100'
          OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ''
          EXPECTED_COUNT: ${{ steps.command.outputs.expected_count }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import html
          import imaplib
          import json
          import os
          import re
          import ssl
          from collections import Counter
          from email import policy
          from email.parser import BytesParser
          from email.utils import getaddresses

          import sys
          sys.path.insert(0, 'scripts')
          from outreach_copy_v17_2 import POLICY_VERSION, initial_copy_errors
          from outreach_imap_draft import choose_mailbox, detect_drafts_folder
          from outreach_mailboxes import enabled_mailboxes, load_mailboxes_from_env
          from outreach_queue_imap_draft import (
              QUEUE_SHEET,
              build_sheets_service,
              get_values,
              inject_private_postal_for_draft,
              rows_from_values,
          )
          from outreach_queue_imap_draft_sync import _normalize_email, _normalize_text, _uid_search

          expected = int(os.environ['EXPECTED_COUNT'])
          spreadsheet_id = os.environ['OUTREACH_SPREADSHEET_ID']
          service = build_sheets_service()
          rows = rows_from_values(get_values(service, spreadsheet_id, QUEUE_SHEET))

          daily_limit = int(os.getenv('OUTREACH_DAILY_LIMIT', '20') or '20')
          mailboxes = enabled_mailboxes(load_mailboxes_from_env(mode='validate', default_daily_limit=daily_limit))
          mailbox = choose_mailbox(mailboxes, os.getenv('OUTREACH_DRAFT_MAILBOX_ID', ''))
          sender = _normalize_email(mailbox.sender_email)
          if not getattr(mailbox, 'mail_password', ''):
              raise RuntimeError('OUTREACH_MAIL_PASSWORD is required')

          by_recipient = {}
          for idx, row in enumerate(rows, start=2):
              email = _normalize_email(row.get('email', ''))
              row_sender = _normalize_email(row.get('sender_email', ''))
              if not email or (row_sender and row_sender != sender):
                  continue
              item = dict(row)
              item.update({
                  '_row': idx,
                  'lead_id': (row.get('lead_id') or '').strip(),
                  'subject': (row.get('subject') or '').strip(),
                  'body': (row.get('body') or '').strip(),
                  'status': (row.get('status') or '').strip().lower(),
                  'last_error': (row.get('last_error') or '').strip(),
              })
              by_recipient.setdefault(email, []).append(item)

          def raw_message(imap, uid):
              status, data = imap.uid('FETCH', str(uid), '(BODY.PEEK[])')
              if status != 'OK':
                  raise RuntimeError(f'IMAP FETCH failed for uid {uid}')
              for item in data or []:
                  if isinstance(item, tuple) and len(item) >= 2 and isinstance(item[1], (bytes, bytearray)):
                      return bytes(item[1])
              raise RuntimeError(f'no message bytes for uid {uid}')

          def text_body(msg):
              parts = []
              if msg.is_multipart():
                  for part in msg.walk():
                      if part.get_content_disposition() == 'attachment':
                          continue
                      if part.get_content_type() == 'text/plain':
                          try:
                              parts.append(part.get_content())
                          except Exception:
                              payload = part.get_payload(decode=True) or b''
                              parts.append(payload.decode(part.get_content_charset() or 'utf-8', 'replace'))
                  if parts:
                      return '\n'.join(parts).strip()
                  for part in msg.walk():
                      if part.get_content_type() == 'text/html':
                          try:
                              value = part.get_content()
                          except Exception:
                              value = (part.get_payload(decode=True) or b'').decode(part.get_content_charset() or 'utf-8', 'replace')
                          value = re.sub(r'(?is)<(?:br|/p|/div|/li)[^>]*>', '\n', value)
                          value = re.sub(r'(?is)<[^>]+>', '', value)
                          return html.unescape(value).strip()
              try:
                  return str(msg.get_content()).strip()
              except Exception:
                  payload = msg.get_payload(decode=True) or b''
                  return payload.decode(msg.get_content_charset() or 'utf-8', 'replace').strip()

          context = ssl.create_default_context()
          imap = imaplib.IMAP4_SSL(mailbox.imap_host, mailbox.imap_port, ssl_context=context)
          report = {
              'policy_version': POLICY_VERSION,
              'mode': 'read_only_rendered_parity_audit',
              'expected_count': expected,
              'sender_email': sender,
              'smtp_send': 'not_invoked',
              'drafts': [],
          }
          try:
              status, _ = imap.login(mailbox.mail_user, mailbox.mail_password)
              if status != 'OK':
                  raise RuntimeError('IMAP authentication failed')
              status, folders = imap.list()
              if status != 'OK':
                  raise RuntimeError('IMAP LIST failed')
              folder = detect_drafts_folder(folders or (), explicit_folder=os.getenv('OUTREACH_DRAFT_FOLDER', ''))
              report['folder'] = folder
              status, _ = imap.select(folder, readonly=True)
              if status != 'OK':
                  raise RuntimeError(f'failed to select Drafts folder read-only: {folder}')

              for uid in _uid_search(imap, 'ALL'):
                  msg = BytesParser(policy=policy.default).parsebytes(raw_message(imap, uid))
                  froms = [_normalize_email(addr) for _, addr in getaddresses([str(msg.get('From', ''))])]
                  if sender not in froms:
                      continue
                  recipients = sorted({_normalize_email(addr) for _, addr in getaddresses([str(msg.get('To', ''))]) if _normalize_email(addr)})
                  subject = str(msg.get('Subject', '')).strip()
                  body = text_body(msg)
                  recipient_candidates = {}
                  subject_candidates = {}
                  for recipient in recipients:
                      for row in by_recipient.get(recipient, []):
                          if row['lead_id']:
                              recipient_candidates[row['lead_id']] = row
                              if row['subject'] == subject:
                                  subject_candidates[row['lead_id']] = row
                  chosen = subject_candidates if subject_candidates else recipient_candidates
                  basis = 'recipient_subject' if subject_candidates else ('recipient' if recipient_candidates else 'none')
                  candidate_ids = sorted(chosen)
                  selected = chosen[candidate_ids[0]] if len(candidate_ids) == 1 else None
                  entry = {
                      'uid': str(uid),
                      'recipients': recipients,
                      'subject_sha256': hashlib.sha256(subject.encode('utf-8')).hexdigest(),
                      'body_sha256': hashlib.sha256(_normalize_text(body).encode('utf-8')).hexdigest(),
                      'match_basis': basis,
                      'candidate_lead_ids': candidate_ids,
                      'candidate_count': len(candidate_ids),
                  }
                  if selected:
                      queue_subject = selected['subject']
                      queue_body = selected['body']
                      rendered_body = inject_private_postal_for_draft(selected, queue_body)
                      subject_match = queue_subject == subject
                      body_match = _normalize_text(rendered_body) == _normalize_text(body)
                      copy_errors = initial_copy_errors(queue_subject, queue_body)
                      bounced = selected['status'] == 'bounced' or 'delivery status notification' in selected['last_error'].lower()
                      active_pass = (not bounced) and subject_match and body_match and not copy_errors
                      entry.update({
                          'lead_id': selected['lead_id'],
                          'queue_row': selected['_row'],
                          'status': selected['status'],
                          'bounced_excluded': bounced,
                          'copy_errors': copy_errors,
                          'queue_subject_match': subject_match,
                          'queue_body_match': body_match,
                          'active_copy_pass': active_pass,
                          'queue_body_sha256': hashlib.sha256(_normalize_text(rendered_body).encode('utf-8')).hexdigest(),
                      })
                  report['drafts'].append(entry)

              report['drafts'].sort(key=lambda x: ((x.get('recipients') or [''])[0], x.get('lead_id',''), x.get('uid','')))
              mapped_ids = [x.get('lead_id') for x in report['drafts'] if x.get('lead_id')]
              lead_counts = Counter(mapped_ids)
              duplicate_drafts = sum(count - 1 for count in lead_counts.values() if count > 1)
              active = [x for x in report['drafts'] if x.get('lead_id') and not x.get('bounced_excluded')]
              bounced = [x for x in report['drafts'] if x.get('bounced_excluded')]
              counts = {
                  'sender_drafts': len(report['drafts']),
                  'mapped_one': sum(x['candidate_count'] == 1 for x in report['drafts']),
                  'ambiguous': sum(x['candidate_count'] > 1 for x in report['drafts']),
                  'orphan': sum(x['candidate_count'] == 0 for x in report['drafts']),
                  'active_target': len(active),
                  'active_pass': sum(bool(x.get('active_copy_pass')) for x in active),
                  'active_fail': sum(not bool(x.get('active_copy_pass')) for x in active),
                  'active_queue_match': sum(bool(x.get('queue_subject_match')) and bool(x.get('queue_body_match')) for x in active),
                  'active_queue_mismatch': sum(not (bool(x.get('queue_subject_match')) and bool(x.get('queue_body_match'))) for x in active),
                  'bounced_excluded': len(bounced),
                  'duplicate_drafts': duplicate_drafts,
                  'stale_drafts': sum(not bool(x.get('queue_body_match')) for x in active),
              }
              report['counts'] = counts
              blockers = []
              if counts['sender_drafts'] != expected:
                  blockers.append(f"expected {expected} sender drafts; found {counts['sender_drafts']}")
              if counts['ambiguous'] or counts['orphan'] or counts['duplicate_drafts']:
                  blockers.append('mapping, orphan, or duplicate draft remains')
              if counts['active_fail'] or counts['active_queue_mismatch'] or counts['stale_drafts']:
                  blockers.append('active draft copy/parity failure remains')
              report['blockers'] = blockers
              report['status'] = 'green' if not blockers else 'blocked'
          finally:
              try:
                  imap.logout()
              except Exception:
                  pass

          with open('myhost-v1722-copy-audit.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          c = report['counts']
          print(
              'MYHOST_V1722_COPY_AUDIT=' + report['status'] +
              f" sender_drafts={c['sender_drafts']} active_target={c['active_target']} active_pass={c['active_pass']} active_fail={c['active_fail']}" +
              f" bounced_excluded={c['bounced_excluded']} mapped_one={c['mapped_one']} ambiguous={c['ambiguous']} orphan={c['orphan']}" +
              f" duplicate_drafts={c['duplicate_drafts']} active_queue_match={c['active_queue_match']} active_queue_mismatch={c['active_queue_mismatch']}" +
              f" stale_drafts={c['stale_drafts']} smtp_send=not_invoked"
          )
          if report['status'] != 'green':
              raise SystemExit(2)
          PY

      - name: Upload private audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myhost-v1722-copy-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: myhost-v1722-copy-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Report counts only
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          EXPECTED_COUNT: ${{ steps.command.outputs.expected_count }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f myhost-v1722-copy-audit.json ]; then
            detail="$(python3 - <<'PY'
          import json
          d=json.load(open('myhost-v1722-copy-audit.json',encoding='utf-8'))
          c=d.get('counts',{})
          keys=('sender_drafts','active_target','active_pass','active_fail','bounced_excluded','mapped_one','ambiguous','orphan','duplicate_drafts','active_queue_match','active_queue_mismatch','stale_drafts')
          print(' '.join(f"{key}={c.get(key,0)}" for key in keys))
          PY
          )"
          else
            detail='audit artifact missing'
          fi
          body="MYHOST_V1722_COPY_AUDIT_COMMAND=${AUDIT_OUTCOME}\nEXPECTED_COUNT=${EXPECTED_COUNT}\n${detail}\nTRANSPORT=IMAP_READ_ONLY\nSMTP_SEND=not_invoked"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed",state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d "$close_payload" >/dev/null

      - name: Fail closed unless full mailbox parity is green
        if: steps.audit.outcome != 'success'
        run: |
          echo 'V17.2.2 mailbox audit did not complete exactly.' >&2
          echo 'SMTP_SEND=not_invoked'
          exit 1
