name: Independent read-only post-cancel 509 Draft integrity check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postcancel_integrity:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'POSTCANCEL509_DIAG:')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Inspect only active, old hold, and partial original backups
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          from _once_redraft_509_in_50 import (
              BACKUP_FOLDER, _find_backup_folder, _backup_inventory,
          )
          from _once_myhost_existing_rewrite import inventory_existing
          from _once_myhost_safe_hold import HOLD_FOLDER, _one_uid, _raw_uid, validate_hold_inventory
          from myhost_draft import connect_imap, select_folder, find_drafts_folder
          stage = 'connection'
          safe_counts = None
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  client = connect_imap()
                  try:
                      stage = 'drafts_folder_selection'
                      folder = find_drafts_folder(client)
                      stage = 'active_inventory'
                      active = inventory_existing(client, folder, expected_total=None)
                      stage = 'held_inventory'
                      held = inventory_existing(client, HOLD_FOLDER, expected_total=None)
                      safe_counts = (len(active), len(held),
                                     len({x['lead_id'] for x in active + held}))
                      stage = 'count_preflight'
                      if safe_counts != (509, 664, 1173):
                          raise RuntimeError('initial_inventory_509_664_changed')
                      stage = 'full_union_integrity'
                      validate_hold_inventory(client, folder, HOLD_FOLDER, inventory_existing, 1173)
                      stage = 'folder_listing'
                      status, listed = client.list()
                      if status != 'OK':
                          raise RuntimeError('folder_listing_unavailable')
                      has_backup = any(BACKUP_FOLDER.encode() in item
                                       for item in listed or [] if isinstance(item, bytes))
                      originals = []
                      if has_backup:
                          stage = 'backup_inventory'
                          _find_backup_folder(client, folder, create=False)
                          originals = _backup_inventory(client, expected=None)
                      stage = 'backups_still_active'
                      active_ids = {item['lead_id'] for item in active}
                      if not {item['lead_id'] for item in originals}.issubset(active_ids):
                          raise RuntimeError('copied_original_not_still_active')
                      stage = 'compare_backups_byte_for_byte'
                      for saved in originals:
                          original = _one_uid(client, folder, saved['lead_id'],
                                              require_draft=True)
                          restored = _one_uid(client, BACKUP_FOLDER, saved['lead_id'])
                          if original is None or restored is None:
                              raise RuntimeError('postcancel_missing_copy')
                          select_folder(client, folder, readonly=True)
                          left = _raw_uid(client, original)
                          select_folder(client, BACKUP_FOLDER, readonly=True)
                          right = _raw_uid(client, restored)
                          if left != right:
                              raise RuntimeError('original_bytes_changed_after_cancel')
                      copied = len(originals)
                  finally:
                      client.logout()
          except Exception as exc:
              import re
              allowed = {'initial_inventory_509_664_changed', 'hold_union_baseline_changed',
                         'backup_contains_unrelated_messages', 'copied_original_not_still_active',
                         'original_bytes_changed_after_cancel', 'imap_duplicate_lead_id',
                         'real_drafts_folder_missing_or_ambiguous',
                         'configured_drafts_folder_is_recovery_folder',
                         'imap_folder_list_failed', 'hold_folder_unrelated_content',
                         'imap_inventory_search_failed', 'imap_inventory_count_invalid',
                         'imap_inventory_incomplete', 'imap_noncanonical_tagged_draft',
                         'hold_overlap_missing_copy', 'hold_overlap_copy_mismatch'}
              raw = str(exc)
              if raw in allowed:
                  code = raw
              elif raw == 'Could not open drafts folder':
                  code = 'imap_select_failed'
              elif re.fullmatch(r'[a-z][a-z0-9_]{2,75}', raw):
                  code = raw
              else:
                  code = 'private_failure'
              exception_type = type(exc).__name__
              if exception_type not in {'RuntimeError','ValueError','TypeError','AttributeError',
                                        'error','abort','readonly','OSError','TimeoutError'}:
                  exception_type = 'OtherException'
              metric = (f' counts={safe_counts[0]},{safe_counts[1]},{safe_counts[2]}'
                        if safe_counts is not None else '')
              print('POSTCANCEL_509=red stage=' + stage + ' reason=' + code + ' class=' + exception_type + metric)
              raise SystemExit(1)
          print(f'POSTCANCEL_509=green active=509 held=664 union=1173 partial_backup_count={copied} originals_preserved=1 writes=0')
          PY
