name: Fast official website evidence - private only
on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/fast_website_evidence.py
      - scripts/verify_official_lead.py
      - tests/test_fast_website_evidence.py
      - .github/workflows/fast-website-evidence.yml
      - docs/leadscanner-cleanup-and-speed.md
  workflow_dispatch:
    inputs:
      source:
        type: choice
        description: "Privé bron: 100 Approved of de aparte historische 450"
        options: [Approved, Review450]
        required: true
        default: Approved
      batch:
        type: choice
        description: Batch van maximaal 100; bij Approved alleen 1
        options: ['1', '2', '3', '4', '5']
        required: true
        default: '1'
      force:
        type: boolean
        description: Negeer verse broncache en controleer websites opnieuw
        default: false
permissions:
  contents: read
concurrency:
  group: leads-private-candidates
  cancel-in-progress: false
  queue: max
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Offline official-site verification and private-cache tests
        env:
          PYTHONPATH: scripts:tests
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_fast_website_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_verified_fill_100.py' -q
  research:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.number == 1659 &&
        !github.event.issue.pull_request &&
        github.actor == 'Yolol100' &&
        github.event.comment.user.login == 'Yolol100' &&
        contains(fromJSON('["LEADS_EVIDENCE_V1:REVIEW450_BATCH_1","LEADS_EVIDENCE_V1:REVIEW450_BATCH_2","LEADS_EVIDENCE_V1:REVIEW450_BATCH_3","LEADS_EVIDENCE_V1:REVIEW450_BATCH_4","LEADS_EVIDENCE_V1:REVIEW450_BATCH_5"]'),
                 github.event.comment.body)) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        (startsWith(github.event.head_commit.message, 'LEADS_EVIDENCE_ONCE:') ||
         startsWith(github.event.head_commit.message, 'LEADS_CACHE_SMOKE:'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The same concurrency queue as the authorized IMAP replacement prevents
    # changing WebsiteEvidence in the middle of a private source snapshot.
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-draft.txt
      - run: python3 -m pip install -r requirements-draft.txt
      - run: python3 -m compileall -q scripts
      - name: Check official sites; save exact evidence only to existing private Leads Sheet
        env:
          PYTHONPATH: scripts
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          SOURCE: ${{ github.event_name == 'issue_comment' && 'Review450' || (github.event_name != 'workflow_dispatch' && 'Approved' || inputs.source) }}
          BATCH: ${{ github.event_name != 'workflow_dispatch' && '1' || inputs.batch }}
          OWNER_EVIDENCE_COMMAND: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          FORCE_RECHECK: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LEADS_EVIDENCE_ONCE:') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false') }}
        run: |
          if [ -n "$OWNER_EVIDENCE_COMMAND" ]; then
            case "$OWNER_EVIDENCE_COMMAND" in
              LEADS_EVIDENCE_V1:REVIEW450_BATCH_1) BATCH=1 ;;
              LEADS_EVIDENCE_V1:REVIEW450_BATCH_2) BATCH=2 ;;
              LEADS_EVIDENCE_V1:REVIEW450_BATCH_3) BATCH=3 ;;
              LEADS_EVIDENCE_V1:REVIEW450_BATCH_4) BATCH=4 ;;
              LEADS_EVIDENCE_V1:REVIEW450_BATCH_5) BATCH=5 ;;
              *) echo "Owner evidence command invalid" >&2; exit 2 ;;
            esac
            SOURCE=Review450
          fi
          if [ "$SOURCE" = "Approved" ] && [ "$BATCH" != "1" ]; then
            echo "Invalid Approved batch" >&2
            exit 2
          fi
          if [ "$FORCE_RECHECK" = "true" ]; then
            python3 scripts/fast_website_evidence.py --source "$SOURCE" --batch "$BATCH" --force
          else
            python3 scripts/fast_website_evidence.py --source "$SOURCE" --batch "$BATCH"
          fi
          if [ "$SOURCE" = "Approved" ]; then
            # An anonymous, READ-ONLY mail-copy viability test.
            # It does not touch DraftQueue, AutoDraftState, IMAP or Review450.
            python3 scripts/auto_draft_new.py --audit-existing
          fi
