name: US Outreach Cohort Validation

on:
  workflow_dispatch:
    inputs:
      expected_lead_ids:
        description: 'Comma-separated IDs of the exact US cohort to validate; no sending'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: outreach-cohort-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install outreach runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Validate exact US cohort without dispatch or sending
        env:
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID }}
          OUTREACH_ONE_TIME_EXPECTED_LEADS: ${{ inputs.expected_lead_ids }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OUTREACH_SPREADSHEET_ID"
          test -n "$OUTREACH_ONE_TIME_EXPECTED_LEADS"
          python3 scripts/outreach_one_time_us_guard.py
