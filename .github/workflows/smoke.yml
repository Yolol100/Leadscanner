name: Scanner Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan safe test site
        env:
          TARGET_URL: https://example.com/
          RUN_LIGHTHOUSE: 'false'
        run: npm run scan

      - name: Verify output
        run: test -f scan-results/results.json && test -f scan-results/summary.md

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadscanner-smoke-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 2
