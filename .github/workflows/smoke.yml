name: Scanner Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tool-registry.json'
      - 'LEADS-INTEGRATION.md'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tool-registry.json'
      - 'LEADS-INTEGRATION.md'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22.23.2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Crawlee and Playwright
        run: npm run check:crawler

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Run accountless toolbox unit smoke
        env:
          RUN_LANGUAGE_TOOL: 'false'
        run: npm run smoke:toolbox

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Scan safe test site
        env:
          TARGET_URL: https://example.com/
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '1'
          MAX_REQUESTS_PER_MINUTE: '10'
        run: npm run scan

      - name: Enrich safe test site
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'false'
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Verify lead-compatible browser evidence and handoff
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const results = JSON.parse(fs.readFileSync('scan-results/results.json', 'utf8'));
          if (results.length !== 1) throw new Error('Expected exactly one smoke result');
          const r = results[0];
          if (!r.safe_boundary_respected) throw new Error('Safe boundary not recorded');
          if (!r.browser_route_complete) throw new Error('Desktop/mobile route is incomplete');
          if (!r.desktop_evidence_ids?.length || !r.mobile_evidence_ids?.length) throw new Error('Missing desktop/mobile evidence IDs');
          if (!r.browser_evidence_records?.every((e) => e.source_type === 'controlled_browser_capture' && /^evidence-[0-9a-f]{12}$/.test(e.evidence_id) && /^[0-9a-f]{64}$/.test(e.evidence_sha256))) throw new Error('Invalid browser evidence contract');
          if (r.supplemental?.scoring_policy !== 'supplemental_only_no_automatic_lead_score') throw new Error('Supplemental scoring boundary missing');
          if (!r.supplemental?.discovery || !r.supplemental?.technology || !r.supplemental?.linkinator) throw new Error('Missing toolbox enrichment');

          const handoffs = JSON.parse(fs.readFileSync('scan-results/leads-handoff.json', 'utf8'));
          if (handoffs.length !== 1) throw new Error('Expected exactly one Leads handoff');
          const h = handoffs[0];
          if (h.format !== 'webactueel-leadscanner-handoff/1.0') throw new Error('Wrong handoff format');
          if (h.runtime_surface !== 'controlled-browser') throw new Error('Leads runtime_surface mismatch');
          if (h.runtime_detail !== 'github_actions_crawlee_playwright') throw new Error('Missing runtime provenance');
          if (!h.ready_for_leads_review) throw new Error('Handoff should be browser-complete');
          if (!/^evidence-[0-9a-f]{12}$/.test(h.desktop_evidence_id || '')) throw new Error('Missing desktop full-route evidence');
          if (!/^evidence-[0-9a-f]{12}$/.test(h.mobile_evidence_id || '')) throw new Error('Missing mobile full-route evidence');
          const fullRoutes = h.browser_evidence_records.filter((e) => e.route_category === 'full_route' && e.route_complete === true);
          if (fullRoutes.length !== 2 || new Set(fullRoutes.map((e) => e.device)).size !== 2) throw new Error('Expected desktop and mobile full-route evidence');
          if (h.scoring?.owner !== 'Webactueel Leads Skill' || h.scoring?.performed_by_repository !== false) throw new Error('Score ownership boundary broken');
          if (h.finding_candidates.some((f) => f.automatic_score_effect !== false || f.requires_leads_validation !== true)) throw new Error('Finding candidates may not auto-score');
          NODE
          test -f scan-results/summary.md

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadscanner-smoke-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 2
