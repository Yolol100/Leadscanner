name: Scanner Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tool-registry.json'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tool-registry.json'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22.23.2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Commit generated lockfile once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already committed and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Add reproducible npm lockfile'
          git push origin HEAD:main

      - name: Verify Crawlee and Playwright
        run: npm run check:crawler

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Run accountless toolbox unit smoke
        env:
          RUN_LANGUAGE_TOOL: 'false'
        run: npm run smoke:toolbox

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Scan safe test site
        env:
          TARGET_URL: https://example.com/
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '1'
          MAX_REQUESTS_PER_MINUTE: '10'
        run: npm run scan

      - name: Enrich safe test site
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'false'
        run: npm run enrich

      - name: Verify lead-compatible browser evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const results = JSON.parse(fs.readFileSync('scan-results/results.json', 'utf8'));
          if (results.length !== 1) throw new Error('Expected exactly one smoke result');
          const r = results[0];
          if (!r.safe_boundary_respected) throw new Error('Safe boundary not recorded');
          if (!r.browser_route_complete) throw new Error('Desktop/mobile route is incomplete');
          if (!r.desktop_evidence_ids?.length || !r.mobile_evidence_ids?.length) throw new Error('Missing desktop/mobile evidence IDs');
          if (!r.browser_evidence_records?.every((e) => e.source_type === 'controlled_browser_capture' && /^evidence-[0-9a-f]{12}$/.test(e.evidence_id) && /^[0-9a-f]{64}$/.test(e.evidence_sha256))) throw new Error('Invalid browser evidence contract');
          if (r.supplemental?.scoring_policy !== 'supplemental_only_no_automatic_lead_score') throw new Error('Supplemental scoring boundary missing');
          if (!r.supplemental?.discovery || !r.supplemental?.technology || !r.supplemental?.linkinator) throw new Error('Missing toolbox enrichment');
          NODE
          test -f scan-results/summary.md

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadscanner-smoke-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 2
