name: Temporary Current-main Discovery Proof

on:
  push:
    branches:
      - ops/leads-live-proof-20260905
    paths:
      - '.github/workflows/ops-current-discovery-proof.yml'

permissions:
  contents: read

jobs:
  current-main-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bf432765cc20b742435880a4491822f02e478455
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install discovery dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Assert no transport credentials are injected
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OUTREACH_MAIL_PASSWORD:-}"
          test -z "${OUTREACH_MAILBOXES_JSON:-}"
          test -z "${OUTREACH_SEED_INBOXES_JSON:-}"

      - name: Run bounded discovery on current source set
        env:
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID }}
          PROSPECT_DISCOVERY_MAX_TOTAL: '5'
          PROSPECT_DISCOVERY_TARGET_NEW: '5'
          PROSPECT_DISCOVERY_TIMEOUT_SECONDS: '10'
          PROSPECT_DISCOVERY_MAX_BYTES: '2097152'
          PROSPECT_DISCOVERY_MIN_INTERVAL_SECONDS: '0.25'
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: 'US,NL,GB,DE,FR,BE,ES,IT,SE,DK,NO,FI,AT,CH,IE,PT,PL,CZ'
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/prospect_discovery_runtime.py --mode discover --report prospect-discovery-report.json
          python3 - <<'PY'
          import json
          data=json.load(open('prospect-discovery-report.json', encoding='utf-8'))
          safe={k:data.get(k) for k in ('status','discovered','target_new','target_remaining','source_failures','source_results','observations_persisted','source_runs_persisted')}
          print('DISCOVERY_PROOF=' + json.dumps(safe, sort_keys=True))
          PY
