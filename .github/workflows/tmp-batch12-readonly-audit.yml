name: Temporary Batch 12 Read-Only Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-batch12-readonly-audit.yml'

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Load exact batch 12 request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/source
          gh issue view 1336 --repo "$GITHUB_REPOSITORY" --json body -q .body > results/request.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/request.json").read_text())
          assert r["batch_id"]=="batch-012"
          assert r["audit_only"] is True
          assert 1 <= len(r["audited_lead_ids"]) <= 100
          assert len(r["audited_lead_ids"]) == len(set(r["audited_lead_ids"]))
          print(f"REQUEST=green audited={len(r['audited_lead_ids'])} audit_only=true")
          PY

      - name: Download canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/11069173400/zip"             > results/source.zip
          unzip -q results/source.zip -d results/source
          test -f results/source/rewrite/11026955968/growth-batch.json

      - name: Audit official evidence read-only
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_content_remediation.py             --request results/request.json             --source-root results/source             --config config/growth-subscription.json             --report results/report.json             | tee results/audit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/report.json").read_text())
          if r.get("audit_only") is not True or r.get("read_only") is not True:
              raise SystemExit("not read-only")
          if int(r.get("final_exact_changed_count") or 0) != 0:
              raise SystemExit("read-only audit changed content")
          if r.get("automatic_send") is not False or r.get("send_capability") != "unavailable":
              raise SystemExit("send boundary changed")
          if int(r.get("unassessed_count") or 0) != 0:
              raise SystemExit("audit left unassessed leads")
          print("BATCH12_READONLY_AUDIT=green")
          print(json.dumps(r, ensure_ascii=False, separators=(",",":")))
          PY
