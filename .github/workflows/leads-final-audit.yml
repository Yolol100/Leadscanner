name: Leads Final Audit Only

on:
  workflow_dispatch:
    inputs:
      phase4_artifact_id:
        description: 'First verified-draft artifact ID'
        required: true
        type: string
      phase5_artifact_id:
        description: 'Second verified-draft artifact ID'
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

concurrency:
  group: leads-final-audit-only
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[growth-final-audit]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve final audit request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PHASE4: ${{ inputs.phase4_artifact_id }}
          INPUT_PHASE5: ${{ inputs.phase5_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "issues":
              event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
              try:
                  request = json.loads(event["issue"].get("body") or "{}")
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"issue body must be JSON: {exc}")
              raw_ids = request.get("artifact_ids")
              if raw_ids is None:
                  raw_ids = [
                      request.get("phase4_artifact_id"),
                      request.get("phase5_artifact_id"),
                  ]
              exclusions = request.get("exclude_lead_ids") or []
          else:
              raw_ids = [os.environ["INPUT_PHASE4"], os.environ["INPUT_PHASE5"]]
              exclusions = []

          artifact_ids = [int(value) for value in raw_ids if str(value or "").strip()]
          if not 1 <= len(artifact_ids) <= 10 or any(value <= 0 for value in artifact_ids):
              raise SystemExit("Provide 1-10 positive artifact IDs")
          if len(set(artifact_ids)) != len(artifact_ids):
              raise SystemExit("Artifact IDs must be distinct")

          lead_re = re.compile(r"^growth-[0-9a-f]{20}$")
          exclusions = [str(value).strip() for value in exclusions if str(value).strip()]
          if len(exclusions) > 10 or len(set(exclusions)) != len(exclusions):
              raise SystemExit("Excluded lead IDs must be unique and limited to 10")
          if any(not lead_re.fullmatch(value) for value in exclusions):
              raise SystemExit("Excluded lead IDs must be canonical growth IDs")

          Path("results/artifact-ids.txt").write_text(
              "".join(f"{value}\n" for value in artifact_ids),
              encoding="utf-8",
          )
          Path("results/excluded-lead-ids.txt").write_text(
              "".join(f"{value}\n" for value in exclusions),
              encoding="utf-8",
          )
          print(
              "FINAL_AUDIT_REQUEST=green "
              f"artifacts={len(artifact_ids)} exclusions={len(exclusions)}"
          )
          PY

      - name: Download verified-draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/source
          n=0
          while IFS= read -r artifact_id; do
            n=$((n + 1))
            mkdir -p "results/source/$n"
            gh api -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > "results/source/$n.zip"
            unzip -q "results/source/$n.zip" -d "results/source/$n"
            test -s "results/source/$n/growth-batch.json"
            test -s "results/source/$n/myhost-drafts.json"
          done < results/artifact-ids.txt
          echo "FINAL_ARTIFACT_READBACK=green count=$n"

      - name: Audit artifacts and current mijn.host mailbox read-only
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          args=()
          for dir in results/source/*/; do
            args+=(--batch "$dir/growth-batch.json" --report "$dir/myhost-drafts.json")
          done
          exclude_args=()
          while IFS= read -r lead_id; do
            if [ -n "$lead_id" ]; then
              exclude_args+=(--exclude-lead-id "$lead_id")
            fi
          done < results/excluded-lead-ids.txt
          PYTHONPATH=scripts python3 scripts/myhost_final_audit.py             "${args[@]}"             "${exclude_args[@]}"             --config config/growth-subscription.json             --output results/final-audit.json | tee results/final-audit.txt
          grep -q '^FINAL_LEADS_AUDIT=green ' results/final-audit.txt
          grep -q 'automatic_send=false' results/final-audit.txt
          grep -q 'smtp_send=not_available' results/final-audit.txt

      - name: Prove read-only boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/final-audit.json").read_text(encoding="utf-8"))
          if report.get("failure_count") != 0:
              raise SystemExit("final audit contains failures")
          requested = int(report.get("requested_total") or 0)
          if requested <= 0:
              raise SystemExit("final total must be positive")
          for key in ("artifact_rows", "unique_lead_ids", "unique_emails", "unique_domains", "unique_companies"):
              if report.get(key) != requested:
                  raise SystemExit(f"{key} does not equal canonical total")
          if report.get("final_set_current_expected") != requested:
              raise SystemExit("mailbox expected total mismatch")
          if report.get("final_set_current_exact_matches") != requested:
              raise SystemExit("current mailbox exact match is incomplete")
          if report.get("excluded_mailbox_absent") != report.get("excluded_mailbox_expected_absent"):
              raise SystemExit("excluded duplicate is still present")
          if report.get("automatic_send") is not False:
              raise SystemExit("automatic_send must be false")
          if report.get("smtp_send") != "not_available":
              raise SystemExit("SMTP/send must be unavailable")
          if report.get("read_only") is not True:
              raise SystemExit("mailbox audit must be read-only")
          print(
              "FINAL_READ_ONLY_BOUNDARY=green "
              f"total={requested} automatic_send=false smtp_send=not_available"
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-final-audit-${{ github.run_number }}
          path: |
            results/final-audit.json
            results/final-audit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove source artifact residue
        if: always()
        run: rm -rf results/source results/artifact-ids.txt results/excluded-lead-ids.txt
