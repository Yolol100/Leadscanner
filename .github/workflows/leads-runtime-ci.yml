name: Leads Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-discovery.txt
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt
      - run: python3 -m compileall -q scripts
      - env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove one-run Growth Subscription draft core
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-batch.yml
          test -f scripts/overture_discovery.py
          test -f scripts/hybrid_discovery.py
          test -f scripts/extract_public_contacts.py
          test -f scripts/prepare_growth_batch.py
          test -f scripts/myhost_draft.py
          grep -q 'issues:' .github/workflows/leads-batch.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-batch.yml
          grep -q -- '-email' .github/workflows/leads-batch.yml
          grep -q 'Create and exactly read back mijn.host concept' .github/workflows/leads-batch.yml
          grep -q '"min": 250' config/growth-subscription.json
          grep -q '"max": 500' config/growth-subscription.json
          grep -q 'discovery_email_candidates' scripts/overture_discovery.py
          grep -q 'discovery_email_candidates' scripts/hybrid_discovery.py
          grep -q 'review_required' scripts/extract_public_contacts.py
          grep -q 'Idee voor' scripts/prepare_growth_batch.py
          grep -q 'An idea for' scripts/prepare_growth_batch.py
          grep -q 'review_draft' scripts/prepare_growth_batch.py
          grep -q 'X-Webactueel-Review-Required' scripts/myhost_draft.py
          grep -q 'smtp_send.*not_available' scripts/myhost_draft.py
          ! test -e scripts/approve_growth_batch.py
          ! test -e tests/test_approve_growth_batch.py
          ! test -e .github/workflows/myhost-drafts.yml
          ! grep -R --line-number --include='*.py' -E 'smtplib|sendmail\(|SMTP\(' scripts
          ! grep -R --line-number --include='*.yml' -E 'smtp|SMTP' .github/workflows
          echo 'ONE_RUN_GROWTH_DRAFT_CORE=green'
