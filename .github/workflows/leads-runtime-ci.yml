name: Leads Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-discovery.txt
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt
      - run: python3 -m compileall -q scripts
      - env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove one-run Growth Subscription draft core
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-batch.yml
          test -f scripts/overture_discovery.py
          test -f scripts/hybrid_discovery.py
          test -f scripts/extract_public_contacts.py
          test -f scripts/prepare_growth_batch.py
          test -f scripts/apply_google_maps_email_fallback.py
          test -f scripts/myhost_draft.py
          grep -q 'issues:' .github/workflows/leads-batch.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-batch.yml
          grep -q 'Targeted Google Maps email fallback if needed' .github/workflows/leads-batch.yml
          grep -q 'google-maps-email-fallback-input' .github/workflows/leads-batch.yml
          grep -q -- '-email' .github/workflows/leads-batch.yml
          grep -q 'Create and exactly read back mijn.host concept' .github/workflows/leads-batch.yml
          grep -q 'MYHOST_REQUIRED_DRAFTS=green' .github/workflows/leads-batch.yml
          grep -q '"min": 250' config/growth-subscription.json
          grep -q '"max": 500' config/growth-subscription.json
          grep -q 'discovery_email_candidates' scripts/overture_discovery.py
          grep -q 'discovery_email_candidates' scripts/hybrid_discovery.py
          grep -q 'review_required' scripts/extract_public_contacts.py
          grep -q 'PLACEHOLDER_LOCAL_PARTS' scripts/extract_public_contacts.py
          grep -q 'email_fits_business_context' scripts/extract_public_contacts.py
          grep -q 'google_maps_targeted_fallback' scripts/apply_google_maps_email_fallback.py
          grep -q 'Idee voor' scripts/prepare_growth_batch.py
          grep -q 'An idea for' scripts/prepare_growth_batch.py
          grep -q 'review_draft' scripts/prepare_growth_batch.py
          grep -q 'X-Webactueel-Review-Required' scripts/myhost_draft.py
          grep -q 'smtp_send.*not_available' scripts/myhost_draft.py
          ! test -e scripts/approve_growth_batch.py
          ! test -e tests/test_approve_growth_batch.py
          ! test -e .github/workflows/myhost-drafts.yml
          ! grep -R --line-number --include='*.py' -E 'smtplib|sendmail\(|SMTP\(' scripts
          ! grep -R --line-number --include='*.yml' -E 'smtp|SMTP' .github/workflows
          echo 'ONE_RUN_GROWTH_DRAFT_CORE=green'

      - name: Prove bounded value-sentence remediation boundary
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-value-sentence-remediation.yml
          test -f scripts/myhost_value_sentence_remediation.py
          test -f tests/test_myhost_value_sentence_remediation.py
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-value-sentence-remediation.yml
          grep -F -q "startsWith(github.event.issue.title, '[growth-value-remediate]')" .github/workflows/leads-value-sentence-remediation.yml
          grep -q 'myhost_value_sentence_remediation.py' .github/workflows/leads-value-sentence-remediation.yml
          grep -q 'audit_artifact_id' .github/workflows/leads-value-sentence-remediation.yml
          grep -q 'review_required_preserved' scripts/myhost_value_sentence_remediation.py
          grep -q 'automatic_send.*False' scripts/myhost_value_sentence_remediation.py
          grep -q 'MULTIAPPEND_SHARD_SIZE = 50' scripts/myhost_value_sentence_remediation.py
          grep -q 'replace_known_drafts_multiappend_and_verify' scripts/myhost_value_sentence_remediation.py
          grep -q 'multiappend_used' .github/workflows/leads-value-sentence-remediation.yml
          grep -q 'IMAPClient' requirements.txt
          ! grep -E -q 'smtplib|sendmail\(|SMTP\(' scripts/myhost_value_sentence_remediation.py
          ! grep -E -q 'client\.expunge\(|client\.store\(' scripts/myhost_value_sentence_remediation.py
          echo 'VALUE_SENTENCE_REMEDIATION_BOUNDARY=green'

      - name: Prove isolated discovery-only phase boundary
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-discovery.yml
          test -f scripts/filter_discovery_candidates.py
          test -f tests/test_filter_discovery_candidates.py
          grep -q 'workflow_dispatch:' .github/workflows/leads-discovery.yml
          grep -q 'issues:' .github/workflows/leads-discovery.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-discovery.yml
          grep -F -q "startsWith(github.event.issue.title, '[lead-discovery]')" .github/workflows/leads-discovery.yml
          grep -q 'scripts/overture_discovery.py' .github/workflows/leads-discovery.yml
          grep -q 'scripts/hybrid_discovery.py' .github/workflows/leads-discovery.yml
          grep -q 'scripts/filter_discovery_candidates.py' .github/workflows/leads-discovery.yml
          grep -q 'results/phase2-discovery.json' .github/workflows/leads-discovery.yml
          grep -q 'DISCOVERY_ONLY_BOUNDARY=green' .github/workflows/leads-discovery.yml
          grep -q 'permissions:' .github/workflows/leads-discovery.yml
          grep -q 'contents: read' .github/workflows/leads-discovery.yml
          grep -q 'cancel-in-progress: true' .github/workflows/leads-discovery.yml
          ! grep -E -q 'extract_public_contacts\.py|prepare_growth_batch\.py|myhost_draft\.py|apply_google_maps_email_fallback\.py' .github/workflows/leads-discovery.yml
          ! grep -E -q 'OUTREACH_|secrets\.|review_draft|draft_limit|contact_check_limit|IMAP|SMTP|smtp' .github/workflows/leads-discovery.yml
          ! grep -q 'issues: write' .github/workflows/leads-discovery.yml
          echo 'DISCOVERY_ONLY_WORKFLOW=green'


      - name: Prove isolated verify-only phase boundary
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-verify.yml
          test -f scripts/select_verification_batch.py
          test -f scripts/build_verification_ready.py
          test -f tests/test_verify_only_workflow.py
          grep -q 'workflow_dispatch:' .github/workflows/leads-verify.yml
          grep -q 'issues:' .github/workflows/leads-verify.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-verify.yml
          grep -F -q "startsWith(github.event.issue.title, '[lead-verify]')" .github/workflows/leads-verify.yml
          grep -q 'scripts/select_verification_batch.py' .github/workflows/leads-verify.yml
          grep -q 'scripts/extract_public_contacts.py' .github/workflows/leads-verify.yml
          grep -q 'scripts/apply_google_maps_email_fallback.py' .github/workflows/leads-verify.yml
          grep -q 'scripts/build_verification_ready.py' .github/workflows/leads-verify.yml
          grep -q 'VERIFY_ONLY_BOUNDARY=green' .github/workflows/leads-verify.yml
          grep -q 'actions: read' .github/workflows/leads-verify.yml
          ! grep -E -q 'prepare_growth_batch\.py|myhost_draft\.py|review_draft|OUTREACH_|secrets\.|IMAP|SMTP|smtp' .github/workflows/leads-verify.yml
          ! grep -q 'issues: write' .github/workflows/leads-verify.yml
          echo 'VERIFY_ONLY_WORKFLOW=green'


      - name: Prove isolated verified-draft-only phase boundary
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-verified-drafts.yml
          test -f scripts/myhost_growth_inventory.py
          test -f scripts/build_verified_draft_input.py
          test -f tests/test_myhost_growth_inventory.py
          test -f tests/test_build_verified_draft_input.py
          grep -q 'workflow_dispatch:' .github/workflows/leads-verified-drafts.yml
          grep -q 'issues:' .github/workflows/leads-verified-drafts.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-verified-drafts.yml
          grep -F -q "startsWith(github.event.issue.title, '[growth-draft-verified]')" .github/workflows/leads-verified-drafts.yml
          grep -q 'scripts/myhost_growth_inventory.py' .github/workflows/leads-verified-drafts.yml
          grep -q 'scripts/build_verified_draft_input.py' .github/workflows/leads-verified-drafts.yml
          grep -q 'scripts/prepare_growth_batch.py' .github/workflows/leads-verified-drafts.yml
          grep -q 'scripts/myhost_draft.py' .github/workflows/leads-verified-drafts.yml
          grep -q 'PHASE4_EXACT_READBACK=green' .github/workflows/leads-verified-drafts.yml
          grep -q 'created_count' .github/workflows/leads-verified-drafts.yml
          grep -q 'review_status' .github/workflows/leads-verified-drafts.yml
          grep -q 'actions: read' .github/workflows/leads-verified-drafts.yml
          ! grep -E -q 'overture_discovery\.py|hybrid_discovery\.py|extract_public_contacts\.py|apply_google_maps_email_fallback\.py' .github/workflows/leads-verified-drafts.yml
          ! grep -E -q 'smtplib|sendmail\(|SMTP\(' .github/workflows/leads-verified-drafts.yml
          ! grep -q 'issues: write' .github/workflows/leads-verified-drafts.yml
          echo 'VERIFIED_DRAFT_ONLY_WORKFLOW=green'


      - name: Prove isolated final-audit-only boundary
        run: |
          set -euo pipefail
          test -f .github/workflows/leads-final-audit.yml
          test -f scripts/myhost_final_audit.py
          test -f tests/test_myhost_final_audit.py
          grep -q 'workflow_dispatch:' .github/workflows/leads-final-audit.yml
          grep -q 'issues:' .github/workflows/leads-final-audit.yml
          grep -q "github.event.issue.user.login == github.repository_owner" .github/workflows/leads-final-audit.yml
          grep -F -q "startsWith(github.event.issue.title, '[growth-final-audit]')" .github/workflows/leads-final-audit.yml
          grep -q 'scripts/myhost_final_audit.py' .github/workflows/leads-final-audit.yml
          grep -q 'FINAL_LEADS_AUDIT=green' .github/workflows/leads-final-audit.yml
          grep -q 'FINAL_READ_ONLY_BOUNDARY=green' .github/workflows/leads-final-audit.yml
          grep -q 'actions: read' .github/workflows/leads-final-audit.yml
          ! grep -E -q 'prepare_growth_batch\.py|myhost_draft\.py|create_drafts\(' .github/workflows/leads-final-audit.yml
          ! grep -E -q 'client\.append|client\.store|client\.expunge|smtplib|sendmail\(|SMTP\(' scripts/myhost_final_audit.py
          ! grep -q 'issues: write' .github/workflows/leads-final-audit.yml
          echo 'FINAL_AUDIT_ONLY_WORKFLOW=green'
