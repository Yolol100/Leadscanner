name: Leads Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - run: python3 -m compileall -q scripts
      - env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove draft-only core
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.py' -E 'smtplib|sendmail\(|SMTP\(' scripts
          grep -q 'IMAP_DRAFT_ONLY' scripts/sync_selected_drafts.py
          ! grep -E 'load_private_postal_address|postal_address' scripts/sync_selected_drafts.py scripts/myhost_draft.py
          grep -q 'workflow_dispatch:' .github/workflows/sync-selected-myhost-drafts-command.yml
          ! grep -q '^  issues:' .github/workflows/sync-selected-myhost-drafts-command.yml
          ! grep -q 'issues: write' .github/workflows/sync-selected-myhost-drafts-command.yml
          grep -q '^  create:' .github/workflows/runtime-myhost-request.yml
          ! grep -q 'OUTREACH_MAIL_PASSWORD' .github/workflows/runtime-myhost-request.yml
          grep -q '^  workflow_run:' .github/workflows/runtime-myhost-draft.yml
          grep -q 'ref: .*default_branch' .github/workflows/runtime-myhost-draft.yml
          grep -q 'smtp_send=not_available' .github/workflows/runtime-myhost-draft.yml
          grep -q 'runtime/myhost-draft/' scripts/runtime_branch.py
          echo 'DRAFT_ONLY_CORE=green'
