name: Leads Runtime CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'tests/**/*.py'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-outreach.txt'
      - 'README.md'
      - 'AGENTS.md'
      - 'LEADS-INTEGRATION.md'
      - 'INSTANTLY-INTEGRATION.md'
      - 'tool-registry.json'
      - 'toolkit-contract.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'tests/**/*.py'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-outreach.txt'
      - 'README.md'
      - 'AGENTS.md'
      - 'LEADS-INTEGRATION.md'
      - 'INSTANTLY-INTEGRATION.md'
      - 'tool-registry.json'
      - 'toolkit-contract.json'

permissions:
  contents: read

jobs:
  leads-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node regressions
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated Python dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Verify Python dependency consistency
        run: python3 -m pip check

      - name: Audit Python runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
          python3 -m pip_audit --requirement requirements-outreach.txt

      - name: Compile Leads Python runtime
        run: python3 -m compileall -q scripts

      - name: Run migrated Leads tests
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Assert CI safe mode
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OUTREACH_MAIL_PASSWORD:-}"
          test -z "${OUTREACH_MAILBOXES_JSON:-}"
          test -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${OUTREACH_DRAFT_CONFIRM:-}"
          test -z "${INSTANTLY_API_KEY:-}"
          echo "CI_SAFE_MODE=green"
