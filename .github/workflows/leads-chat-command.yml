name: Leadscanner ChatGPT on-demand (private, no mail)

on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read

jobs:
  execute:
    # GitHub issue_comment workflows run from the default branch only.
    # Never run private credential steps for PRs, third-party users or issues.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1720 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Yolol100' &&
      (startsWith(github.event.comment.body, 'LEADS_CHAT_V1:') ||
       startsWith(github.event.comment.body, 'LEADS_CHAT_V2:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    concurrency:
      group: leads-chat-command
      cancel-in-progress: false
      # Retain every distinct owner-authorized V2 request. Without queue:max,
      # a third waiting comment supersedes the second pending request.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt -r requirements-draft.txt
      - run: python3 -m compileall -q scripts
      - name: Execute one owner-authorized, fixed, safe on-demand Leadscanner operation
        if: github.event.comment.body != 'LEADS_CHAT_V1:DRAFTS_AUDIT'
        env:
          PYTHONPATH: scripts
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/leads_chat_command.py
      - name: Read-only Mijn.Host Drafts inventory without any mailbox writes
        if: github.event.comment.body == 'LEADS_CHAT_V1:DRAFTS_AUDIT'
        env:
          PYTHONPATH: scripts
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/leads_chat_command.py
