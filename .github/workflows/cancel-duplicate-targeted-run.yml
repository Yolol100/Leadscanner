name: Cancel Duplicate Targeted Draft Run

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/cancel-duplicate-targeted-run.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued duplicate run only
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: '34411632835'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          status="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${DUPLICATE_RUN_ID}" | jq -r '.status')"
          if [ "$status" = 'completed' ]; then
            echo "DUPLICATE_ALREADY_COMPLETED=${DUPLICATE_RUN_ID}"
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "${headers[@]}" "${api}/actions/runs/${DUPLICATE_RUN_ID}/cancel" >/dev/null
          echo "DUPLICATE_CANCEL_REQUESTED=${DUPLICATE_RUN_ID} prior_status=${status}"
