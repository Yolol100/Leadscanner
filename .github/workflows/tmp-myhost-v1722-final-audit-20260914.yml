name: Temporary my.host V17.2.2 Final Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tmp-myhost-v1722-final-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'FINAL AUDIT MYHOST V17.2.2 COPY' &&
      contains(github.event.issue.body, 'COMMAND=FINAL_AUDIT_MYHOST_V1722_COPY')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Load private outreach config
        env:
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_private_config.py

      - name: Audit mailbox read-only
        id: audit
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: '100'
          OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee final-audit.txt
          import imaplib, os, ssl, sys
          from collections import Counter
          sys.path.insert(0, 'scripts')
          from outreach_copy_v17_2 import initial_copy_errors
          from outreach_imap_draft import choose_mailbox, detect_drafts_folder
          from outreach_mailboxes import enabled_mailboxes, load_mailboxes_from_env
          from outreach_queue_imap_draft import QUEUE_SHEET, build_sheets_service, get_values, inject_private_postal_for_draft, rows_from_values
          from outreach_queue_imap_draft_sync import _fetch_payload, _normalize_email, _normalize_text, _plain_body, _snapshot_from_header, _uid_search

          service = build_sheets_service()
          rows = rows_from_values(get_values(service, os.environ['OUTREACH_SPREADSHEET_ID'], QUEUE_SHEET))
          mailboxes = enabled_mailboxes(load_mailboxes_from_env(mode='validate', default_daily_limit=100))
          mailbox = choose_mailbox(mailboxes, os.getenv('OUTREACH_DRAFT_MAILBOX_ID', ''))
          if not mailbox.mail_password:
              raise RuntimeError('OUTREACH_MAIL_PASSWORD is required')
          sender = _normalize_email(mailbox.sender_email)
          by_recipient = {}
          for idx, row in enumerate(rows, start=2):
              email = _normalize_email(row.get('email', ''))
              row_sender = _normalize_email(row.get('sender_email', ''))
              if not email or (row_sender and row_sender != sender):
                  continue
              item = dict(row)
              item['_row'] = idx
              by_recipient.setdefault(email, []).append(item)

          context = ssl.create_default_context()
          imap = imaplib.IMAP4_SSL(mailbox.imap_host, mailbox.imap_port, ssl_context=context)
          entries = []
          try:
              status, _ = imap.login(mailbox.mail_user, mailbox.mail_password)
              if status != 'OK':
                  raise RuntimeError('IMAP authentication failed')
              status, folders = imap.list()
              if status != 'OK':
                  raise RuntimeError('IMAP LIST failed')
              folder = detect_drafts_folder(folders or (), explicit_folder=os.getenv('OUTREACH_DRAFT_FOLDER', ''))
              status, _ = imap.select(folder, readonly=True)
              if status != 'OK':
                  raise RuntimeError(f'failed to select Drafts folder read-only: {folder}')
              query = '(BODY.PEEK[HEADER.FIELDS (FROM TO SUBJECT X-Webactueel-Draft-Test-ID X-Webactueel-Transport)])'
              for uid in _uid_search(imap, 'ALL'):
                  snap = _snapshot_from_header(uid, _fetch_payload(imap, uid, query))
                  if snap.sender != sender:
                      continue
                  recipient_candidates = {}
                  subject_candidates = {}
                  for recipient in snap.recipients:
                      for row in by_recipient.get(recipient, []):
                          lead_id = (row.get('lead_id') or '').strip()
                          if not lead_id:
                              continue
                          recipient_candidates[lead_id] = row
                          if (row.get('subject') or '').strip() == snap.subject:
                              subject_candidates[lead_id] = row
                  chosen = subject_candidates if subject_candidates else recipient_candidates
                  selected = next(iter(chosen.values())) if len(chosen) == 1 else None
                  entry = {'candidate_count': len(chosen), 'lead_id': ''}
                  if selected:
                      lead_id = (selected.get('lead_id') or '').strip()
                      _, actual_body = _plain_body(_fetch_payload(imap, uid, '(BODY.PEEK[])'))
                      expected_body = inject_private_postal_for_draft(selected, (selected.get('body') or '').strip())
                      subject_match = (selected.get('subject') or '').strip() == snap.subject
                      body_match = _normalize_text(expected_body) == _normalize_text(actual_body)
                      errors = initial_copy_errors((selected.get('subject') or '').strip(), (selected.get('body') or '').strip())
                      status_value = (selected.get('status') or '').strip().lower()
                      last_error = (selected.get('last_error') or '').strip().lower()
                      bounced = status_value == 'bounced' or 'delivery status notification' in last_error
                      entry.update({
                          'lead_id': lead_id,
                          'bounced': bounced,
                          'subject_match': subject_match,
                          'body_match': body_match,
                          'copy_pass': not errors,
                      })
                  entries.append(entry)
          finally:
              try: imap.logout()
              except Exception: pass

          mapped = [x['lead_id'] for x in entries if x['lead_id']]
          lead_counts = Counter(mapped)
          active = [x for x in entries if x['lead_id'] and not x.get('bounced')]
          bounced = [x for x in entries if x.get('bounced')]
          counts = {
              'sender_drafts': len(entries),
              'mapped_one': sum(x['candidate_count'] == 1 for x in entries),
              'ambiguous': sum(x['candidate_count'] > 1 for x in entries),
              'orphan': sum(x['candidate_count'] == 0 for x in entries),
              'active_target': len(active),
              'active_pass': sum(x.get('copy_pass') and x.get('subject_match') and x.get('body_match') for x in active),
              'active_fail': sum(not (x.get('copy_pass') and x.get('subject_match') and x.get('body_match')) for x in active),
              'bounced_excluded': len(bounced),
              'duplicate_drafts': sum(v - 1 for v in lead_counts.values() if v > 1),
              'active_queue_match': sum(x.get('subject_match') and x.get('body_match') for x in active),
              'active_queue_mismatch': sum(not (x.get('subject_match') and x.get('body_match')) for x in active),
              'stale_drafts': sum(not x.get('body_match') for x in active),
          }
          green = (
              counts['sender_drafts'] == 101 and counts['mapped_one'] == 101 and counts['ambiguous'] == 0 and counts['orphan'] == 0 and
              counts['active_target'] == 98 and counts['active_pass'] == 98 and counts['active_fail'] == 0 and counts['bounced_excluded'] == 3 and
              counts['duplicate_drafts'] == 0 and counts['active_queue_match'] == 98 and counts['active_queue_mismatch'] == 0 and counts['stale_drafts'] == 0
          )
          detail = ' '.join(f'{k}={v}' for k, v in counts.items())
          print(('MYHOST_V1722_FINAL_AUDIT=green ' if green else 'MYHOST_V1722_FINAL_AUDIT=blocked ') + detail + ' smtp_send=not_invoked')
          if not green:
              raise SystemExit(2)
          PY

      - name: Report counts only and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          detail="$(tail -n 1 final-audit.txt 2>/dev/null || echo 'MYHOST_V1722_FINAL_AUDIT=blocked audit_output_missing smtp_send=not_invoked')"
          body="AUDIT_OUTCOME=${AUDIT_OUTCOME}\n${detail}\nTRANSPORT=IMAP_READ_ONLY\nSMTP_SEND=not_invoked"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed",state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error -X PATCH -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" -d "$close_payload" >/dev/null

      - name: Fail closed unless exact parity is green
        if: steps.audit.outcome != 'success'
        run: |
          echo 'Final mailbox audit did not complete exactly.' >&2
          echo 'SMTP_SEND=not_invoked'
          exit 1
