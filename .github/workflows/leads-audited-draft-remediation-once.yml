name: Leads One-Shot Audited Draft Remediation
# The target list, source artifact, and fact overrides are audited below before any mailbox write.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/leads-audited-draft-remediation-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: leads-audited-draft-remediation-once
  cancel-in-progress: false

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'Run one-shot audited draft remediation')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt

      - name: Download successful audited source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/source results/rewrite
          source_artifact_id=11069173400
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$source_artifact_id" \
            > results/source/artifact-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("results/source/artifact-metadata.json").read_text(encoding="utf-8"))
          if artifact.get("id") != 11069173400:
              raise SystemExit("audited source artifact ID mismatch")
          if artifact.get("name") != "audited-draft-remediation-2":
              raise SystemExit(f"unexpected audited source artifact name: {artifact.get('name')}")
          if artifact.get("expired") is not False:
              raise SystemExit("audited source artifact is expired or missing expiry state")
          if (artifact.get("workflow_run") or {}).get("id") != 36645646301:
              raise SystemExit("audited source artifact run mismatch")
          PY
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$source_artifact_id/zip" \
            > results/source/audited-source.zip
          unzip -q results/source/audited-source.zip -d results/source
          for artifact_id in             11009012767 11013906065 11013926537 11014736981 11014722896 11021895322 11022648826 11023991566 11024151826 11025033182 11025636561 11026955968
          do
            test -s "results/source/rewrite/$artifact_id/growth-batch.json"
            test -s "results/source/rewrite/$artifact_id/myhost-drafts.json"
          done
          echo "SOURCE_ARTIFACT=green id=$source_artifact_id run_id=36645646301 target_batches=12"

      - name: Preflight all audited replacement copy before mailbox writes
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from prepare_growth_batch import (
              build_opening,
              build_template,
              clean_company,
              observation_is_low_signal,
              short_company_name,
              stable_lead_id,
              subject_for_company,
              subject_label_for_company,
              write_csv,
          )

          artifact_ids = [
              11009012767,11013906065,11013926537,11014736981,
              11014722896,11021895322,11022648826,11023991566,
              11024151826,11025033182,11025636561,11026955968,
          ]
          target_lead_ids = {
              "growth-0ce85322cbce0efc3227",
              "growth-d51cba8849640a5cc714",
              "growth-83c374cdc3846ad9fe79",
              "growth-3aaf767223065c8aef60",
              "growth-7b6ca7bc872760f3e386",
              "growth-78f54d9aa278297c0350",
              "growth-7e3b5a98e11ced30a64a",
              "growth-08fd403f7353c0f1ba9b",
              "growth-ee46b2a22bdf51e316ac",
              "growth-646e15113e45e5087692",
              "growth-5ec7d416deb8c1d2c5e8",
              "growth-717cbbcc9fec92c5ac0f",
              "growth-566dd28f5316f406183c",
              "growth-75fcd17e41e610b20a50",
              "growth-a8a12bdffc53fffe2aee",
              "growth-5798922de3efe210c99f",
              "growth-8cbc335dd8cd08bb5b16",
              "growth-bf178223dabeb3be7b2f",
              "growth-d89de3e363388788c054",
              "growth-fdd74d151ebc5eea8ba4",
              "growth-ca90dcb6eea97b76d1af",
              "growth-075df3b6b11a3ab8b652",
              "growth-cc28486426a88d573f16",
              "growth-03ef018b33dba6afb445",
              "growth-d891390a45c1c6d47603",
              "growth-a40dbd990fd6614309a6",
          }
          observation_overrides = {
              "growth-78f54d9aa278297c0350": {
                  "observation": "Bij Hoogenboom kun je nieuwe auto's en occasions kopen, leasen of huren.",
                  "source_url": "https://www.autohoogenboom.nl/",
                  "source_type": "official_site",
              },
              "growth-fdd74d151ebc5eea8ba4": {
                  "observation": "Restaurant De Orchidee in Eindhoven serveert Aziatische gerechten.",
                  "source_url": "https://bestellen.restaurantdeorchidee.nl/",
                  "source_type": "official_site",
              },
              "growth-3aaf767223065c8aef60": {
                  "observation": "Het Goed in Geldrop is een warenhuis met een gevarieerd aanbod tweedehands spullen.",
                  "source_url": "https://www.hetgoed.nl/vestigingen/geldrop/",
                  "source_type": "official_site",
              },
              "growth-cc28486426a88d573f16": {
                  "observation": "Het bijna 400 jaar oude monumentale Goudkantoor is een café-restaurant met koffie, lunch en diner.",
                  "source_url": "https://www.goudkantoor.nl/",
                  "source_type": "official_site",
              },
              "growth-7b6ca7bc872760f3e386": {
                  "observation": "Bij Hoogvliet kunnen klanten boodschappen online bestellen en thuis laten bezorgen of ophalen in de winkel.",
                  "source_url": "https://www.hoogvliet.com/online-bestellen",
                  "source_type": "official_site",
              },
              "growth-a40dbd990fd6614309a6": {
                  "observation": "Camping Ganspoort biedt vier vergaderruimtes voor groepen van 1 tot 50 personen.",
                  "source_url": "https://www.campingganspoort.nl/nl/vergaderen/",
                  "source_type": "official_site",
              },
              "growth-ca90dcb6eea97b76d1af": {
                  "observation": "Plato is een Grieks specialiteitenrestaurant met klassiekers zoals souvlaki en gyros.",
                  "source_url": "https://grieksrestaurantplato.nl/over-ons/",
                  "source_type": "official_site",
              },
              "growth-5ec7d416deb8c1d2c5e8": {
                  "observation": "De winkel heeft een uitgebreid assortiment voor honden, katten, knaagdieren, vogels, aquaria, reptielen en hengelsport.",
                  "source_url": "https://pierrebeelen.wordpress.com/",
                  "source_type": "official_site",
              },
              "growth-d891390a45c1c6d47603": {
                  "observation": "Slagerij Reinders biedt onder meer Heydehoeve-varkensvlees, huisgemaakte vleeswaren en worstenbroodjes.",
                  "source_url": "https://slagerijreinders.nl/",
                  "source_type": "official_site",
              },
              "growth-d89de3e363388788c054": {
                  "observation": "Woonzorglocatie Bloemhof in Ten Boer.",
                  "source_url": "https://www.zorggroepgroningen.nl/locaties/bloemhof",
                  "source_type": "official_site",
              },
              "growth-075df3b6b11a3ab8b652": {
                  "observation": "Primera Kosterman verkoopt online Staatsloten.",
                  "source_url": "https://geluksmakelaar.nl/staatsloterij/",
                  "source_type": "official_site",
              },
              "growth-d51cba8849640a5cc714": {
                  "observation": "Søstrene Grene verkoopt woondecoratie en accessoires voor thuis.",
                  "source_url": "https://sostrenegrene.com/nl/producten/wonen/interieur-c-8312",
                  "source_type": "official_site",
              },
          }
          price = json.loads(Path("config/growth-subscription.json").read_text(encoding="utf-8"))["monthly_price_eur"]
          price_min, price_max = int(price["min"]), int(price["max"])
          global_rows = []
          baseline_rows = []
          language_split = Counter()

          for artifact_id in artifact_ids:
              source_dir = Path(f"results/source/rewrite/{artifact_id}")
              old_batch = json.loads((source_dir / "growth-batch.json").read_text(encoding="utf-8"))
              previous_report = json.loads((source_dir / "myhost-drafts.json").read_text(encoding="utf-8"))
              previous_items = {
                  str(item.get("lead_id") or ""): item
                  for item in (previous_report.get("items") or [])
              }
              selected = []
              for old in old_batch.get("rows") or []:
                  if old.get("status") != "review_draft":
                      continue
                  lead_id = str(old.get("lead_id") or "")
                  if lead_id not in target_lead_ids:
                      continue
                  if lead_id != stable_lead_id(str(old.get("email") or ""), str(old.get("website") or "")):
                      raise SystemExit(f"{lead_id}: source lead ID does not match its email and website")
                  source_item = previous_items.get(lead_id)
                  if (
                      not source_item
                      or source_item.get("outcome") not in {"existing", "replaced"}
                      or source_item.get("to") != old.get("email")
                      or source_item.get("subject") != old.get("subject")
                      or source_item.get("body") != old.get("body")
                  ):
                      raise SystemExit(f"{lead_id}: successful source readback does not match the audited row")
                  baseline_rows.append({
                      key: old.get(key)
                      for key in ("lead_id", "email", "subject", "body", "status", "contact_basis_status")
                  })
                  row = dict(old)
                  override = observation_overrides.get(lead_id)
                  if override:
                      row["verified_observation"] = override["observation"]
                      row["verified_observation_source_url"] = override["source_url"]
                      row["verified_observation_source_type"] = override["source_type"]
                  if row.get("contact_basis_status") != "review_required":
                      raise SystemExit(f"{lead_id}: contact basis is not review_required")
                  if row.get("verified_observation_source_type") != "official_site":
                      raise SystemExit(f"{lead_id}: official-site observation provenance missing")
                  if not str(row.get("verified_observation") or "").strip():
                      raise SystemExit(f"{lead_id}: verified observation missing")
                  if not str(row.get("verified_observation_source_url") or "").startswith(("http://", "https://")):
                      raise SystemExit(f"{lead_id}: verified observation URL missing")
                  language = str(row.get("language") or "").casefold()
                  if language not in {"nl","en"}:
                      raise SystemExit(f"{lead_id}: unsupported language={language}")
                  category_hint = str(row.get("category_hint") or "").strip()
                  if not category_hint:
                      raise SystemExit(f"{lead_id}: category_hint missing")
                  company = clean_company(row.get("company"), language)
                  row["category_hint"] = category_hint
                  row["copy_company_label"] = short_company_name(company)
                  row["copy_subject_label"] = subject_label_for_company(company, language)
                  row["subject"] = subject_for_company(company, language)
                  row["body"] = build_template(
                      company,
                      language,
                      str(row.get("verified_observation") or ""),
                      price_min=price_min,
                      price_max=price_max,
                      category_hint=category_hint,
                  )
                  row["status"] = "review_draft"

                  body = row["body"]
                  subject = row["subject"]
                  opening = build_opening(company, language, row["verified_observation"], category_hint)
                  if opening not in body or row["verified_observation"] not in opening:
                      raise SystemExit(f"{lead_id}: opening does not use the verified official-site fact")
                  if observation_is_low_signal(company, row["verified_observation"]):
                      raise SystemExit(f"{lead_id}: opening fact is too weak for outreach")
                  bullets = [line for line in body.splitlines() if line.startswith("• ")]
                  if len(bullets) != 6:
                      raise SystemExit(f"{lead_id}: bullet count={len(bullets)}")
                  if body.count("€250–€500") != 1 or re.search(r"\b\d+\s*%", body):
                      raise SystemExit(f"{lead_id}: price/percentage boundary failed")
                  if not 2 <= len(subject.split()) <= 6:
                      raise SystemExit(f"{lead_id}: subject word count invalid")
                  if len(body.split()) > 115:
                      raise SystemExit(f"{lead_id}: body word count exceeds 115")
                  if any(ord(ch) > 0xFFFF for ch in subject):
                      raise SystemExit(f"{lead_id}: decorative symbol survived subject")
                  if "Ik heb de website van " in body or ("I looked through " in body and "'s website." in body):
                      raise SystemExit(f"{lead_id}: generic opening survived")
                  if language == "nl":
                      required = (
                          "Website/webshop — verbeteren of nieuw maken waar nodig",
                          "Zoekbaarheid — beter vindbaar worden",
                          "Social content — passende content",
                          "Automatisering — geschikte processen deels automatiseren waar haalbaar",
                          "Hosting — beheren of overnemen waar passend",
                          "Ik als vast contactpersoon",
                          "€250–€500 per maand, afhankelijk van wat jullie nodig hebben",
                          "Zal ik vrijblijvend een voorbeeld design maken voor ",
                          "Geen interesse? Laat het gerust weten.",
                          "Groet,\nAndrew",
                      )
                  else:
                      required = (
                          "Website/webshop — improve or build new where needed",
                          "Search visibility — improve findability",
                          "Social content — relevant content",
                          "Automation — partially automate suitable processes where feasible",
                          "Hosting — manage or take over where appropriate",
                          "Me as your fixed point of contact",
                          "€250–€500 per month, depending on what you need",
                          "Would you like me to make a no-obligation example design for ",
                          "Not interested? Just let me know.",
                          "Regards,\nAndrew",
                      )
                  for value in required:
                      if value not in body:
                          raise SystemExit(f"{lead_id}: audited copy contract missing {value!r}")
                  if language == "nl" and "Dan kunnen jullie eerst bekijken of de richting interessant is." not in body:
                      raise SystemExit(f"{lead_id}: NL CTA wording mismatch")
                  if language == "en" and "so you can first see whether the direction is relevant?" not in body:
                      raise SystemExit(f"{lead_id}: EN CTA wording mismatch")
                  if row["copy_company_label"] not in body or row["copy_subject_label"] not in subject:
                      raise SystemExit(f"{lead_id}: company personalization missing")
                  language_split[language] += 1
                  selected.append(row)
                  global_rows.append(row)

              if not selected:
                  continue
              out_dir = Path(f"results/rewrite/{artifact_id}")
              out_dir.mkdir(parents=True, exist_ok=True)
              payload = {
                  "schema_version": "webactueel-growth-batch/4.3-audited-rewrite",
                  "product": old_batch.get("product"),
                  "row_count": len(selected),
                  "excluded_competitor_count": 0,
                  "email_found_count": len(selected),
                  "draft_candidate_count": len(selected),
                  "review_draft_count": len(selected),
                  "rows": selected,
                  "safety": {
                      "one_product": True,
                      "six_benefits": True,
                      "language_matched_copy": True,
                      "verified_official_site_observation_required": True,
                      "personalized_company_opening": True,
                      "contact_basis_review_required_before_send": True,
                      "review_draft_storage_allowed": True,
                      "automatic_send": False,
                      "same_lead_ids_rewrite_only": True,
                  },
              }
              (out_dir / "growth-batch.json").write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
              )
              write_csv(payload, out_dir / "growth-batch.csv")

          seen_lead_ids = [str(row.get("lead_id") or "") for row in global_rows]
          if len(seen_lead_ids) != len(target_lead_ids) or set(seen_lead_ids) != target_lead_ids:
              missing = sorted(target_lead_ids - set(seen_lead_ids))
              extra = sorted(set(seen_lead_ids) - target_lead_ids)
              raise SystemExit(f"target set mismatch missing={missing} extra={extra}")
          if dict(language_split) != {"nl": 26}:
              raise SystemExit(f"unexpected target language split: {dict(language_split)}")
          for key in ("lead_id","email","official_domain_hint"):
              values = [str(row.get(key) or "").strip().casefold() for row in global_rows]
              dupes = [value for value,count in Counter(values).items() if value and count > 1]
              if dupes:
                  raise SystemExit(f"global duplicate {key}: {dupes[:10]}")
          summary = {
              "canonical_count": len(global_rows),
              "language_split": dict(language_split),
              "automatic_send": False,
              "smtp_send": "not_available",
          }
          Path("results/preflight-summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          Path("results/target-baseline.json").write_text(
              json.dumps(baseline_rows, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(
              "AUDITED_COPY_PREFLIGHT=green "
              f"count={len(global_rows)} nl={language_split['nl']} en={language_split.get('en', 0)} "
              "duplicates=0 generic_openings=0 automatic_send=false smtp_send=not_available"
          )
          PY

      - name: Verify existing target drafts before mailbox changes
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from myhost_draft import (
              build_message,
              connect_imap,
              fetch_message,
              find_drafts_folder,
              find_message_ids,
              normalize_text,
              select_folder,
          )

          expected_rows = json.loads(
              Path("results/target-baseline.json").read_text(encoding="utf-8")
          )
          if len(expected_rows) != 26:
              raise SystemExit(f"expected 26 existing-draft baselines, found {len(expected_rows)}")

          client = connect_imap()
          try:
              folder = find_drafts_folder(client)
              select_folder(client, folder, readonly=True)
              for row in expected_rows:
                  lead_id, expected = build_message(row)
                  message_ids = find_message_ids(client, folder, lead_id, ensure_selected=False)
                  if len(message_ids) != 1:
                      raise SystemExit(
                          f"{lead_id}: expected exactly one existing draft, found {len(message_ids)}"
                      )
                  actual = fetch_message(client, message_ids[0])
                  if actual.get("X-Webactueel-Lead-ID") != lead_id:
                      raise SystemExit(f"{lead_id}: existing draft identity mismatch")
                  if normalize_text(actual.get("To", "")) != normalize_text(expected.get("To", "")):
                      raise SystemExit(f"{lead_id}: existing draft recipient mismatch")
                  if normalize_text(actual.get("X-Webactueel-Review-Required", "")) != normalize_text(
                      expected.get("X-Webactueel-Review-Required", "")
                  ):
                      raise SystemExit(f"{lead_id}: existing draft review status mismatch")
              print(
                  "TARGET_DRAFT_PREFLIGHT=green count=26 existing=26 recipient_and_review_status=true "
                  "read_only=true automatic_send=false smtp_send=not_available"
              )
          finally:
              try:
                  client.logout()
              except Exception:
                  pass
          PY

      - name: Safely replace the 26 audited target drafts
        run: |
          set -euo pipefail
          total=0
          replaced=0
          existing=0
          for artifact_id in             11009012767 11013906065 11013926537 11014736981 11014722896 11021895322 11022648826 11023991566 11024151826 11025033182 11025636561 11026955968
          do
            batch="results/rewrite/$artifact_id/growth-batch.json"
            count="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["review_draft_count"])' "$batch")"
            if [ "$count" -eq 0 ]; then
              continue
            fi
            PYTHONPATH=scripts python3 scripts/myhost_draft.py --rewrite-existing-only               --batch "$batch"               --report "results/rewrite/$artifact_id/myhost-drafts.json"               | tee "results/rewrite/$artifact_id/myhost-drafts.txt"
            grep -q '^MYHOST_DRAFT_SYNC=green ' "results/rewrite/$artifact_id/myhost-drafts.txt"
            grep -q 'smtp_send=not_available' "results/rewrite/$artifact_id/myhost-drafts.txt"
            grep -q 'rewrite_existing_only=true' "results/rewrite/$artifact_id/myhost-drafts.txt"
            read r e c <<<"$(python3 - "$artifact_id" <<'PY'
          import json,sys
          aid=sys.argv[1]
          p=json.load(open(f"results/rewrite/{aid}/myhost-drafts.json"))
          eligible=int(p.get("eligible_count") or 0)
          replaced=int(p.get("replaced_count") or 0)
          existing=int(p.get("existing_count") or 0)
          created=int(p.get("created_count") or 0)
          if created != 0:
              raise SystemExit(f"{aid}: created_count={created}, expected 0")
          if replaced + existing != eligible:
              raise SystemExit(f"{aid}: replaced+existing mismatch")
          if p.get("review_required_count") != eligible:
              raise SystemExit(f"{aid}: review_required mismatch")
          if p.get("smtp_send") != "not_available":
              raise SystemExit(f"{aid}: smtp_send boundary failed")
          rows=json.load(open(f"results/rewrite/{aid}/growth-batch.json"))
          by_id={r["lead_id"]:r for r in rows["rows"]}
          if len(p.get("items") or []) != eligible:
              raise SystemExit(f"{aid}: exact readback item count mismatch")
          for item in p.get("items") or []:
              row=by_id.get(item.get("lead_id"))
              if not row or item.get("outcome") not in {"existing","replaced"}:
                  raise SystemExit(f"{aid}: unexpected readback outcome")
              if item.get("to") != row.get("email") or item.get("subject") != row.get("subject") or item.get("body") != row.get("body"):
                  raise SystemExit(f"{aid}: exact To/subject/body mismatch")
              if item.get("review_status") != "contact-basis":
                  raise SystemExit(f"{aid}: review status mismatch")
          print(replaced, existing, eligible)
          PY
          )"
            replaced=$((replaced + r))
            existing=$((existing + e))
            total=$((total + c))
          done
          test "$total" -eq 26
          echo "AUDITED_REWRITE_READBACK=green total=$total replaced=$replaced existing=$existing created=0 review_required=$total automatic_send=false smtp_send=not_available"

      - name: Final read-only audit group A
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_final_audit.py             --batch results/rewrite/11009012767/growth-batch.json --report results/rewrite/11009012767/myhost-drafts.json             --batch results/rewrite/11013906065/growth-batch.json --report results/rewrite/11013906065/myhost-drafts.json             --batch results/rewrite/11013926537/growth-batch.json --report results/rewrite/11013926537/myhost-drafts.json             --batch results/rewrite/11014736981/growth-batch.json --report results/rewrite/11014736981/myhost-drafts.json             --batch results/rewrite/11014722896/growth-batch.json --report results/rewrite/11014722896/myhost-drafts.json             --config config/growth-subscription.json             --output results/final-audit-a.json             | tee results/final-audit-a.txt
          grep -q '^FINAL_LEADS_AUDIT=green ' results/final-audit-a.txt
          grep -q 'automatic_send=false' results/final-audit-a.txt
          grep -q 'smtp_send=not_available' results/final-audit-a.txt

      - name: Final read-only audit group B
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_final_audit.py             --batch results/rewrite/11021895322/growth-batch.json --report results/rewrite/11021895322/myhost-drafts.json             --batch results/rewrite/11022648826/growth-batch.json --report results/rewrite/11022648826/myhost-drafts.json             --batch results/rewrite/11023991566/growth-batch.json --report results/rewrite/11023991566/myhost-drafts.json             --batch results/rewrite/11024151826/growth-batch.json --report results/rewrite/11024151826/myhost-drafts.json             --batch results/rewrite/11025033182/growth-batch.json --report results/rewrite/11025033182/myhost-drafts.json             --batch results/rewrite/11025636561/growth-batch.json --report results/rewrite/11025636561/myhost-drafts.json             --batch results/rewrite/11026955968/growth-batch.json --report results/rewrite/11026955968/myhost-drafts.json             --config config/growth-subscription.json             --output results/final-audit-b.json             | tee results/final-audit-b.txt
          grep -q '^FINAL_LEADS_AUDIT=green ' results/final-audit-b.txt
          grep -q 'automatic_send=false' results/final-audit-b.txt
          grep -q 'smtp_send=not_available' results/final-audit-b.txt

      - name: Remove draft content from the shared audit artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for filename in ("results/final-audit-a.json", "results/final-audit-b.json"):
              path = Path(filename)
              report = json.loads(path.read_text(encoding="utf-8"))
              report.pop("sample_real_created_draft", None)
              path.write_text(
                  json.dumps(report, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audited-draft-remediation-${{ github.run_number }}
          path: |
            results/preflight-summary.json
            results/final-audit-a.json
            results/final-audit-a.txt
            results/final-audit-b.json
            results/final-audit-b.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove downloaded source residue
        if: always()
        run: rm -rf results/source results/source/*.zip

