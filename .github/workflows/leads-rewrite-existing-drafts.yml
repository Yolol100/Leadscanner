name: Leads Rewrite Existing Drafts

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Existing verified-draft artifact ID to rewrite'
        required: true
        type: string
      expected_count:
        description: 'Exact number of existing review drafts to replace (1-100)'
        required: true
        default: '75'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: leads-rewrite-existing-drafts
  cancel-in-progress: false

jobs:
  rewrite:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[growth-draft-rewrite]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve rewrite request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
          INPUT_EXPECTED: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "issues":
              event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
              try:
                  request = json.loads(event["issue"].get("body") or "{}")
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"issue body must be JSON: {exc}")
              artifact_id = int(request.get("artifact_id") or 0)
              expected = int(request.get("expected_count") or 75)
              exclude_lead_ids = request.get("exclude_lead_ids") or []
              observation_overrides = request.get("observation_overrides") or {}
          else:
              artifact_id = int(os.environ["INPUT_ARTIFACT_ID"] or 0)
              expected = int(os.environ["INPUT_EXPECTED"] or 75)
              exclude_lead_ids = []
              observation_overrides = {}

          if not isinstance(exclude_lead_ids, list) or not all(isinstance(x, str) for x in exclude_lead_ids):
              raise SystemExit("exclude_lead_ids must be a string list")
          if not isinstance(observation_overrides, dict):
              raise SystemExit("observation_overrides must be an object")
          if artifact_id <= 0:
              raise SystemExit("artifact_id must be positive")
          if not 1 <= expected <= 100:
              raise SystemExit("expected_count must be 1-100")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"artifact_id={artifact_id}\n")
              out.write(f"expected={expected}\n")
              out.write("exclude_json=" + json.dumps(exclude_lead_ids, separators=(",", ":")) + "\n")
              out.write("override_json=" + json.dumps(observation_overrides, ensure_ascii=False, separators=(",", ":")) + "\n")
          print(f"REWRITE_REQUEST=green artifact_id={artifact_id} expected={expected} excluded={len(exclude_lead_ids)} overrides={len(observation_overrides)}")
          PY

      - name: Download existing verified-draft artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p results/source
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > results/source.zip
          unzip -q results/source.zip -d results/source
          test -s results/source/verified-draft-input.json
          test -s results/source/growth-batch.json
          echo "REWRITE_SOURCE_READBACK=green"

      - name: Rebuild personalized copy for same leads
        env:
          EXPECTED: ${{ steps.request.outputs.expected }}
          EXCLUDE_JSON: ${{ steps.request.outputs.exclude_json }}
          OVERRIDE_JSON: ${{ steps.request.outputs.override_json }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from prepare_growth_batch import (
              build_template,
              clean_company,
              short_company_name,
              subject_for_company,
              subject_label_for_company,
              write_csv,
          )

          expected = int(os.environ["EXPECTED"])
          excluded = set(json.loads(os.environ.get("EXCLUDE_JSON") or "[]"))
          overrides = json.loads(os.environ.get("OVERRIDE_JSON") or "{}")
          old_batch = json.loads(Path("results/source/growth-batch.json").read_text(encoding="utf-8"))
          verified_input = json.loads(Path("results/source/verified-draft-input.json").read_text(encoding="utf-8"))
          verified_candidates = verified_input.get("candidates") or []
          price = json.loads(Path("config/growth-subscription.json").read_text(encoding="utf-8"))["monthly_price_eur"]
          price_min, price_max = int(price["min"]), int(price["max"])
          selected = []
          seen = set()
          for old in old_batch.get("rows") or []:
              lead_id = str(old.get("lead_id") or "")
              if old.get("status") != "review_draft" or lead_id in excluded:
                  continue
              if lead_id in seen:
                  raise SystemExit(f"duplicate lead in source artifact: {lead_id}")
              seen.add(lead_id)
              row = dict(old)
              override = overrides.get(lead_id)
              if override is not None:
                  if not isinstance(override, dict):
                      raise SystemExit(f"{lead_id}: observation override must be an object")
                  observation = str(override.get("observation") or "").strip()
                  source_url = str(override.get("source_url") or "").strip()
                  source_type = str(override.get("source_type") or "official_site").strip()
                  if not observation or not source_url.startswith(("http://", "https://")) or source_type != "official_site":
                      raise SystemExit(f"{lead_id}: invalid official-site observation override")
                  row["verified_observation"] = observation
                  row["verified_observation_source_url"] = source_url
                  row["verified_observation_source_type"] = source_type
              observation = str(row.get("verified_observation") or "").strip()
              source_url = str(row.get("verified_observation_source_url") or "").strip()
              if not observation or not source_url or row.get("verified_observation_source_type") != "official_site":
                  raise SystemExit(f"{lead_id}: verified official-site observation missing")
              if row.get("contact_basis_status") != "review_required":
                  raise SystemExit(f"{lead_id}: review_required lost")
              language = str(row.get("language") or "nl").casefold()
              if language not in {"nl", "en"}:
                  raise SystemExit(f"{lead_id}: unsupported language={language}")
              matches = [
                  candidate
                  for candidate in verified_candidates
                  if str(row.get("email") or "").casefold()
                  in {str(value or "").casefold() for value in (candidate.get("public_business_emails") or [])}
                  and str(candidate.get("website_hint") or "") == str(row.get("website") or "")
              ]
              if len(matches) != 1:
                  raise SystemExit(f"{lead_id}: expected exactly one verified-input candidate match, got {len(matches)}")
              category_hint = str(matches[0].get("category_hint") or "").strip() or None
              row["category_hint"] = category_hint
              company = clean_company(row.get("company"), language)
              row["copy_company_label"] = short_company_name(company)
              row["copy_subject_label"] = subject_label_for_company(company, language)
              row["subject"] = subject_for_company(company, language)
              row["body"] = build_template(
                  company,
                  language,
                  observation,
                  price_min=price_min,
                  price_max=price_max,
                  category_hint=category_hint,
              )
              row["status"] = "review_draft"
              selected.append(row)

          unknown_overrides = set(overrides) - seen
          if unknown_overrides:
              raise SystemExit(f"observation overrides not present in selected source rows: {sorted(unknown_overrides)}")
          if len(selected) != expected:
              raise SystemExit(f"expected {expected} selected review drafts, got {len(selected)}")
          result = {
              "schema_version": "webactueel-growth-batch/4.3-audited-rewrite",
              "product": old_batch.get("product"),
              "row_count": len(selected),
              "excluded_competitor_count": 0,
              "email_found_count": len(selected),
              "draft_candidate_count": len(selected),
              "review_draft_count": len(selected),
              "rows": selected,
              "safety": {
                  "one_product": True,
                  "six_benefits": True,
                  "language_matched_copy": True,
                  "verified_official_site_observation_required": True,
                  "personalized_company_opening": True,
                  "contact_basis_review_required_before_send": True,
                  "review_draft_storage_allowed": True,
                  "automatic_send": False,
                  "same_lead_ids_rewrite_only": True,
              },
          }
          Path("results/growth-batch.json").write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          write_csv(result, Path("results/growth-batch.csv"))
          print(f"AUDITED_COPY_REBUILD=green count={len(selected)} excluded={len(excluded)} overrides={len(overrides)} automatic_send=false")
          PY

      - name: Prove rewrite scope and copy quality
        env:
          EXPECTED: ${{ steps.request.outputs.expected }}
          EXCLUDE_JSON: ${{ steps.request.outputs.exclude_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = int(os.environ["EXPECTED"])
          old_batch = json.loads(Path("results/source/growth-batch.json").read_text(encoding="utf-8"))
          new_batch = json.loads(Path("results/growth-batch.json").read_text(encoding="utf-8"))
          excluded = set(json.loads(os.environ.get("EXCLUDE_JSON") or "[]"))
          old_rows = {row["lead_id"]: row for row in old_batch.get("rows") or [] if row.get("status") == "review_draft" and row.get("lead_id") not in excluded}
          new_rows = {row["lead_id"]: row for row in new_batch.get("rows") or [] if row.get("status") == "review_draft"}

          if len(old_rows) != expected or len(new_rows) != expected:
              raise SystemExit(f"expected {expected} old/new review drafts, got {len(old_rows)}/{len(new_rows)}")
          if set(old_rows) != set(new_rows):
              raise SystemExit("rewrite lead-ID set changed")
          if (new_batch.get("safety") or {}).get("automatic_send") is not False:
              raise SystemExit("automatic send must remain disabled")
          if (new_batch.get("safety") or {}).get("personalized_company_opening") is not True:
              raise SystemExit("personalized opening safety marker missing")

          changed = 0
          for lead_id, row in new_rows.items():
              old = old_rows[lead_id]
              if row.get("email") != old.get("email") or row.get("website") != old.get("website"):
                  raise SystemExit(f"{lead_id}: recipient or website changed")
              if row.get("contact_basis_status") != "review_required":
                  raise SystemExit(f"{lead_id}: review_required lost")
              if row.get("verified_observation_source_type") != "official_site":
                  raise SystemExit(f"{lead_id}: official-site provenance lost")
              body = str(row.get("body") or "")
              subject = str(row.get("subject") or "")
              company_label = str(row.get("copy_company_label") or "").strip()
              subject_label = str(row.get("copy_subject_label") or "").strip()
              bullets = [line for line in body.splitlines() if line.startswith("• ")]
              if len(bullets) != 6:
                  raise SystemExit(f"{lead_id}: expected six bullets")
              if body.count("€250–€500") != 1 or re.search(r"\b\d+\s*%", body):
                  raise SystemExit(f"{lead_id}: price/percentage boundary failed")
              if row.get("language") == "nl":
                  for value in ("Website/webshop — verbeteren of nieuw maken waar nodig", "Zoekbaarheid — beter vindbaar worden", "Automatisering — geschikte processen deels automatiseren", "Hosting — beheren of overnemen waar passend", "Ik als vast contactpersoon", "voorbeeld design maken voor"):
                      if value not in body:
                          raise SystemExit(f"{lead_id}: NL audited copy contract missing {value}")
              else:
                  for value in ("Website/webshop — improve or build new where needed", "Search visibility — improve findability", "Automation — partially automate suitable processes", "Hosting — manage or take over where appropriate", "Me as your fixed point of contact", "example design for"):
                      if value not in body:
                          raise SystemExit(f"{lead_id}: EN audited copy contract missing {value}")
              if not company_label or company_label not in body:
                  raise SystemExit(f"{lead_id}: company label missing from personalized body")
              if not subject_label or subject_label not in subject:
                  raise SystemExit(f"{lead_id}: company label missing from personalized subject")
              if "Op jullie website staat" in body or "Your website highlights" in body:
                  raise SystemExit(f"{lead_id}: old vague opening survived")
              if "Ik heb de website van " in body or ("I looked through " in body and "'s website." in body):
                  raise SystemExit(f"{lead_id}: generic opening survived audited rewrite")
              if not 2 <= len(subject.split()) <= 8:
                  raise SystemExit(f"{lead_id}: subject length invalid")
              if body != str(old.get("body") or "") or subject != str(old.get("subject") or ""):
                  changed += 1

          print(f"PERSONALIZED_REWRITE_AUDIT=green count={expected} changed={changed} automatic_send=false")
          PY

      - name: Safely replace and exactly read back mijn.host drafts
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
          EXPECTED: ${{ steps.request.outputs.expected }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_draft.py \
            --batch results/growth-batch.json \
            --report results/myhost-drafts.json | tee results/myhost-drafts.txt
          grep -q '^MYHOST_DRAFT_SYNC=green ' results/myhost-drafts.txt
          grep -q 'smtp_send=not_available' results/myhost-drafts.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = int(os.environ["EXPECTED"])
          batch = json.loads(Path("results/growth-batch.json").read_text(encoding="utf-8"))
          report = json.loads(Path("results/myhost-drafts.json").read_text(encoding="utf-8"))
          rows = {row["lead_id"]: row for row in batch.get("rows") or [] if row.get("status") == "review_draft"}
          if report.get("eligible_count") != expected:
              raise SystemExit("eligible_count mismatch")
          if report.get("created_count") != 0:
              raise SystemExit("rewrite must not create new drafts")
          if int(report.get("existing_count") or 0) + int(report.get("replaced_count") or 0) != expected:
              raise SystemExit("existing+replaced count mismatch")
          if report.get("review_required_count") != expected:
              raise SystemExit("review_required_count mismatch")
          if report.get("smtp_send") != "not_available":
              raise SystemExit("SMTP/send must remain unavailable")
          if len(report.get("items") or []) != expected:
              raise SystemExit("readback item count mismatch")
          for item in report.get("items") or []:
              lead_id = item.get("lead_id")
              row = rows.get(lead_id)
              if not row or item.get("outcome") not in {"existing", "replaced"}:
                  raise SystemExit(f"{lead_id}: replacement outcome mismatch")
              if item.get("to") != row.get("email") or item.get("subject") != row.get("subject") or item.get("body") != row.get("body"):
                  raise SystemExit(f"{lead_id}: exact readback mismatch")
              if item.get("review_status") != "contact-basis":
                  raise SystemExit(f"{lead_id}: review status mismatch")
          print(f"PERSONALIZED_REWRITE_READBACK=green count={expected} automatic_send=false")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personalized-draft-rewrite-${{ github.run_number }}
          path: |
            results/growth-batch.json
            results/growth-batch.csv
            results/myhost-drafts.json
            results/myhost-drafts.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove source artifact residue
        if: always()
        run: rm -rf results/source results/source.zip

      - name: Close owner request issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Existing review drafts safely rewritten and exactly read back. Nothing was sent."
          gh issue close "$ISSUE_NUMBER"
