name: Hybrid Maps Discovery

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Plaats of regio, bijvoorbeeld Rotterdam'
        required: true
        type: string
      keywords:
        description: 'Komma- of newlinegescheiden zoektermen'
        required: true
        type: string
      max_results:
        description: 'Maximaal aantal gecombineerde candidate hints (1-100)'
        required: true
        default: '40'
        type: string
      radius_km:
        description: 'Overture zoekstraal in km (0.5-50)'
        required: true
        default: '8'
        type: string
      require_website:
        description: 'Alleen kandidaten met website-hint'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-discovery.txt

      - name: Install discovery dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt

      - name: Validate inputs and build query files
        env:
          REGION: ${{ inputs.region }}
          KEYWORDS: ${{ inputs.keywords }}
          MAX_RESULTS: ${{ inputs.max_results }}
          RADIUS_KM: ${{ inputs.radius_km }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          region = os.environ["REGION"].strip()
          if not region or len(region) > 120:
              raise SystemExit("region must be 1-120 characters")

          max_results = int(os.environ["MAX_RESULTS"])
          if not 1 <= max_results <= 100:
              raise SystemExit("max_results must be 1-100")

          radius = float(os.environ["RADIUS_KM"])
          if not 0.5 <= radius <= 50:
              raise SystemExit("radius_km must be 0.5-50")

          raw = os.environ["KEYWORDS"]
          keywords = [x.strip() for x in re.split(r"[,\n]+", raw) if x.strip()]
          if not 1 <= len(keywords) <= 12:
              raise SystemExit("provide 1-12 keywords")
          if any(len(x) > 80 for x in keywords):
              raise SystemExit("each keyword must be <=80 characters")

          Path("results").mkdir(exist_ok=True)
          Path("results/keywords.json").write_text(
              json.dumps(keywords, ensure_ascii=False),
              encoding="utf-8",
          )
          Path("results/google-maps-queries.txt").write_text(
              "".join(f"{keyword} {region}\n" for keyword in keywords),
              encoding="utf-8",
          )
          PY

      - name: Run Overture + PDOK discovery
        env:
          PYTHONPATH: scripts
          REGION: ${{ inputs.region }}
          MAX_RESULTS: ${{ inputs.max_results }}
          RADIUS_KM: ${{ inputs.radius_km }}
          REQUIRE_WEBSITE: ${{ inputs.require_website }}
        run: |
          set -euo pipefail
          args=(
            --region "$REGION"
            --radius-km "$RADIUS_KM"
            --max-results "$MAX_RESULTS"
            --output results/overture-discovery.json
          )
          if [ "$REQUIRE_WEBSITE" = "true" ]; then
            args+=(--require-website)
          fi
          while IFS= read -r keyword; do
            args+=(--keyword "$keyword")
          done < <(python3 -c 'import json; print("\n".join(json.load(open("results/keywords.json"))))')
          python3 scripts/overture_discovery.py "${args[@]}"

      - name: Run Google Maps discovery
        run: |
          set -euo pipefail
          mkdir -p results/google-maps
          docker pull gosom/google-maps-scraper:v1.18.1
          docker run --rm \
            -v "$PWD/results/google-maps-queries.txt:/queries.txt:ro" \
            -v "$PWD/results/google-maps:/out" \
            gosom/google-maps-scraper:v1.18.1 \
            -input /queries.txt \
            -results /out/results.csv \
            -depth 1 \
            -exit-on-inactivity 3m

      - name: Merge and sanitize discovery sources
        env:
          REQUIRE_WEBSITE: ${{ inputs.require_website }}
          MAX_RESULTS: ${{ inputs.max_results }}
        run: |
          set -euo pipefail
          args=(
            --overture results/overture-discovery.json
            --google-maps-csv results/google-maps/results.csv
            --output results/hybrid-discovery.json
            --max-results "$MAX_RESULTS"
          )
          if [ "$REQUIRE_WEBSITE" = "true" ]; then
            args+=(--require-website)
          fi
          python3 scripts/hybrid_discovery.py "${args[@]}"

      - name: Prove discovery-only output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("results/hybrid-discovery.json").read_text(encoding="utf-8"))
          forbidden = {"email", "emails", "phone", "phones", "social", "socials"}
          for candidate in data["candidates"]:
              overlap = forbidden.intersection(candidate)
              if overlap:
                  raise SystemExit(f"forbidden contact fields emitted: {sorted(overlap)}")
              if candidate.get("identity_status") != "needs_leads_verification":
                  raise SystemExit("identity gate was bypassed")
          if data["privacy_and_scope"]["draftqueue_write"] is not False:
              raise SystemExit("hybrid discovery must not write DraftQueue")
          if data["privacy_and_scope"]["email_send"] is not False:
              raise SystemExit("hybrid discovery must not send email")
          print("HYBRID_DISCOVERY_SCOPE=green")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hybrid-maps-discovery-${{ github.run_number }}
          path: |
            results/hybrid-discovery.json
            results/overture-discovery.json
          if-no-files-found: warn
          retention-days: 1
