name: 450 Openings safe sync code checks
on:
  pull_request:
    paths:
      - 'scripts/sync450_openings.py'
      - 'tests/test_sync450_openings.py'
      - 'scripts/live_450_draft_inventory.py'
      - 'tests/test_live_450_draft_inventory.py'
      - 'scripts/migrate_v2_drafts.py'
      - 'scripts/v2_private_stale_inventory.py'
      - 'scripts/private_imap_archive.py'
      - 'scripts/draft_revision.py'
      - 'tests/test_migrate_v2_drafts.py'
      - 'tests/test_v2_private_stale_inventory.py'
      - '.github/workflows/sync450-openings.yml'
      - '.github/workflows/sync450-openings-ci.yml'
permissions:
  contents: read
jobs:
  safe-sync-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Run no-provider synthetic safety checks
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_sync450_openings.py' -q
          python3 -m unittest discover -s tests -p 'test_reconcile450_current.py' -q
          python3 -m unittest discover -s tests -p 'test_live_450_draft_inventory.py' -q
          python3 -m unittest discover -s tests -p 'test_draft_revision.py' -q
          python3 -m unittest discover -s tests -p 'test_migrate_v2_drafts.py' -q
          python3 -m unittest discover -s tests -p 'test_v2_private_stale_inventory.py' -q
