name: Webactueel Current 60-Site Lead Rescan 2026-08-17 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-batch-rescan-20260817-v2.yml'

permissions:
  contents: read

concurrency:
  group: webactueel-current-60-site-lead-rescan-20260817-v2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact 60-target input
        shell: bash
        env:
          EXPECTED_TARGET_HASH: 99a1569d1661905cbbd2271064e22ff2b7ba0cf7297d65369db2177f2f788999
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lines = fs.readFileSync('sites.txt', 'utf8').split(/\r?\n/)
            .map(v => v.trim()).filter(v => v && !v.startsWith('#'));
          const urls = [...new Set(lines)];
          if (urls.length !== 60) throw new Error(`expected 60 unique targets, got ${urls.length}`);
          const norm = (value) => {
            const u = new URL(/^https?:\/\//i.test(value) ? value : `https://${value}`);
            let host = u.hostname.toLowerCase();
            if (host.startsWith('www.')) host = host.slice(4);
            let path = u.pathname || '/';
            if (path !== '/' && path.endsWith('/')) path = path.slice(0, -1);
            return `${host}${path}`;
          };
          const digest = crypto.createHash('sha256').update(urls.map(norm).sort().join('\n')).digest('hex');
          if (digest !== process.env.EXPECTED_TARGET_HASH) throw new Error(`target list hash mismatch: ${digest}`);
          console.log(`Verified ${urls.length} targets: ${digest}`);
          NODE

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify scanner dependencies
        run: |
          npm run check:crawler
          npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run explicit current 60-site rescan
        env:
          REQUIRE_SINGLE_TARGET: 'false'
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '4'
          MAX_REQUESTS_PER_MINUTE: '30'
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental site checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          echo "Explicit user-approved rescan of the latest 60-lead workbook." >> "$GITHUB_STEP_SUMMARY"
          echo "Project source set: 10.5.3" >> "$GITHUB_STEP_SUMMARY"
          echo "Workbook target hash: 99a1569d1661905cbbd2271064e22ff2b7ba0cf7297d65369db2177f2f788999" >> "$GITHUB_STEP_SUMMARY"
          echo "Formal browser route limit remains the scanner contract maximum of 4 key pages per site per profile; discovery/link tools are supplemental." >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-current-60-site-rescan-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7