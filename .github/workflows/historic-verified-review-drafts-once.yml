name: One-time historical reviewed Drafts (12 x 100, never send)
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_number == 1 &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[historical-reviewed-drafts]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify immutable 11-plus-1 audited source and full job history
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = "https://api.github.com/repos/Yolol100/Leadscanner/actions/runs/"
          authorization = os.environ["GH_READ_TOKEN"]
          def read(url):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + authorization,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as reply:
                  return json.load(reply)

          def get_run(run_id, sha, conclusion, total):
              item = read(base + str(run_id))
              payload = read(base + str(run_id) + "/jobs?per_page=100")
              if not (
                  item.get("id") == run_id
                  and item.get("head_sha") == sha
                  and item.get("head_branch") == "main"
                  and item.get("event") == "push"
                  and item.get("run_attempt") == 1
                  and item.get("status") == "completed"
                  and item.get("conclusion") == conclusion
                  and payload.get("total_count") == total
                  and len(payload.get("jobs", [])) == total
              ):
                  raise RuntimeError("historical_audit_provenance_hold")
              return {job["name"]: (job["status"], job["conclusion"])
                      for job in payload["jobs"]}

          try:
              original = get_run(
                  38318758579,
                  "13c23f8ff8408d77dfd4ae7403d6dd62e84c46b6",
                  "failure", 13,
              )
              retries = get_run(
                  38323011472,
                  "d9c628f780475efc44441ae53add4157d9177c67",
                  "success", 1,
              )
              offsets = range(0, 1128, 100)
              required = {"test": ("completed", "success")}
              required.update({
                  "audit (" + str(offset) + ")":
                      ("completed", "failure" if offset == 1000 else "success")
                  for offset in offsets
              })
              if original != required or retries != {"recheck": ("completed", "success")}:
                  raise RuntimeError("historical_job_reconciliation_hold")
          except Exception:
              print("HISTORICAL_IMAP_GATE=red anonymous_provenance_hold")
              raise SystemExit(1)
          print("HISTORICAL_IMAP_GATE=green source_batches=12 size=1128 max_approved=53")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Full synthetic regression suite before mailbox credentials are used
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q

  smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: leadscanner-mijnhost-drafts
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: IMAP self-addressed Draft append, exact readback and target UID cleanup
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from contextlib import redirect_stdout, redirect_stderr
          from io import StringIO
          from myhost_draft import live_self_draft_smoke
          try:
              with redirect_stdout(StringIO()), redirect_stderr(StringIO()):
                  result = live_self_draft_smoke()
              if result != {
                  "status": "green",
                  "synthetic_draft_created": 1,
                  "exact_imap_readback": 1,
                  "synthetic_draft_cleaned": 1,
                  "emails_sent": 0,
                  "prospect_records_touched": 0,
              }:
                  raise RuntimeError("unexpected_smoke_result")
          except Exception:
              print("HISTORICAL_IMAP_SMOKE=red anonymous_hold")
              sys.exit(1)
          print("HISTORICAL_IMAP_SMOKE=green self_only=1 readback=1 cleanup=1 sent=0")
          PY

  save:
    needs: [verify, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    concurrency:
      group: leadscanner-mijnhost-drafts
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Recheck at most 100 historical contacts, final suppression, exact Draft readback
        env:
          PYTHONPATH: scripts
          OFFSET: ${{ matrix.offset }}
          LEADSCANNER_TRUSTED_HISTORICAL_WRITE: 'true'
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_site_redraft.py --offset "$OFFSET" --mode drafts
