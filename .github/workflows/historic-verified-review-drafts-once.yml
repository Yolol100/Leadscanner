name: Temporary verified historical review drafts (never send)
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[historical-reviewed-drafts]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact complete successful site audit and twelve jobs
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          audit_id = 38318758579
          expected_sha = '13c23f8ff8408d77dfd4ae7403d6dd62e84c46b6'
          repo = 'Yolol100/Leadscanner'
          def read_json(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.load(response)
          base = 'https://api.github.com/repos/' + repo + '/actions/runs/' + str(audit_id)
          run = read_json(base)
          jobs = read_json(base + '/jobs?per_page=100')
          expected = {'audit (' + str(i) + ')' for i in range(0, 1128, 100)}
          actual = {
              job.get('name') for job in jobs.get('jobs', [])
              if str(job.get('name', '')).startswith('audit (')
          }
          safe = (
              run.get('id') == audit_id
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
              and run.get('head_sha') == expected_sha
              and run.get('head_branch') == 'main'
              and run.get('event') == 'push'
              and jobs.get('total_count') == 13
              and actual == expected
              and all(job.get('status') == 'completed' and job.get('conclusion') == 'success'
                      for job in jobs.get('jobs', []))
          )
          if not safe:
              print('HISTORICAL_AUDIT_GATE=red details_suppressed')
              raise SystemExit(1)
          print('HISTORICAL_AUDIT_GATE=green batches=12 identities=1128')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37e89fd3d9d65cea430cbaa11cd6046b1ef58e45
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Synthetic regressions before any IMAP use
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
  save:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37e89fd3d9d65cea430cbaa11cd6046b1ef58e45
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Fresh sources, verified 4-6-point copy, final dedupe and exact IMAP Draft readback
        env:
          PYTHONPATH: scripts
          OFFSET: ${{ matrix.offset }}
          LEADSCANNER_TRUSTED_HISTORICAL_WRITE: 'true'
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_site_redraft.py --offset "$OFFSET" --mode drafts
