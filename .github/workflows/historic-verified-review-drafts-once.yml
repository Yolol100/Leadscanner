name: Temporary verified historical review drafts (never send)
on:
  workflow_run:
    workflows:
      - "Temporary historic site re-review (12 bounded batches, no send)"
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.event.workflow_run.id == 38318758579 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == '13c23f8ff8408d77dfd4ae7403d6dd62e84c46b6' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37e89fd3d9d65cea430cbaa11cd6046b1ef58e45
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Full source, HMAC, website, copy, IMAP and privacy regressions
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
  save:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37e89fd3d9d65cea430cbaa11cd6046b1ef58e45
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Live source, official websites and fresh suppression before reviewed IMAP Drafts
        env:
          PYTHONPATH: scripts
          OFFSET: ${{ matrix.offset }}
          LEADSCANNER_TRUSTED_HISTORICAL_WRITE: 'true'
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_site_redraft.py --offset "$OFFSET" --mode drafts
