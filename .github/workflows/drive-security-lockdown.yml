name: One-time Drive Security Lockdown

on:
  workflow_dispatch:
  push:
    paths:
      - 'drive-lockdown-request.txt'

permissions:
  contents: read

jobs:
  lockdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Google Drive dependencies
        run: python3 -m pip install --disable-pip-version-check 'google-api-python-client>=2.179,<3' 'google-auth>=2.40,<3'

      - name: Remove public-anyone permissions and verify
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEADS_FOLDER_ID: 1xZJXETlggdyZZBM7pqs3vxcYqi1q-YJf
          LEAD_SHEET_ID: 1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'DRIVE_LOCKDOWN=blocked_missing_google_service_account' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          info = json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/drive']
          )
          drive = build('drive', 'v3', credentials=creds, cache_discovery=False)
          targets = {
              'Leads folder': os.environ['LEADS_FOLDER_ID'],
              'Webactueel Leadlijst': os.environ['LEAD_SHEET_ID'],
          }
          receipt = []
          for label, file_id in targets.items():
              before = drive.permissions().list(
                  fileId=file_id,
                  fields='permissions(id,type,role)',
                  supportsAllDrives=True,
              ).execute().get('permissions', [])
              public = [p for p in before if p.get('type') == 'anyone']
              for permission in public:
                  drive.permissions().delete(
                      fileId=file_id,
                      permissionId=permission['id'],
                      supportsAllDrives=True,
                  ).execute()
              after = drive.permissions().list(
                  fileId=file_id,
                  fields='permissions(id,type,role)',
                  supportsAllDrives=True,
              ).execute().get('permissions', [])
              remaining = [p for p in after if p.get('type') == 'anyone']
              if remaining:
                  raise SystemExit(f'{label}: public permissions remain')
              receipt.append({'target': label, 'removed_anyone_count': len(public), 'remaining_anyone_count': 0})
          print(json.dumps(receipt, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('DRIVE_LOCKDOWN=green\n')
              for item in receipt:
                  fh.write(f"- {item['target']}: removed_anyone={item['removed_anyone_count']}, remaining_anyone=0\n")
          PY
