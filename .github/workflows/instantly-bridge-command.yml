name: Instantly Bridge Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: instantly-bridge
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'INSTANTLY BRIDGE' &&
      contains(github.event.issue.body, 'COMMAND=')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          mapfile -t commands < <(printf '%s\n' "$body" | sed -n 's/^COMMAND=//p')
          if [ "${#commands[@]}" -ne 1 ]; then
            echo 'Expected exactly one COMMAND line.' >&2
            exit 2
          fi
          command="${commands[0]}"
          case "$command" in
            CONNECTION_TEST|CAMPAIGN_STATUS|SYNC_SELECTED_TO_LIST|SYNC_SELECTED_TO_CAMPAIGN) ;;
            *) echo 'Unsupported command.' >&2; exit 2 ;;
          esac
          echo "command=$command" >> "$GITHUB_OUTPUT"

          mapfile -t campaign_lines < <(printf '%s\n' "$body" | sed -n 's/^CAMPAIGN_ID=//p')
          mapfile -t list_lines < <(printf '%s\n' "$body" | sed -n 's/^LIST_ID=//p')
          mapfile -t count_lines < <(printf '%s\n' "$body" | sed -n 's/^EXPECTED_COUNT=//p')
          mapfile -t apply_lines < <(printf '%s\n' "$body" | sed -n 's/^APPLY=//p')
          mapfile -t lead_ids < <(printf '%s\n' "$body" | sed -n 's/^LEAD_ID=//p')

          campaign_id="${campaign_lines[0]:-}"
          list_id="${list_lines[0]:-}"
          expected_count="${count_lines[0]:-0}"
          apply="${apply_lines[0]:-false}"

          if ! [[ "$expected_count" =~ ^[0-9]{1,3}$ ]] || [ "$expected_count" -gt 100 ]; then
            echo 'EXPECTED_COUNT must be 0-100.' >&2
            exit 2
          fi
          case "$apply" in true|false) ;; *) echo 'APPLY must be true or false.' >&2; exit 2 ;; esac

          if [[ "$command" == SYNC_SELECTED_* ]]; then
            if [ "$expected_count" -lt 1 ] || [ "${#lead_ids[@]}" -ne "$expected_count" ]; then
              echo 'Selected sync requires exact EXPECTED_COUNT and LEAD_ID lines.' >&2
              exit 2
            fi
            : > selected-lead-ids.txt
            for lead_id in "${lead_ids[@]}"; do
              if ! [[ "$lead_id" =~ ^[A-Za-z0-9._:-]{1,180}$ ]]; then
                echo 'A LEAD_ID contains unsupported characters.' >&2
                exit 2
              fi
              printf '%s\n' "$lead_id" >> selected-lead-ids.txt
            done
            if [ "$(sort selected-lead-ids.txt | uniq | wc -l)" -ne "$expected_count" ]; then
              echo 'LEAD_ID lines contain duplicates.' >&2
              exit 2
            fi
          fi

          echo "campaign_id=$campaign_id" >> "$GITHUB_OUTPUT"
          echo "list_id=$list_id" >> "$GITHUB_OUTPUT"
          echo "expected_count=$expected_count" >> "$GITHUB_OUTPUT"
          echo "apply=$apply" >> "$GITHUB_OUTPUT"

      - name: Execute safe Instantly bridge
        id: bridge
        continue-on-error: true
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          COMMAND: ${{ steps.command.outputs.command }}
          CAMPAIGN_ID: ${{ steps.command.outputs.campaign_id }}
          LIST_ID: ${{ steps.command.outputs.list_id }}
          EXPECTED_COUNT: ${{ steps.command.outputs.expected_count }}
          APPLY: ${{ steps.command.outputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND" in
            CONNECTION_TEST)
              args=(--command connection-test)
              ;;
            CAMPAIGN_STATUS)
              args=(--command campaign-status --campaign-id "$CAMPAIGN_ID")
              ;;
            SYNC_SELECTED_TO_LIST)
              args=(--command sync-selected-to-list --list-id "$LIST_ID" --lead-id-file selected-lead-ids.txt --expected-count "$EXPECTED_COUNT")
              ;;
            SYNC_SELECTED_TO_CAMPAIGN)
              args=(--command sync-selected-to-campaign --campaign-id "$CAMPAIGN_ID" --lead-id-file selected-lead-ids.txt --expected-count "$EXPECTED_COUNT")
              ;;
          esac
          if [ "$APPLY" = 'true' ]; then
            args+=(--apply)
          fi
          python3 scripts/instantly_bridge.py "${args[@]}" --report instantly-result.json | tee instantly-result.txt

      - name: Report safe result
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BRIDGE_OUTCOME" = 'success' ] && [ -f instantly-result.json ]; then
            summary="$(jq -r '"INSTANTLY_BRIDGE=" + (.status // "unknown") + "\nCOMMAND=" + (.command // "") + "\nMODE=" + (.mode // "read_only") + "\nTARGET=" + ((.target // 0)|tostring) + "\nSUBMITTED=" + ((.submitted // 0)|tostring) + "\nFINAL_READBACK=" + ((.final_readback // 0)|tostring) + "\nCAMPAIGN_STATUS=" + (.campaign_status // .destination_status // "") + "\nSEND_PERMISSION=none\nACTIVATION_INVOKED=false"' instantly-result.json)"
          else
            summary='INSTANTLY_BRIDGE=blocked\nSEND_PERMISSION=none\nACTIVATION_INVOKED=false'
          fi
          payload="$(jq -n --arg body "$summary" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d "$close_payload" >/dev/null

      - name: Fail closed
        if: steps.bridge.outcome != 'success'
        run: exit 1
