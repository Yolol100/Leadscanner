name: Leads Opening Remediation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: >-
    ${{ contains(github.event.issue.body, '"mode":"apply"') && 'leads-content-remediation-write' || format('opening-audit-{0}', github.event.issue.number) }}
  cancel-in-progress: false
  queue: max

jobs:
  opening:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[growth-opening-remediate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve bounded request
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          mkdir -p results/source results/audit
          PYTHONPATH=scripts python3 - <<'PY'
          import json, os
          from pathlib import Path
          from myhost_opening_remediation import validate_request
          event = json.loads(Path(os.environ['EVENT_PATH']).read_text())
          req = validate_request(json.loads(event['issue']['body']))
          Path('results/request.json').write_text(json.dumps(req, ensure_ascii=False))
          PY
      - name: Download immutable source and audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(python3 -c 'import json; print(json.load(open("results/request.json"))["source_archive_artifact_id"])')
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$archive/zip" > results/source.zip
          unzip -q results/source.zip -d results/source
          audit=$(python3 -c 'import json; print(json.load(open("results/request.json")).get("audit_artifact_id", 0))')
          if [ "$audit" != 0 ]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$audit/zip" > results/audit.zip
            unzip -q results/audit.zip -d results/audit
            test -f results/audit/opening-report.json
          fi
      - name: Bounded official-site audit or opening-only repair
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          args=()
          if test -f results/audit/opening-report.json; then args+=(--audit results/audit/opening-report.json); fi
          PYTHONPATH=scripts python3 scripts/myhost_opening_remediation.py --request results/request.json --source-root results/source "${args[@]}" --report results/opening-report.json | tee results/opening-result.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: opening-remediation-${{ github.event.issue.number }}
          path: |
            results/opening-report.json
            results/opening-result.txt
          if-no-files-found: error
          retention-days: 7
      - name: Close request with exact summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if test -f results/opening-report.json; then
            python3 - <<'PY' > results/comment.txt
          import json
          r=json.load(open('results/opening-report.json'))
          keys=['mode','audited_count','ready_count','hold_count','absent_count','changed_count','already_correct_count','removed_count','blockers','automatic_send','send_capability']
          print('OPENING_RESULT=' + json.dumps({k:r.get(k) for k in keys},ensure_ascii=False))
          print('Full exact mailbox snapshots and first-party evidence are in the run artifact. Nothing was sent.')
          PY
          else
            echo 'Opening remediation blocked before a complete report. Nothing was sent.' > results/comment.txt
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file results/comment.txt
          gh issue close "$ISSUE_NUMBER" --reason completed
