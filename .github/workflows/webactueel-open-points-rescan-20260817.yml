name: Webactueel Open Points Rescan 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webactueel-open-points-rescan-20260817.yml'

permissions:
  contents: read

concurrency:
  group: webactueel-open-points-rescan-20260817
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: tuinvisioen
            target_url: https://www.tuinvisioen.nl/
            site_type_hint: service
          - slug: dakdekkerbrummer
            target_url: https://www.dakdekkerbrummer.nl/
            site_type_hint: service
          - slug: vandongen-installateurs
            target_url: https://vandongen-installateurs.nl/
            site_type_hint: service
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify scanner dependencies
        run: |
          npm run check:crawler
          npm run check:tools

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run explicit one-site rescan
        env:
          TARGET_URL: ${{ matrix.target_url }}
          REQUIRE_SINGLE_TARGET: 'true'
          SITE_TYPE_HINT: ${{ matrix.site_type_hint }}
          RUN_LIGHTHOUSE: 'false'
          MAX_CONCURRENCY: '2'
          MAX_REQUESTS_PER_MINUTE: '30'
          MAX_ACTIVE_REQUESTS_PER_MINUTE: '120'
          MAX_PAGES_PER_SITE: '4'
        run: npm run scan

      - name: Setup Java 17 for LanguageTool
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run supplemental site checks
        env:
          RUN_DISCOVERY: 'true'
          RUN_TECH_DETECT: 'true'
          RUN_LINKINATOR: 'true'
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run enrich

      - name: Build Leads handoff
        run: npm run handoff:leads

      - name: Publish scan summary
        if: always()
        run: |
          echo "Explicit user-approved recheck for remaining blocked/open lead audit points." >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${{ matrix.target_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Project source set: 10.5.3" >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results/summary.md ]; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-open-points-${{ matrix.slug }}-${{ github.run_number }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7
