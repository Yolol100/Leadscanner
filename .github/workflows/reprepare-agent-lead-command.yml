name: Chat Agent Copy Refresh Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: chat-agent-copy-refresh-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'REFRESH AGENT COPY' &&
      contains(github.event.issue.body, 'COMMAND=REFRESH_AGENT_COPY')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse exact lead command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lead_lines < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("LEAD_ID=")) | sub("^LEAD_ID="; "")' "$GITHUB_EVENT_PATH")
          if [ "${#lead_lines[@]}" -ne 1 ]; then
            echo 'Expected exactly one LEAD_ID line.' >&2
            exit 2
          fi
          lead_id="${lead_lines[0]}"
          if ! [[ "$lead_id" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]; then
            echo 'LEAD_ID contains unsupported characters.' >&2
            exit 2
          fi
          echo "lead_id=$lead_id" >> "$GITHUB_OUTPUT"

      - name: Load private outreach config
        env:
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_private_config.py

      - name: Refresh exact agent copy with no send permission
        id: refresh
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_CTA_VARIANT: ${{ vars.OUTREACH_CTA_VARIANT || 'A' }}
          OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
        run: |
          set -euo pipefail
          python3 scripts/outreach_agent_copy_refresh.py --lead-id '${{ steps.command.outputs.lead_id }}' | tee refresh-result.txt
          grep -q '^OUTREACH_AGENT_COPY_REFRESH=green ' refresh-result.txt
          grep -q 'send_permission=none' refresh-result.txt
          grep -q 'smtp_send=not_invoked' refresh-result.txt

      - name: Report bounded readback on command issue
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          LEAD_ID: ${{ steps.command.outputs.lead_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REFRESH_OUTCOME" = 'success' ] && grep -q '^OUTREACH_AGENT_COPY_REFRESH=green ' refresh-result.txt 2>/dev/null; then
            result='AGENT_COPY_REFRESH_COMMAND=green'
          else
            result='AGENT_COPY_REFRESH_COMMAND=blocked'
          fi
          body="${result}\nLEAD_ID=${LEAD_ID}\nSEND_PERMISSION=none\nSMTP_SEND=not_invoked\nMAILBOX_CREDENTIAL=not_loaded"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error -X PATCH \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" -d "$close_payload" >/dev/null

      - name: Fail closed when copy refresh failed
        if: steps.command.outcome == 'success' && steps.refresh.outcome != 'success'
        run: |
          echo 'The exact agent copy refresh did not produce verified readback.' >&2
          exit 1
