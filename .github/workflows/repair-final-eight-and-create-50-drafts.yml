name: Repair Final Eight and Create 50 mijn.host Drafts

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/repair-final-eight-and-create-50-drafts.yml'

permissions:
  contents: read

concurrency:
  group: repair-final-eight-create-50-drafts-20260910
  cancel-in-progress: false

jobs:
  repair-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      # Mailbox validation requires SMTP metadata even in validate mode. No SMTP transport is called by this workflow.
      OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '20'

    steps:
      - name: Checkout temporary execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require Sheet and IMAP credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          test -n "${OUTREACH_MAIL_PASSWORD:-}" || { echo '::error::OUTREACH_MAIL_PASSWORD is required'; exit 1; }
          echo 'RUNTIME_CREDENTIALS=present'

      - name: Load private outreach footer config
        run: python3 scripts/outreach_private_config.py

      - name: Repair exactly eight verified A-fit contacts into manual-review queue
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/repair_final_eight_verified_contacts.py | tee final-eight-repair.log
          grep -q '^FINAL8_REPAIR=green resolved=8 target=8 smtp_send=not_invoked$' final-eight-repair.log

      - name: Require at least 50 final human-ready rows before mailbox write
        shell: bash
        run: |
          set -euo pipefail
          out="$(python3 ops/finalize_50_human_drafts.py --count-only)"
          printf '%s\n' "$out" | tee final-50-count.log
          ready="$(printf '%s\n' "$out" | sed -n 's/^FINAL_HUMAN_READY=//p' | tail -n 1)"
          test -n "$ready" || { echo '::error::Could not resolve FINAL_HUMAN_READY'; exit 2; }
          test "$ready" -ge 50 || { echo "::error::Only ${ready} human-ready rows; mailbox remains untouched"; exit 2; }
          echo "FINAL50_PREFLIGHT=green human_ready=${ready} smtp_send=not_invoked"

      - name: Create exactly 50 idempotent IMAP drafts and verify 50 of 50
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/finalize_50_human_drafts.py | tee final-50-human-drafts.log
          grep -q '^LEADS50_FINAL=green selected=50 drafts=50 .*smtp_send=not_invoked$' final-50-human-drafts.log

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-eight-and-50-drafts-${{ github.run_id }}
          path: |
            final-eight-repair.json
            final-eight-repair.log
            final-50-count.log
            selected-50-final.json
            draft-receipts-final.json
            final-50-human-drafts.log
          if-no-files-found: ignore
          retention-days: 14
