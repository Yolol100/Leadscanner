name: Toolbox Smoke Test

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/tools/**'
      - 'src/toolbox-smoke.mjs'
      - 'scripts/start-languagetool.sh'
      - '.github/workflows/toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 22.23.2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Setup Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run toolbox integration smoke
        env:
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run smoke:toolbox
