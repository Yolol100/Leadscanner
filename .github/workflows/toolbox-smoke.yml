name: Toolbox Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/tools/**'
      - 'src/toolbox-smoke.mjs'
      - 'scripts/start-languagetool.sh'
      - '.github/workflows/toolbox-smoke.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/tools/**'
      - 'src/toolbox-smoke.mjs'
      - 'scripts/start-languagetool.sh'
      - '.github/workflows/toolbox-smoke.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify toolbox dependencies
        run: npm run check:tools

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Start pinned local LanguageTool
        run: bash scripts/start-languagetool.sh

      - name: Run toolbox integration smoke
        env:
          RUN_LANGUAGE_TOOL: 'true'
          LANGUAGE_TOOL_URL: http://127.0.0.1:8010/v2/check
        run: npm run smoke:toolbox
