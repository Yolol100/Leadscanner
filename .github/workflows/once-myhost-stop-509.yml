name: Emergency targeted cancel of accidental 509-Draft continuation
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: read
concurrency:
  group: leadscanner-mijnhost-drafts
  cancel-in-progress: true
jobs:
  cancel_current_mailbox_job:
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[myhost-stop-509]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: leadscanner-mijnhost-drafts
      cancel-in-progress: true
    steps:
      - name: Cancel only accidental write-enabled run 38455181185
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Yolol100/Leadscanner/actions/runs/38455181185/cancel')"
          if [ "$code" = "202" ] || [ "$code" = "409" ]; then
            echo "STOP_509_EMERGENCY=green request_accepted_or_terminal=1"
          else
            echo "STOP_509_EMERGENCY=red non_private_http_status=$code"
            exit 1
          fi
