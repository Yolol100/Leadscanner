name: Instantly Full API Command

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: instantly-full-api
  cancel-in-progress: false
  queue: max

jobs:
  run:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'INSTANTLY API' &&
      contains(github.event.issue.body, 'REQUEST_ID=')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse opaque request id only
        id: command
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          mapfile -t request_ids < <(printf '%s\n' "$body" | sed -n 's/^REQUEST_ID=//p')
          if [ "${#request_ids[@]}" -ne 1 ]; then
            echo 'Expected exactly one REQUEST_ID line.' >&2
            exit 2
          fi
          request_id="${request_ids[0]}"
          if ! [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]; then
            echo 'REQUEST_ID is invalid.' >&2
            exit 2
          fi
          if printf '%s\n' "$body" | grep -Eiq '^(METHOD|PATH|QUERY_JSON|BODY_JSON|CONFIRMATION|VERIFY_JSON|API_KEY|EMAIL|SUBJECT|BODY)='; then
            echo 'Private request data must never be placed in a public GitHub issue.' >&2
            exit 2
          fi
          extra="$(printf '%s\n' "$body" | sed '/^REQUEST_ID=/d' | sed '/^[[:space:]]*$/d')"
          if [ -n "$extra" ]; then
            echo 'Only REQUEST_ID is allowed in the public issue body.' >&2
            exit 2
          fi
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Load private request from Google Sheet
        id: load
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          REQUEST_ID: ${{ steps.command.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instantly_private_request.py load \
            --request-id "$REQUEST_ID" \
            --output instantly-request.json
          chmod 600 instantly-request.json

      - name: Apply Webactueel high-impact guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/instantly_command_guard.py \
            --request-json instantly-request.json \
            --report instantly-guard-result.json
          chmod 600 instantly-guard-result.json

      - name: Execute official Instantly API v2 operation
        id: execute
        continue-on-error: true
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instantly_api_v2.py request \
            --request-json instantly-request.json \
            --report instantly-public-result.json \
            --private-report instantly-private-result.json
          chmod 600 instantly-public-result.json instantly-private-result.json

      - name: Record private result
        id: record
        if: always() && steps.load.outcome == 'success' && hashFiles('instantly-public-result.json') != '' && hashFiles('instantly-private-result.json') != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          REQUEST_ID: ${{ steps.command.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instantly_private_request.py result \
            --request-id "$REQUEST_ID" \
            --public-result instantly-public-result.json \
            --private-result instantly-private-result.json

      - name: Report safe public result
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          REQUEST_ID: ${{ steps.command.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GUARD_OUTCOME" = 'success' ] && [ "$EXECUTE_OUTCOME" = 'success' ] && [ -f instantly-public-result.json ]; then
            summary="$(jq -r --arg id "$REQUEST_ID" '
              "INSTANTLY_API=green\nREQUEST_ID=" + $id +
              "\nSTATUS=" + (.status // "unknown") +
              "\nRISK=" + (.risk // "") +
              "\nMETHOD=" + (.method // "") +
              "\nPATH=" + (.path // "") +
              "\nOPERATION_ID=" + (.operation_id // "") +
              "\nAPPLIED=" + ((.applied // false)|tostring) +
              "\nRESPONSE_STATUS=" + ((.response_status // 0)|tostring) +
              "\nRESPONSE_SHAPE=" + (.response_shape // "") +
              "\nRESPONSE_COUNT=" + ((.response_count // 0)|tostring) +
              "\nVERIFICATION=" + (.verification_status // "") +
              "\nCONFIRMATION_TOKEN=" + (.confirmation_token // "") +
              "\nPRIVATE_RESULT=Google Sheet InstantlyResults"' instantly-public-result.json)"
          else
            summary="INSTANTLY_API=blocked\nREQUEST_ID=${REQUEST_ID}\nPRIVATE_RESULT=Google Sheet InstantlyResults"
          fi
          payload="$(jq -n --arg body "$summary" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null

          if [ "$GUARD_OUTCOME" = 'success' ] && [ "$EXECUTE_OUTCOME" = 'success' ]; then
            close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -d "$close_payload" >/dev/null
          fi

      - name: Delete local private payloads
        if: always()
        shell: bash
        run: rm -f instantly-request.json instantly-public-result.json instantly-private-result.json instantly-guard-result.json

      - name: Fail closed
        if: steps.guard.outcome != 'success' || steps.execute.outcome != 'success' || steps.record.outcome != 'success'
        run: exit 1
