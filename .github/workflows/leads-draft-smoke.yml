name: Leadscanner One-Lead Draft Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/lead-draft-smoke.json'

permissions:
  contents: read
  actions: read

env:
  DEDUPE_REGISTRY_CSV_URL: https://docs.google.com/spreadsheets/d/1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI/export?format=csv&gid=1354777664

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'requests>=2,<3'

      - name: Validate exact smoke request
        run: |
          set -euo pipefail
          jq -e '
            (.preview_run_id | type == "number") and
            (.preview_run_id > 0) and
            (.approval_token | test("^growth-[0-9a-f]{20}@[0-9a-f]{16}$"))
          ' .github/lead-draft-smoke.json >/dev/null
          mkdir -p results

      - name: Fetch current dedupe registry
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$DEDUPE_REGISTRY_CSV_URL" \
            --output results/dedupe-registry.csv
          printf '[]\n' > results/empty-candidates.json
          python3 scripts/dedupe_preflight.py \
            --registry-csv results/dedupe-registry.csv \
            --candidates-json results/empty-candidates.json \
            --output results/registry-check.json

      - name: Resume exact preview
        env:
          PYTHONPATH: scripts
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIEW_RUN_ID=$(jq -r .preview_run_id .github/lead-draft-smoke.json)
          python3 scripts/preview_snapshot.py resume \
            --run-id "$PREVIEW_RUN_ID" \
            --output-dir results

      - name: Select exactly one approved lead
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          export INPUT_APPROVED_REVIEW_TOKENS=$(jq -r .approval_token .github/lead-draft-smoke.json)
          python3 scripts/review_selection.py select \
            --batch results/review-draft-batch.json \
            --approved-tokens-env INPUT_APPROVED_REVIEW_TOKENS \
            --output results/approved-review-draft-batch.json
          test "$(jq -r .draft_candidate_count results/approved-review-draft-batch.json)" = "1"

      - name: Revalidate against live dedupe
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/approval_revalidation.py \
            --batch results/approved-review-draft-batch.json \
            --registry-csv results/dedupe-registry.csv \
            --output results/approved-current-batch.json
          test "$(jq -r .remaining_count results/approved-current-batch.json)" = "1"

      - name: Store one strict mijn.host review draft
        env:
          PYTHONPATH: scripts
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          python3 scripts/myhost_draft.py \
            --batch results/approved-current-batch.json \
            --report results/myhost-drafts.json \
            --reject-changed-existing | tee results/myhost-drafts.txt
          grep -q '^MYHOST_DRAFT_SYNC=green ' results/myhost-drafts.txt
          grep -q 'reject_changed_existing=true' results/myhost-drafts.txt
          grep -q 'smtp_send=not_available' results/myhost-drafts.txt

      - name: Exact mailbox readback
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/review_draft_stages.py readback \
            --batch results/approved-current-batch.json \
            --report results/myhost-drafts.json \
            --output results/review-draft-readback.json
          test "$(jq -r .status results/review-draft-readback.json)" = "green"
          test "$(jq -r .draft_count results/review-draft-readback.json)" = "1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lead-draft-smoke-${{ github.run_id }}
          path: |
            results/approved-current-batch.json
            results/myhost-drafts.json
            results/myhost-drafts.txt
            results/review-draft-readback.json
          if-no-files-found: error
          retention-days: 1
