name: Fresh Leads — alleen anonieme bedrijfshints
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Controleer eerst alleen het uitsluitingsregister
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - discover
      region:
        description: Plaats of regio in Nederland
        required: true
        type: string
      keywords:
        description: Branches, komma-gescheiden
        required: true
        type: string
      radius_km:
        description: Zoekstraal in km (0.5-30)
        default: '8'
        required: true
        type: string
      limit:
        description: Maximaal 100 kandidaten
        default: '30'
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Fresh-only tests and syntax
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
  preflight:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'preflight') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LEADS_PREFLIGHT_ONLY:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Verify complete live suppression with anonymous summary
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import sys
          from registry_readonly import load_suppressions
          try:
              rows = load_suppressions()
              if len(rows) < 2:
                  raise RuntimeError("incomplete")
              print("FRESH_LEADS_PREFLIGHT=green")
          except Exception:
              print("FRESH_LEADS_PREFLIGHT=red")
              sys.exit(1)
          PY

  discover:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'discover') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LEADS_DISCOVERY_ONLY:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Read historical exclusions first and print counts only
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          REGION: ${{ inputs.region }}
          KEYWORDS: ${{ inputs.keywords }}
          RADIUS: ${{ inputs.radius_km }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python3 scripts/trigger_request.py

  private_bulk_450:
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'LEADS_BULK450_ONLY:')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Revalidate historical exclusions and produce encrypted business-only review
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/bulk450_private_export.py
