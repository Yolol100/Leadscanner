name: Fresh Leads — alleen anonieme bedrijfshints
on:
  schedule:
    # Bounded weekly official-site discovery, never an email sender.
    - cron: '23 6 * * 1'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Controleer eerst alleen het uitsluitingsregister
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - discover
          - fill_100
      region:
        description: Plaats of regio in Nederland
        required: true
        default: Nederland
        type: string
      keywords:
        description: Branches, komma-gescheiden
        required: true
        default: vakbedrijven
        type: string
      radius_km:
        description: Zoekstraal in km (0.5-30)
        default: '25'
        required: true
        type: string
      limit:
        description: Maximaal 100 kandidaten
        default: '30'
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    # PR/push CI validates production code. Avoid repeating the full suite on every manual lookup.
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Fresh-only tests and syntax
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
  preflight:
    needs: test
    if: >-
      always() && !cancelled() &&
      (needs.test.result == 'success' ||
       ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.test.result == 'skipped')) &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'preflight') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LEADS_PREFLIGHT_ONLY:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m compileall -q scripts
      - name: Verify complete live suppression with anonymous summary
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import sys
          from registry_readonly import load_suppressions
          try:
              rows = load_suppressions()
              if len(rows) < 2:
                  raise RuntimeError("incomplete")
              print("FRESH_LEADS_PREFLIGHT=green")
          except Exception:
              print("FRESH_LEADS_PREFLIGHT=red")
              sys.exit(1)
          PY

  discover:
    needs: test
    if: >-
      always() && !cancelled() &&
      (needs.test.result == 'success' ||
       ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.test.result == 'skipped')) &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule') ||
       (github.event_name == 'workflow_dispatch' && contains(fromJSON('["discover","fill_100"]'), inputs.execution_mode)) ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LEADS_DISCOVERY_ONLY:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: leads-private-candidates
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m compileall -q scripts
      - name: Discover and transfer to private Leads sheet; log counts only
        env:
          PYTHONPATH: scripts
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXECUTION_MODE: ${{ github.event_name == 'schedule' && 'fill_100' || inputs.execution_mode }}
          REGION: ${{ github.event_name == 'schedule' && 'Nederland' || inputs.region }}
          KEYWORDS: ${{ github.event_name == 'schedule' && 'vakbedrijven' || inputs.keywords }}
          RADIUS: ${{ github.event_name == 'schedule' && '25' || inputs.radius_km }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$EXECUTION_MODE" = "fill_100" ]; then
            python3 scripts/verified_fill.py
          else
            python3 scripts/trigger_request.py
          fi
