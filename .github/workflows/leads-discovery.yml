name: Leads Discovery Only

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Komma- of newlinegescheiden plaatsen/regio’s'
        required: true
        type: string
      keywords:
        description: 'Komma- of newlinegescheiden branches/zoektermen'
        required: true
        type: string
      target_candidates:
        description: 'Doel aantal unieke kandidaten (1-5000)'
        required: true
        default: '500'
        type: string
      radius_km:
        description: 'Overture zoekstraal per regio in km (0.5-50)'
        required: true
        default: '12'
        type: string
      maps_depth:
        description: 'Google Maps diepte (1-10)'
        required: true
        default: '2'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: leads-discovery-only
  cancel-in-progress: false

jobs:
  discovery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[lead-discovery]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-discovery.txt

      - name: Install discovery dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-discovery.txt

      - name: Resolve and validate discovery request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_REGIONS: ${{ inputs.regions }}
          INPUT_KEYWORDS: ${{ inputs.keywords }}
          INPUT_TARGET: ${{ inputs.target_candidates }}
          INPUT_RADIUS_KM: ${{ inputs.radius_km }}
          INPUT_MAPS_DEPTH: ${{ inputs.maps_depth }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import re
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "issues":
              event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
              try:
                  request = json.loads(event["issue"].get("body") or "{}")
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"issue body must be JSON: {exc}")
          else:
              request = {
                  "regions": os.environ["INPUT_REGIONS"],
                  "keywords": os.environ["INPUT_KEYWORDS"],
                  "target_candidates": os.environ["INPUT_TARGET"],
                  "radius_km": os.environ["INPUT_RADIUS_KM"],
                  "maps_depth": os.environ["INPUT_MAPS_DEPTH"],
              }

          def clean_list(value, *, label, maximum):
              if isinstance(value, str):
                  items = [item.strip() for item in re.split(r"[,\n]+", value) if item.strip()]
              elif isinstance(value, list):
                  items = [str(item).strip() for item in value if str(item).strip()]
              else:
                  raise SystemExit(f"{label} must be a string or list")
              deduped = []
              seen = set()
              for item in items:
                  key = item.casefold()
                  if key not in seen:
                      seen.add(key)
                      deduped.append(item)
              if not 1 <= len(deduped) <= maximum:
                  raise SystemExit(f"{label} must contain 1-{maximum} unique values")
              if any(len(item) > 120 for item in deduped):
                  raise SystemExit(f"{label} values must be <=120 characters")
              return deduped

          regions = clean_list(
              request.get("regions") or request.get("region") or [],
              label="regions",
              maximum=20,
          )
          keywords = clean_list(
              request.get("keywords") or [],
              label="keywords",
              maximum=100,
          )
          target = int(request.get("target_candidates") or 500)
          radius = float(request.get("radius_km") or 12)
          maps_depth = int(request.get("maps_depth") or 2)

          if not 1 <= target <= 5000:
              raise SystemExit("target_candidates must be 1-5000")
          if not 0.5 <= radius <= 50:
              raise SystemExit("radius_km must be 0.5-50")
          if not 1 <= maps_depth <= 10:
              raise SystemExit("maps_depth must be 1-10")

          per_region_target = min(
              5000,
              max(50, math.ceil(target / len(regions) * 2)),
          )

          Path("results/overture").mkdir(parents=True, exist_ok=True)
          Path("results/google-maps").mkdir(parents=True, exist_ok=True)
          Path("results/regions.json").write_text(
              json.dumps(regions, ensure_ascii=False),
              encoding="utf-8",
          )
          Path("results/keywords.json").write_text(
              json.dumps(keywords, ensure_ascii=False),
              encoding="utf-8",
          )
          Path("results/google-maps-queries.txt").write_text(
              "".join(
                  f"{keyword} {region}\n"
                  for region in regions
                  for keyword in keywords
              ),
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"target={target}\n")
              out.write(f"radius={radius}\n")
              out.write(f"maps_depth={maps_depth}\n")
              out.write(f"per_region_target={per_region_target}\n")
              out.write(f"region_count={len(regions)}\n")
              out.write(f"keyword_count={len(keywords)}\n")

          print(
              "DISCOVERY_REQUEST=green "
              f"regions={len(regions)} keywords={len(keywords)} "
              f"target={target} per_region_target={per_region_target}"
          )
          PY

      - name: Overture and PDOK discovery
        env:
          PYTHONPATH: scripts
          TARGET_PER_REGION: ${{ steps.request.outputs.per_region_target }}
          RADIUS_KM: ${{ steps.request.outputs.radius }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          regions = json.loads(Path("results/regions.json").read_text(encoding="utf-8"))
          keywords = json.loads(Path("results/keywords.json").read_text(encoding="utf-8"))
          target = os.environ["TARGET_PER_REGION"]
          radius = os.environ["RADIUS_KM"]

          for index, region in enumerate(regions, start=1):
              args = [
                  "python3",
                  "scripts/overture_discovery.py",
                  "--region",
                  region,
                  "--radius-km",
                  radius,
                  "--max-results",
                  target,
                  "--require-website",
                  "--output",
                  f"results/overture/region-{index}.json",
              ]
              for keyword in keywords:
                  args.extend(["--keyword", keyword])
              subprocess.run(args, check=True)
          PY

      - name: Aggregate Overture candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          candidates = []
          region_runs = []
          for path in sorted(Path("results/overture").glob("region-*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              candidates.extend(payload.get("candidates") or [])
              region_runs.append(
                  {
                      "file": path.name,
                      "candidate_count": int(payload.get("candidate_count") or 0),
                      "region_resolution": payload.get("region_resolution"),
                  }
              )

          result = {
              "schema_version": "webactueel-overture-aggregate/1.0",
              "source": "Overture Maps Places + PDOK",
              "candidate_count": len(candidates),
              "region_runs": region_runs,
              "candidates": candidates,
          }
          Path("results/overture-all.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"OVERTURE_AGGREGATE=green candidates={len(candidates)}")
          PY

      - name: Google Maps discovery
        env:
          MAPS_DEPTH: ${{ steps.request.outputs.maps_depth }}
        run: |
          set -euo pipefail
          docker pull gosom/google-maps-scraper:v1.18.1
          docker run --rm \
            -v "$PWD/results/google-maps-queries.txt:/queries.txt:ro" \
            -v "$PWD/results/google-maps:/out" \
            gosom/google-maps-scraper:v1.18.1 \
            -input /queries.txt \
            -results /out/results.csv \
            -depth "$MAPS_DEPTH" \
            -exit-on-inactivity 3m

      - name: Merge and deduplicate discovery sources
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          python3 scripts/hybrid_discovery.py \
            --overture results/overture-all.json \
            --google-maps-csv results/google-maps/results.csv \
            --output results/hybrid-discovery.json \
            --max-results "$TARGET" \
            --require-website

      - name: Filter discovery-level competitors
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/filter_discovery_candidates.py \
            --input results/hybrid-discovery.json \
            --output results/phase2-discovery.json

      - name: Prove discovery-only boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/phase2-discovery.json").read_text(encoding="utf-8"))
          safety = report.get("safety") or {}
          required_false = (
              "verification_performed",
              "contact_basis_evaluated",
              "copy_created",
              "draft_created",
              "email_send",
              "email_candidates_in_final_output",
          )
          for key in required_false:
              if safety.get(key) is not False:
                  raise SystemExit(f"discovery-only safety boundary failed: {key}")
          print("DISCOVERY_ONLY_BOUNDARY=green")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-discovery-${{ github.run_number }}
          path: |
            results/phase2-discovery.json
            results/hybrid-discovery.json
          if-no-files-found: error
          retention-days: 1
