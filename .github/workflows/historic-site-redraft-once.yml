name: Temporary historic site re-review (12 bounded batches, no send)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, '[historical-site-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Synthetic regression suite
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -q
  audit:
    if: contains(github.event.head_commit.message, '[historical-site-audit]')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Re-visit official sites, contacts and four-to-six findings
        env:
          PYTHONPATH: scripts
          OFFSET: ${{ matrix.offset }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_site_redraft.py --offset "$OFFSET" --mode audit
