name: Private one-time Mijn.Host Drafts archive

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: leadscanner-private-original-drafts-archive
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && github.repository == 'Yolol100/Leadscanner'
          && github.event.issue.number == 1782
          && !github.event.issue.pull_request
          && github.event.comment.user.login == 'Yolol100'
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.body == 'LEADS_PRIVATE_ARCHIVE_V1:CREATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Archive existing drafts without sending or modifying mailbox
        env:
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_DRIVE_ARCHIVE_FILE_ID: 19cDdR2yHJvGN3EWCc4MGM7hjCSQVgiuw
          OUTREACH_DRIVE_ARCHIVE_FOLDER_ID: 1zF7wPFj3Dhduv9dY-gBic5TS3RqMiUbN
        run: |
          PYTHONPATH=scripts python3 scripts/archive_myhost_drafts_to_drive.py
