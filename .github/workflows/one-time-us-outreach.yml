name: One-time US Outreach Dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-us-outreach.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: one-time-us-outreach-2026-09-08
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install outreach runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Resolve one-time mode
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          run=false
          mode=validate
          local_date="$(TZ=Europe/Amsterdam date +%F)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$local_date" = "2026-09-08" ]; then
            run=true
            mode=live
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "ONE_TIME_DISPATCH_PLAN run=${run} mode=${mode} local_date=${local_date}"

      - name: Guard exact US campaign cohort
        if: steps.plan.outputs.run == 'true'
        env:
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_ONE_TIME_EXPECTED_LEADS: >-
            prospect-8b27a02ebd2e038890e3,prospect-2faf8c72b098cf705738,prospect-2ec02fcea879e3646bff,
            manual-20260907-ntma-018,manual-20260907-ntma-007,manual-20260907-ntma-015,manual-20260907-stark-019,manual-20260907-stark-021,
            manual-20260907-us50-009,manual-20260907-us50-010,manual-20260907-us50-011,manual-20260907-us50-012,manual-20260907-us50-013,manual-20260907-us50-014,manual-20260907-us50-015,manual-20260907-us50-016,manual-20260907-us50-017,manual-20260907-us50-018,manual-20260907-us50-019,manual-20260907-us50-020,
            manual-20260907-us50-021,manual-20260907-us50-022,manual-20260907-us50-023,manual-20260907-us50-024,manual-20260907-us50-025,manual-20260907-us50-026,manual-20260907-us50-027,manual-20260907-us50-028,manual-20260907-us50-029,manual-20260907-us50-030,
            manual-20260907-us50-031,manual-20260907-us50-032,manual-20260907-us50-033,manual-20260907-us50-034,manual-20260907-us50-035,manual-20260907-us50-036,manual-20260907-us50-037,manual-20260907-us50-038,manual-20260907-us50-039,manual-20260907-us50-040,
            manual-20260907-us50-041,manual-20260907-us50-042,manual-20260907-us50-043,manual-20260907-us50-044,manual-20260907-us50-045,manual-20260907-us50-046,manual-20260907-us50-047,manual-20260907-us50-048,manual-20260907-us50-049,manual-20260907-us50-050
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_one_time_us_guard.py

      - name: Dispatch existing controlled outreach workflow
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.plan.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"main","inputs":{"mode":"%s"}}' "$MODE")
          status=$(curl -sS -L -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/outreach-smtp.yml/dispatches" \
            -d "$payload")
          if [ "$status" != "200" ] && [ "$status" != "204" ]; then
            echo "::error::Controlled outreach dispatch failed with HTTP ${status}."
            cat /tmp/dispatch-response.json
            exit 1
          fi
          echo "CONTROLLED_OUTREACH_DISPATCH=accepted mode=${MODE}"

      - name: Confirm inert state outside the one-time date
        if: steps.plan.outputs.run != 'true'
        run: echo 'ONE_TIME_US_OUTREACH=inert date_guard=green'

# operational-round: 2-2026-09-08
