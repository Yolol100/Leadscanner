name: Temporary Phase34 audit branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Delete exact merged audit branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: "fix/phase34-header-crlf-20260920"
          EXPECTED_SHA: "2e951e2fca8bc55a53d5842602c47aa7a580f427"
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$actual" = "$EXPECTED_SHA"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TARGET_BRANCH"
