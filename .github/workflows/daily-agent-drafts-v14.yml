name: Daily Draft-First Agent Leads

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate or create review-only drafts
        required: true
        default: validate
        type: choice
        options: [validate, create]
      country:
        description: Canonical country
        required: true
        default: US
        type: string
      target:
        description: Number of review drafts, max 50
        required: true
        default: '50'
        type: string
      run_key:
        description: Stable idempotency key
        required: true
        default: manual
        type: string
      source_set_version:
        description: Exact Project Leads source contract
        required: true
        default: 14.0.0-draft-first
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-draft-first-agent-leads
  cancel-in-progress: false

jobs:
  draft-first:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Yolol100' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issues' && github.actor == 'Yolol100' && github.event.issue.title == 'CREATE DRAFT FIRST LEADS' && contains(github.event.issue.body, 'COMMAND=CREATE_DRAFT_FIRST_LEADS'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SOURCE_SET_VERSION: 14.0.0-draft-first
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_WEBSITE: ${{ vars.OUTREACH_SENDER_WEBSITE || 'andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '50'
      AGENT_SALES_TARGET_TYPE: auto
      PROSPECT_DISCOVERY_MAX_TOTAL: '200'
      PROSPECT_DISCOVERY_TARGET_NEW: '150'
      PROSPECT_SIGNAL_MAX_CANDIDATES: '25'
      PROSPECT_QUALIFICATION_MAX_PER_RUN: '25'
      CONTACT_ENRICHMENT_MAX_PER_RUN: '25'
      OUTREACH_PREPARE_MAX_PER_RUN: '50'
      OUTREACH_CTA_VARIANT: 'A'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse command and pin source contract
        id: command
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_COUNTRY: ${{ inputs.country }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          INPUT_SOURCE_SET_VERSION: ${{ inputs.source_set_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
            one(){ mapfile -t x < <(printf '%s\n' "$body" | sed -n "s/^$1=//p"); [ "${#x[@]}" -eq 1 ] && [ -n "${x[0]}" ] || { echo "BLOCKED_COMMAND_FIELD field=$1"; exit 2; }; printf '%s' "${x[0]}"; }
            mode="$(one MODE)"
            country="$(one COUNTRY)"
            target="$(one TARGET)"
            run_key="$(one RUN_KEY)"
            source_set_version="$(one SOURCE_SET_VERSION)"
          else
            mode="$INPUT_MODE"
            country="$INPUT_COUNTRY"
            target="$INPUT_TARGET"
            run_key="$INPUT_RUN_KEY"
            source_set_version="$INPUT_SOURCE_SET_VERSION"
          fi
          case "$mode" in validate|create) ;; *) echo "BLOCKED_MODE"; exit 2;; esac
          [[ "$country" =~ ^[A-Z]{2}$ ]] || { echo "BLOCKED_COUNTRY"; exit 2; }
          [[ "$target" =~ ^[0-9]+$ ]] && [ "$target" -ge 1 ] && [ "$target" -le 50 ] || { echo "BLOCKED_TARGET"; exit 2; }
          [[ "$run_key" =~ ^[A-Za-z0-9._:-]{1,80}$ ]] || { echo "BLOCKED_RUN_KEY"; exit 2; }
          [ "$source_set_version" = "$EXPECTED_SOURCE_SET_VERSION" ] || { echo "BLOCKED_SOURCE_SET_DRIFT got=$source_set_version expected=$EXPECTED_SOURCE_SET_VERSION"; exit 2; }
          printf 'mode=%s\ncountry=%s\ntarget=%s\nrun_key=%s\nsource_set_version=%s\n' "$mode" "$country" "$target" "$run_key" "$source_set_version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SET_VERSION=$source_set_version"

      - name: Run v14 scenario audit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_draft_first_v14*.py' -v |& tee v14-test.log
          echo 'DRAFT_FIRST_SCENARIO_AUDIT=green smtp_send=not_invoked'

      - name: Validate only
        if: steps.command.outputs.mode == 'validate'
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          python3 scripts/outreach_daily_draft_first_retry.py --count-only --target '${{ steps.command.outputs.target }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}'
          echo 'DRAFT_FIRST_ROUTE_VALIDATE=green mailbox_write=not_invoked smtp_send=not_invoked'

      - name: Require draft credentials
        if: steps.command.outputs.mode == 'create'
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          test -n "${OUTREACH_MAIL_PASSWORD:-}"
          python3 scripts/outreach_private_config.py

      - name: Refill review-ready drafts
        if: steps.command.outputs.mode == 'create'
        env:
          PROSPECT_DISCOVERY_MODE: discover
          PROSPECT_QUALIFICATION_MODE: qualify
          CONTACT_ENRICHMENT_MODE: discover
          DAILY_DRAFT_COUNTRY: ${{ steps.command.outputs.country }}
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: ${{ steps.command.outputs.country }}
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.command.outputs.target }}'
          mkdir -p daily-evidence
          previous=-1
          no_progress=0
          ready=0
          for cycle in $(seq 1 12); do
            out="$(python3 scripts/outreach_daily_draft_first_retry.py --count-only --target "$target" --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-evidence/ready-before-$cycle.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DRAFT_FIRST_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            test -n "$ready"
            [ "$ready" -ge "$target" ] && break

            # Use already-qualified/contact-proven unqueued stock before paying the
            # discovery cost. This preserves every v14 gate and only fills the shortfall.
            python3 scripts/outreach_draft_first_prepare_retry.py | tee "daily-evidence/prepare-stock-$cycle.log"
            out="$(python3 scripts/outreach_daily_draft_first_retry.py --count-only --target "$target" --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-evidence/ready-stock-$cycle.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DRAFT_FIRST_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            test -n "$ready"
            [ "$ready" -ge "$target" ] && break

            python3 scripts/prospect_discovery_retry_runtime.py --mode discover --report "daily-evidence/discovery-$cycle.json"
            python3 scripts/prospect_candidate_sanitizer.py | tee "daily-evidence/sanitizer-$cycle.log"
            python3 scripts/prospect_signal_discovery_runtime.py --mode discover --report "daily-evidence/signal-$cycle.json"
            python3 scripts/prospect_agent_qualification_draft_first.py --mode qualify --report "daily-evidence/qualification-$cycle.json"
            python3 scripts/prospect_contact_enrichment_draft_first.py | tee "daily-evidence/contact-$cycle.log"
            python3 scripts/outreach_draft_first_prepare_retry.py | tee "daily-evidence/prepare-$cycle.log"

            out="$(python3 scripts/outreach_daily_draft_first_retry.py --count-only --target "$target" --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-evidence/ready-after-$cycle.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DRAFT_FIRST_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            test -n "$ready"
            [ "$ready" -ge "$target" ] && break
            if [ "$ready" -le "$previous" ]; then no_progress=$((no_progress+1)); else no_progress=0; fi
            previous="$ready"
            [ "$no_progress" -lt 4 ] || { echo "BLOCKED_DRAFT_FIRST_NO_PROGRESS ready=$ready target=$target"; exit 3; }
          done
          [ "$ready" -ge "$target" ] || { echo "BLOCKED_DRAFT_FIRST_TARGET ready=$ready target=$target"; exit 3; }
          echo "DRAFT_FIRST_REFILL=green ready=$ready target=$target"

      - name: Create IMAP review drafts
        if: steps.command.outputs.mode == 'create'
        run: |
          set -euo pipefail
          python3 scripts/outreach_daily_draft_first_retry.py --target '${{ steps.command.outputs.target }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}' | tee daily-draft-run.log
          grep -q '^DRAFT_FIRST_DRAFTS=green .*smtp_send=not_invoked$' daily-draft-run.log

      - name: Audit exact closure
        if: steps.command.outputs.mode == 'create'
        env:
          TARGET: ${{ steps.command.outputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          target = int(os.environ['TARGET'])
          selection = json.load(open('daily-draft-selection.json', encoding='utf-8'))
          receipts = json.load(open('daily-draft-receipts.json', encoding='utf-8'))
          selected = selection['selected']
          assert len(selected) == target
          assert len(receipts) == target
          selected_ids = {x['lead_id'] for x in selected}
          receipt_ids = {x['lead_id'] for x in receipts}
          assert len(selected_ids) == target
          assert receipt_ids == selected_ids
          assert len({x['website_host'] for x in selected}) == target
          assert len({x['email'] for x in selected}) == target
          assert len({x['test_id'] for x in receipts}) == target
          assert all(x['readback_count'] == 1 for x in receipts)
          assert all(x['action'] in {'appended', 'existing'} for x in receipts)
          assert selection['send_permission'] == 'none'
          assert selection['smtp_send'] == 'not_invoked'
          print(f'DRAFT_FIRST_CLOSURE=green target={target} readback=1 receipt_match=1 smtp_send=not_invoked')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-first-agent-leads-${{ github.run_id }}
          path: |
            v14-test.log
            daily-evidence/
            daily-draft-selection.json
            daily-draft-receipts.json
            daily-draft-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report issue result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SET_VERSION: ${{ steps.command.outputs.source_set_version }}
        run: |
          set -euo pipefail
          [ "$JOB_STATUS" = success ] && result=green || result=blocked
          version="${SOURCE_SET_VERSION:-unverified}"
          body="DRAFT_FIRST_LEADS=$result\nSOURCE_SET_VERSION=$version\nTRANSPORT=IMAP_DRAFT_ONLY\nSMTP_SEND=not_invoked"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
