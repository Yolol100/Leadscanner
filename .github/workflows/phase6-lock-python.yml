name: Phase 6 one-shot Python lock

on:
  push:
    branches:
      - chore/phase6-python-lock-20260912
    paths:
      - .github/workflows/phase6-lock-python.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate hash-locked outreach dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cp requirements-outreach.txt requirements-outreach.in
          python3 -m pip install --disable-pip-version-check 'pip-tools==7.6.1'
          python3 -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements-outreach.txt \
            requirements-outreach.in
          cp requirements-outreach.txt /tmp/requirements-outreach.first.txt
          python3 -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements-outreach.txt \
            requirements-outreach.in
          cmp /tmp/requirements-outreach.first.txt requirements-outreach.txt
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-outreach.txt
          python3 -m pip check
          cat > DEPENDENCY-LOCKS.md <<'EOF'
          # Dependency locks

          `requirements-outreach.in` is the human-maintained Python outreach input.
          `requirements-outreach.txt` is the generated Python 3.12 lock used by CI/runtime and includes transitive pins plus hashes.

          Regenerate on Ubuntu 24.04 with Python 3.12 and pip-tools 7.6.1:

          ```bash
          python3 -m pip install 'pip-tools==7.6.1'
          python3 -m piptools compile --generate-hashes --resolver=backtracking --output-file requirements-outreach.txt requirements-outreach.in
          python3 -m pip install --require-hashes -r requirements-outreach.txt
          python3 -m pip check
          ```

          A reviewed lock refresh must preserve the existing CI mail-secret boundary and `pip-audit` gate.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/leads-runtime-ci.yml')
          text=path.read_text(encoding='utf-8')
          text=text.replace("      - 'requirements-outreach.txt'\n", "      - 'requirements-outreach.in'\n      - 'requirements-outreach.txt'\n      - 'DEPENDENCY-LOCKS.md'\n")
          text=text.replace('python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt', 'python3 -m pip install --disable-pip-version-check --require-hashes --requirement requirements-outreach.txt')
          path.write_text(text, encoding='utf-8')
          PY
          grep -q -- '--require-hashes --requirement requirements-outreach.txt' .github/workflows/leads-runtime-ci.yml
          git rm .github/workflows/phase6-lock-python.yml
          git config user.name 'webactueel-phase6'
          git config user.email 'actions@users.noreply.github.com'
          git add requirements-outreach.in requirements-outreach.txt DEPENDENCY-LOCKS.md .github/workflows/leads-runtime-ci.yml
          git commit -m 'Lock Python outreach dependencies with hashes'
          git push origin HEAD
