name: Temporary Self-only Inbox Placement

on:
  push:
    branches:
      - ops/leads-live-proof-20260905
    paths:
      - ops/self-placement-request.txt

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt
      - name: Run one self-only placement probe
        env:
          OUTREACH_PLACEMENT_MODE: 'test'
          OUTREACH_PLACEMENT_TEST_ENABLED: 'true'
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: ${{ vars.OUTREACH_DAILY_LIMIT || '20' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_PLACEMENT_POLL_SECONDS: '5'
          OUTREACH_PLACEMENT_MAX_WAIT_SECONDS: '60'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import json, os
          os.environ['OUTREACH_SEED_INBOXES_JSON'] = json.dumps([{
              'seed_id': 'self-primary',
              'email': os.environ['OUTREACH_SENDER_EMAIL'],
              'imap_host': os.environ['OUTREACH_IMAP_HOST'],
              'imap_port': int(os.environ['OUTREACH_IMAP_PORT']),
              'username': os.environ['OUTREACH_MAIL_USER'],
              'password': os.environ['OUTREACH_MAIL_PASSWORD'],
              'spam_folders': ['Junk', 'Spam']
          }])
          from outreach_inbox_placement import main
          raise SystemExit(main())
          PY
