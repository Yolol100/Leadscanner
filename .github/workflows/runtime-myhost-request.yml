name: Queue mijn.host draft runtime request

on:
  create:

permissions:
  contents: read

jobs:
  validate-runtime-request:
    if: ${{ github.event.ref_type == 'branch' && startsWith(github.event.ref, 'runtime/myhost-draft/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate runtime branch
        env:
          RUNTIME_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/runtime_branch.py --branch "$RUNTIME_BRANCH" >/dev/null
          echo 'RUNTIME_DRAFT_REQUEST=green'
