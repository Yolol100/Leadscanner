name: Current 450 Drafts - verified targeted replacement
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  reconcile:
    if: >-
      github.event.issue.number == 1659 &&
      github.actor == 'Yolol100' &&
      github.event.comment.body == 'LEADS_450_RECONCILE_ONLY: review450-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Reconciliation safety tests (no credentials)
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_reconcile450_current.py' -q
          python3 -m unittest discover -s tests -p 'test_replace450_workflow_guard.py' -q
      - name: Verify new drafts before exact old-UID cleanup
        env:
          PYTHONPATH: scripts
          MAILBOX450_UPGRADE_TASK: review450-20261016
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/reconcile450_current.py
