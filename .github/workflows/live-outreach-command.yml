name: Guarded Live Outreach Command

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: guarded-live-outreach-command
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'LIVE OUTREACH 2026-09-08 50 US' &&
      contains(github.event.issue.body, 'COMMAND=LIVE_US_INITIALS') &&
      contains(github.event.issue.body, 'TARGET=50') &&
      contains(github.event.issue.body, 'COUNTRY=US')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout controller helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install readback dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Serialize live transport to proven target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          state() {
            python3 scripts/outreach_campaign_state.py \
              --spreadsheet-id "${OUTREACH_SPREADSHEET_ID}" \
              --country US \
              --timezone Europe/Amsterdam
          }

          # Remove only stale duplicate dispatches that have not started. Never
          # cancel an in-progress sender run and never touch non-dispatch runs.
          runs_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
            "${api}/actions/workflows/outreach-smtp.yml/runs?event=workflow_dispatch&per_page=100")"
          mapfile -t stale_ids < <(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.status == "queued" or .status == "pending") | .id')
          for rid in "${stale_ids[@]:-}"; do
            [ -n "$rid" ] || continue
            curl --fail-with-body --silent --show-error -X POST "${headers[@]}" "${api}/actions/runs/${rid}/cancel" >/dev/null || true
            echo "CANCELLED_STALE_PENDING_RUN=${rid}"
          done

          # If a genuine live transport is already running, let that protected
          # run finish and count its provider-proven result before doing anything else.
          for _ in $(seq 1 180); do
            active="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/outreach-smtp.yml/runs?event=workflow_dispatch&status=in_progress&per_page=20" \
              | jq '.total_count')"
            [ "$active" -eq 0 ] && break
            sleep 10
          done

          current_json="$(state)"
          sent="$(printf '%s\n' "$current_json" | head -n1 | jq -r '.sent_today')"
          approved="$(printf '%s\n' "$current_json" | head -n1 | jq -r '.approved_country')"
          echo "START_PROVEN_US_INITIALS=${sent}"
          echo "START_APPROVED_US=${approved}"

          if [ "$sent" -ge 50 ]; then
            echo "TARGET_ALREADY_REACHED=50"
            exit 0
          fi

          for iteration in $(seq 1 50); do
            if [ "$approved" -le 0 ]; then
              echo "::error::No approved US rows remain before the proven daily target was reached."
              exit 4
            fi

            before_latest="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
              "${api}/actions/workflows/outreach-smtp.yml/runs?event=workflow_dispatch&per_page=1" \
              | jq -r '.workflow_runs[0].id // 0')"

            curl --fail-with-body --silent --show-error -X POST "${headers[@]}" \
              "${api}/actions/workflows/outreach-smtp.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"live"}}' >/dev/null
            echo "DISPATCHED_SERIAL_LIVE_ITERATION=${iteration}"

            run_id=""
            for _ in $(seq 1 60); do
              candidate="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
                "${api}/actions/workflows/outreach-smtp.yml/runs?event=workflow_dispatch&per_page=5" \
                | jq -r --argjson before "$before_latest" '[.workflow_runs[] | select(.id > $before)] | sort_by(.id) | last | .id // empty')"
              if [ -n "$candidate" ]; then
                run_id="$candidate"
                break
              fi
              sleep 2
            done
            if [ -z "$run_id" ]; then
              echo "::error::Could not resolve the dispatched outreach run id."
              exit 5
            fi
            echo "SERIAL_LIVE_RUN_ID=${run_id}"

            conclusion=""
            for _ in $(seq 1 180); do
              run_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}")"
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              if [ "$status" = "completed" ]; then
                conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
                break
              fi
              sleep 10
            done
            if [ "$conclusion" != "success" ]; then
              echo "::error::Protected live transport run ${run_id} ended with conclusion=${conclusion:-timeout}."
              exit 6
            fi

            after_json="$(state)"
            after="$(printf '%s\n' "$after_json" | head -n1 | jq -r '.sent_today')"
            approved="$(printf '%s\n' "$after_json" | head -n1 | jq -r '.approved_country')"
            echo "PROVEN_US_INITIALS_AFTER_RUN=${after}"
            echo "APPROVED_US_REMAINING=${approved}"

            if [ "$after" -ge 50 ]; then
              echo "PROVEN_TARGET_REACHED=50"
              exit 0
            fi
            if [ "$after" -le "$sent" ]; then
              echo "::error::Live run succeeded but produced no new provider-proven US initial send; refusing an unbounded retry loop."
              exit 7
            fi
            sent="$after"
          done

          echo "::error::Serial controller exhausted its bounded iterations below target."
          exit 8

      - name: Record controller scope
        if: always()
        shell: bash
        run: |
          echo "LIVE_COMMAND_SCOPE=US_INITIALS_ONLY"
          echo "REQUESTED_TARGET=50"
          echo "TRANSPORT_WORKFLOW=outreach-smtp.yml"
          echo "TRANSPORT_GATES=UNCHANGED"
          echo "PROGRESS_PROOF=OutreachQueue sent_at + message_id"
