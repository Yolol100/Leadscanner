name: Guarded Live Outreach Command

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: guarded-live-outreach-command
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'LIVE OUTREACH 2026-09-08 50 US' &&
      contains(github.event.issue.body, 'COMMAND=LIVE_US_INITIALS') &&
      contains(github.event.issue.body, 'TARGET=50') &&
      contains(github.event.issue.body, 'COUNTRY=US')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch bounded live outreach runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The transport workflow remains the sole sender. It rechecks sender
          # readiness, website evidence, LeadPromo copy, compliance, suppression,
          # mailbox pacing, per-run cap and daily cap on every run.
          for i in $(seq 1 25); do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/outreach-smtp.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"live"}}'
            echo "DISPATCHED_LIVE_RUN=${i}"
            sleep 2
          done

      - name: Record dispatcher scope
        shell: bash
        run: |
          set -euo pipefail
          echo "LIVE_COMMAND_SCOPE=US_INITIALS_ONLY"
          echo "REQUESTED_TARGET=50"
          echo "TRANSPORT_GATES=UNCHANGED"
