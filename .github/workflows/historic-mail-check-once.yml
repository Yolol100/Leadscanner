name: Temporary historical email QA (no-send, delete after proof)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, '[historic-mail-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt
      - env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

  audit:
    if: contains(github.event.head_commit.message, '[historic-mail-check]')
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        offset: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt 'google-auth>=2,<3'
      - name: Private, read-only, aggregate-only historical mail check
        env:
          PYTHONPATH: scripts
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OFFSET: ${{ matrix.offset }}
        run: |
          set -euo pipefail
          python3 scripts/_once_historical_mail_checks.py --offset "$OFFSET"
