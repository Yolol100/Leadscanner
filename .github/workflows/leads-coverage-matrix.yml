name: Leadscanner Coverage Matrix Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/coverage-matrix.json'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-cold.txt
      - name: Benchmark Overture candidate supply
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from overture_discovery import (
              bbox_from_center,
              download_overture_places,
              inspect_download,
              read_candidates,
              resolve_region_center,
          )

          cfg = json.loads(Path('.github/coverage-matrix.json').read_text(encoding='utf-8'))
          region = cfg['region']
          radius = float(cfg['radius_km'])
          target = int(cfg['target_candidates'])
          verify = int(cfg['verify_limit'])
          keywords = list(cfg['keywords'])
          resolved = resolve_region_center(region)
          bbox = bbox_from_center(resolved['lon'], resolved['lat'], radius)

          with tempfile.TemporaryDirectory(prefix='coverage-matrix-') as tmp:
              path = Path(tmp) / 'places.geojsonseq'
              download_overture_places(bbox, path)
              diagnostics = inspect_download(path)
              rows = []
              for keyword in keywords:
                  candidates = read_candidates(
                      path,
                      keywords=[keyword],
                      max_results=target,
                      require_website=True,
                  )
                  count = len(candidates)
                  if count >= verify * 2:
                      status = 'sufficient_buffer'
                  elif count >= verify:
                      status = 'sufficient'
                  elif count >= max(5, (verify + 1) // 2):
                      status = 'thin'
                  else:
                      status = 'gap'
                  rows.append({
                      'keyword': keyword,
                      'candidate_count': count,
                      'hit_target_cap': count >= target,
                      'status': status,
                  })

          result = {
              'schema_version': 'leadscanner-overture-coverage-matrix/1.0',
              'region': region,
              'radius_km': radius,
              'target_candidates': target,
              'verify_limit': verify,
              'download_diagnostics': diagnostics,
              'rows': rows,
              'gap_count': sum(1 for row in rows if row['status'] == 'gap'),
              'thin_count': sum(1 for row in rows if row['status'] == 'thin'),
              'second_source_decision': (
                  'second_source_not_needed'
                  if all(row['status'] in {'sufficient', 'sufficient_buffer'} for row in rows)
                  else 'investigate_repeated_gaps_before_second_source'
              ),
          }
          Path('results/coverage-matrix.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print('COVERAGE_MATRIX=' + json.dumps({
              'rows': rows,
              'gap_count': result['gap_count'],
              'thin_count': result['thin_count'],
              'decision': result['second_source_decision'],
          }, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadscanner-coverage-matrix-${{ github.run_id }}
          path: results/coverage-matrix.json
          if-no-files-found: error
          retention-days: 1
