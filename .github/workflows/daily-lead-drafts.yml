name: Daily Leads to mijn.host Drafts

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate or create a bounded draft batch
        required: true
        default: validate
        type: choice
        options: [validate, create]
      agent_type:
        description: One explicit campaign agent
        required: true
        default: quote_intake
        type: choice
        options: [front_desk_sales, quote_intake, review_concierge, customer_support, commerce]
      country:
        description: Canonical campaign country
        required: true
        default: US
        type: string
      target:
        description: Maximum new drafts, hard capped at 50
        required: true
        default: '50'
        type: string
      run_key:
        description: Stable audit key such as 2026-09-10
        required: true
        default: manual
        type: string
      source_set_version:
        description: Live Project Leads source-set version read by the controller
        required: true
        default: manual-validate
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-leads-myhost-drafts
  cancel-in-progress: false

jobs:
  daily-drafts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'Yolol100' &&
       github.event.issue.title == 'CREATE DAILY LEAD DRAFTS' &&
       contains(github.event.issue.body, 'COMMAND=CREATE_DAILY_LEAD_DRAFTS'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_WEBSITE: ${{ vars.OUTREACH_SENDER_WEBSITE || 'andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '50'
      PROSPECT_DISCOVERY_MAX_TOTAL: '200'
      PROSPECT_SIGNAL_MAX_CANDIDATES: '25'
      PROSPECT_QUALIFICATION_MAX_PER_RUN: '25'
      CONTACT_ENRICHMENT_MAX_PER_RUN: '25'
      PROSPECT_INTELLIGENCE_MAX_TARGETS: '25'
      OUTREACH_PREPARE_MAX_PER_RUN: '25'
      OUTREACH_CTA_VARIANT: 'A'

    steps:
      - name: Checkout exact default-branch runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse bounded command
        id: command
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_AGENT_TYPE: ${{ inputs.agent_type }}
          INPUT_COUNTRY: ${{ inputs.country }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          INPUT_SOURCE_SET_VERSION: ${{ inputs.source_set_version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'issues' ]; then
            body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
            one() {
              local key="$1"
              mapfile -t lines < <(printf '%s\n' "$body" | sed -n "s/^${key}=//p")
              if [ "${#lines[@]}" -ne 1 ] || [ -z "${lines[0]}" ]; then
                echo "Expected exactly one ${key}= line." >&2
                exit 2
              fi
              printf '%s' "${lines[0]}"
            }
            mode="$(one MODE)"
            agent="$(one AGENT_TYPE)"
            country="$(one COUNTRY)"
            target="$(one TARGET)"
            run_key="$(one RUN_KEY)"
            source_set="$(one SOURCE_SET_VERSION)"
          else
            mode="$INPUT_MODE"
            agent="$INPUT_AGENT_TYPE"
            country="$INPUT_COUNTRY"
            target="$INPUT_TARGET"
            run_key="$INPUT_RUN_KEY"
            source_set="$INPUT_SOURCE_SET_VERSION"
          fi

          case "$mode" in validate|create) ;; *) echo 'MODE must be validate or create' >&2; exit 2 ;; esac
          case "$agent" in front_desk_sales|quote_intake|review_concierge|customer_support|commerce) ;; *) echo 'Unsupported AGENT_TYPE' >&2; exit 2 ;; esac
          if ! [[ "$country" =~ ^[A-Z]{2}$ ]]; then echo 'COUNTRY must be a two-letter canonical code' >&2; exit 2; fi
          if ! [[ "$target" =~ ^[0-9]+$ ]] || [ "$target" -lt 1 ] || [ "$target" -gt 50 ]; then echo 'TARGET must be 1..50' >&2; exit 2; fi
          if ! [[ "$run_key" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]; then echo 'RUN_KEY contains unsupported characters' >&2; exit 2; fi
          if ! [[ "$source_set" =~ ^[A-Za-z0-9._:-]{1,120}$ ]]; then echo 'SOURCE_SET_VERSION contains unsupported characters' >&2; exit 2; fi
          if [ "$source_set" != '13.5.0-evidence-personalization' ]; then echo 'BLOCKED_DRIFT: runtime supports Project Leads 13.5.0-evidence-personalization only' >&2; exit 2; fi

          {
            echo "mode=$mode"
            echo "agent=$agent"
            echo "country=$country"
            echo "target=$target"
            echo "run_key=$run_key"
            echo "source_set=$source_set"
          } >> "$GITHUB_OUTPUT"
          echo "COMMAND_CONTRACT=green mode=${mode} agent=${agent} country=${country} target=${target} source_set=${source_set}"

      - name: Validate runtime without mailbox writes
        if: steps.command.outputs.mode == 'validate'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          python3 scripts/outreach_daily_batch_drafts.py \
            --count-only \
            --target '${{ steps.command.outputs.target }}' \
            --agent-type '${{ steps.command.outputs.agent }}' \
            --country '${{ steps.command.outputs.country }}' \
            --run-key '${{ steps.command.outputs.run_key }}' | tee daily-draft-count.log
          grep -q '^DAILY_DRAFT_READY=' daily-draft-count.log
          echo 'DAILY_DRAFT_ROUTE_VALIDATE=green mailbox_write=not_invoked smtp_send=not_invoked'

      - name: Require create credentials
        if: steps.command.outputs.mode == 'create'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          test -n "${OUTREACH_MAIL_PASSWORD:-}" || { echo '::error::OUTREACH_MAIL_PASSWORD is required'; exit 1; }
          echo 'CREATE_CREDENTIALS=present'

      - name: Load private footer config
        if: steps.command.outputs.mode == 'create'
        run: python3 scripts/outreach_private_config.py

      - name: Discover new candidate companies
        if: steps.command.outputs.mode == 'create'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
          PROSPECT_DISCOVERY_MODE: discover
          PROSPECT_DISCOVERY_TARGET_NEW: '150'
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: ${{ steps.command.outputs.country }}
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: 'true'
        run: python3 scripts/prospect_discovery_runtime.py --mode discover --report daily-prospect-discovery.json

      - name: Sanitize untrusted discovery evidence
        if: steps.command.outputs.mode == 'create'
        shell: bash
        run: python3 scripts/prospect_candidate_sanitizer.py | tee daily-prospect-sanitizer.log

      - name: Build up to target A-fit prepared queue rows
        if: steps.command.outputs.mode == 'create'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
          PROSPECT_SIGNAL_MODE: discover
          PROSPECT_QUALIFICATION_MODE: qualify
          CONTACT_ENRICHMENT_MODE: discover
          PROSPECT_INTELLIGENCE_MODE: refresh
          OUTREACH_PREPARE_MODE: prepare
          DAILY_DRAFT_COUNTRY: ${{ steps.command.outputs.country }}
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.command.outputs.target }}'
          for pass in 1 2 3 4; do
            echo "DAILY_PREPARE_PASS=${pass}"
            python3 scripts/prospect_signal_discovery_runtime.py --mode discover --report "daily-signal-${pass}.json"
            python3 scripts/prospect_agent_qualification.py --mode qualify --report "daily-qualification-${pass}.json"
            python3 scripts/prospect_campaign_gate.py --mode audit --report "daily-campaign-gate-${pass}.json"
            python3 scripts/prospect_contact_enrichment_campaign.py
            python3 scripts/prospect_intelligence_runtime.py --mode refresh --report "daily-intelligence-${pass}.json"
            python3 scripts/outreach_daily_prepare_new.py | tee "daily-prepare-${pass}.log"

            out="$(python3 scripts/outreach_daily_batch_drafts.py \
              --count-only \
              --target "$target" \
              --agent-type '${{ steps.command.outputs.agent }}' \
              --country '${{ steps.command.outputs.country }}' \
              --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-ready-${pass}.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DAILY_DRAFT_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            test -n "$ready" || { echo '::error::Could not parse DAILY_DRAFT_READY'; exit 2; }
            if [ "$ready" -ge "$target" ]; then
              break
            fi
          done

      - name: Create bounded idempotent IMAP drafts and verify readback
        if: steps.command.outputs.mode == 'create'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_daily_batch_drafts.py \
            --target '${{ steps.command.outputs.target }}' \
            --agent-type '${{ steps.command.outputs.agent }}' \
            --country '${{ steps.command.outputs.country }}' \
            --run-key '${{ steps.command.outputs.run_key }}' | tee daily-draft-run.log
          grep -q '^DAILY_LEAD_DRAFTS=green .*smtp_send=not_invoked$' daily-draft-run.log

      - name: Upload non-secret closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-lead-drafts-${{ github.run_id }}
          path: |
            daily-prospect-discovery.json
            daily-prospect-sanitizer.log
            daily-signal-*.json
            daily-qualification-*.json
            daily-campaign-gate-*.json
            daily-intelligence-*.json
            daily-prepare-*.log
            daily-ready-*.log
            daily-draft-count.log
            daily-draft-selection.json
            daily-draft-receipts.json
            daily-draft-error.json
            daily-draft-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report result on command issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ steps.command.outputs.mode }}
          SOURCE_SET: ${{ steps.command.outputs.source_set }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then result='DAILY_LEAD_DRAFT_COMMAND=green'; else result='DAILY_LEAD_DRAFT_COMMAND=blocked'; fi
          summary=''
          if [ -f daily-draft-run.log ]; then
            summary="$(grep '^DAILY_LEAD_DRAFTS=' daily-draft-run.log | tail -n 1 || true)"
          elif [ -f daily-draft-count.log ]; then
            summary="$(grep '^DAILY_DRAFT_READY=' daily-draft-count.log | tail -n 1 || true)"
          fi
          body="${result}\nMODE=${MODE}\nSOURCE_SET_VERSION=${SOURCE_SET}\n${summary}\nTRANSPORT=IMAP_DRAFT_ONLY\nSMTP_SEND=not_invoked"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d "$close_payload" >/dev/null
