name: Daily Leads to mijn.host Drafts

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: Validate or create a bounded draft batch
        required: true
        default: validate
        type: choice
        options: [validate, create]
      agent_type:
        description: One explicit campaign agent
        required: true
        default: quote_intake
        type: choice
        options: [front_desk_sales, quote_intake, review_concierge, customer_support, commerce]
      country:
        description: Canonical campaign country
        required: true
        default: US
        type: string
      target:
        description: Required draft target, hard capped at 50
        required: true
        default: '50'
        type: string
      run_key:
        description: Stable idempotency/audit key
        required: true
        default: manual
        type: string
      source_set_version:
        description: Live Project Leads source-set version
        required: true
        default: 13.6.0-refill-audit
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-leads-myhost-drafts
  cancel-in-progress: false

jobs:
  daily-drafts:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Yolol100' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issues' && github.actor == 'Yolol100' && github.event.issue.title == 'CREATE DAILY LEAD DRAFTS' && contains(github.event.issue.body, 'COMMAND=CREATE_DAILY_LEAD_DRAFTS'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_WEBSITE: ${{ vars.OUTREACH_SENDER_WEBSITE || 'andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '50'
      PROSPECT_DISCOVERY_MAX_TOTAL: '200'
      PROSPECT_SIGNAL_MAX_CANDIDATES: '25'
      PROSPECT_QUALIFICATION_MAX_PER_RUN: '25'
      CONTACT_ENRICHMENT_MAX_PER_RUN: '25'
      PROSPECT_INTELLIGENCE_MAX_TARGETS: '25'
      OUTREACH_PREPARE_MAX_PER_RUN: '25'
      OUTREACH_CTA_VARIANT: 'A'

    steps:
      - name: Checkout exact default-branch runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse command
        id: command
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_AGENT_TYPE: ${{ inputs.agent_type }}
          INPUT_COUNTRY: ${{ inputs.country }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          INPUT_SOURCE_SET_VERSION: ${{ inputs.source_set_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
            one(){ mapfile -t x < <(printf '%s\n' "$body" | sed -n "s/^$1=//p"); [ "${#x[@]}" -eq 1 ] && [ -n "${x[0]}" ] || exit 2; printf '%s' "${x[0]}"; }
            mode="$(one MODE)"; agent="$(one AGENT_TYPE)"; country="$(one COUNTRY)"; target="$(one TARGET)"; run_key="$(one RUN_KEY)"; source_set="$(one SOURCE_SET_VERSION)"
          else
            mode="$INPUT_MODE"; agent="$INPUT_AGENT_TYPE"; country="$INPUT_COUNTRY"; target="$INPUT_TARGET"; run_key="$INPUT_RUN_KEY"; source_set="$INPUT_SOURCE_SET_VERSION"
          fi
          case "$mode" in validate|create) ;; *) exit 2;; esac
          case "$agent" in front_desk_sales|quote_intake|review_concierge|customer_support|commerce) ;; *) exit 2;; esac
          [[ "$country" =~ ^[A-Z]{2}$ ]] || exit 2
          [[ "$target" =~ ^[0-9]+$ ]] && [ "$target" -ge 1 ] && [ "$target" -le 50 ] || exit 2
          [[ "$run_key" =~ ^[A-Za-z0-9._:-]{1,80}$ ]] || exit 2
          [ "$source_set" = '13.6.0-refill-audit' ] || { echo 'BLOCKED_DRIFT'; exit 2; }
          printf 'mode=%s\nagent=%s\ncountry=%s\ntarget=%s\nrun_key=%s\nsource_set=%s\n' "$mode" "$agent" "$country" "$target" "$run_key" "$source_set" >> "$GITHUB_OUTPUT"

      - name: Validate runtime without mailbox writes
        if: steps.command.outputs.mode == 'validate'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          python3 scripts/outreach_daily_batch_drafts_v2.py --count-only --target '${{ steps.command.outputs.target }}' --agent-type '${{ steps.command.outputs.agent }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}' | tee daily-draft-count.log
          grep -q '^DAILY_DRAFT_READY=' daily-draft-count.log
          echo 'DAILY_DRAFT_ROUTE_VALIDATE=green mailbox_write=not_invoked smtp_send=not_invoked'

      - name: Require create credentials and footer
        if: steps.command.outputs.mode == 'create'
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          test -n "${OUTREACH_MAIL_PASSWORD:-}"
          python3 scripts/outreach_private_config.py

      - name: Refill until target or source exhaustion
        if: steps.command.outputs.mode == 'create'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
          PROSPECT_DISCOVERY_MODE: discover
          PROSPECT_DISCOVERY_TARGET_NEW: '150'
          PROSPECT_DISCOVERY_PREFERRED_COUNTRIES: ${{ steps.command.outputs.country }}
          PROSPECT_DISCOVERY_EXCLUDE_AGENCIES: 'true'
          PROSPECT_SIGNAL_MODE: discover
          PROSPECT_QUALIFICATION_MODE: qualify
          CONTACT_ENRICHMENT_MODE: discover
          PROSPECT_INTELLIGENCE_MODE: refresh
          OUTREACH_PREPARE_MODE: prepare
          DAILY_DRAFT_COUNTRY: ${{ steps.command.outputs.country }}
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.command.outputs.target }}'
          previous=-1; stagnant=0; cycle=0
          mkdir -p daily-evidence
          while true; do
            cycle=$((cycle+1)); echo "REFILL_CYCLE=$cycle"
            out="$(python3 scripts/outreach_daily_batch_drafts_v2.py --count-only --target "$target" --agent-type '${{ steps.command.outputs.agent }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-evidence/ready-before-$cycle.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DAILY_DRAFT_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"; test -n "$ready"
            [ "$ready" -ge "$target" ] && break
            python3 scripts/prospect_discovery_runtime.py --mode discover --report "daily-evidence/discovery-$cycle.json"
            python3 scripts/prospect_candidate_sanitizer.py | tee "daily-evidence/sanitizer-$cycle.log"
            python3 scripts/prospect_signal_discovery_runtime.py --mode discover --report "daily-evidence/signal-$cycle.json"
            python3 scripts/prospect_agent_qualification.py --mode qualify --report "daily-evidence/qualification-$cycle.json"
            python3 scripts/prospect_campaign_gate.py --mode audit --report "daily-evidence/campaign-gate-$cycle.json"
            python3 scripts/prospect_contact_enrichment_campaign.py
            python3 scripts/prospect_intelligence_runtime.py --mode refresh --report "daily-evidence/intelligence-$cycle.json"
            python3 scripts/outreach_daily_prepare_new.py | tee "daily-evidence/prepare-$cycle.log"
            out="$(python3 scripts/outreach_daily_batch_drafts_v2.py --count-only --target "$target" --agent-type '${{ steps.command.outputs.agent }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}')"
            printf '%s\n' "$out" | tee "daily-evidence/ready-after-$cycle.log"
            ready="$(printf '%s\n' "$out" | sed -n 's/^DAILY_DRAFT_READY=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"; test -n "$ready"
            [ "$ready" -ge "$target" ] && break
            if [ "$ready" -le "$previous" ]; then stagnant=$((stagnant+1)); else stagnant=0; fi
            previous="$ready"
            [ "$stagnant" -lt 2 ] || { echo "BLOCKED_SOURCE_EXHAUSTION ready=$ready target=$target"; exit 3; }
            [ "$cycle" -lt 12 ] || { echo "BLOCKED_BOUNDED_REFILL ready=$ready target=$target"; exit 3; }
          done
          echo "REFILL_TARGET=green ready=$ready target=$target"

      - name: Create idempotent IMAP drafts and verify readback
        if: steps.command.outputs.mode == 'create'
        env:
          AGENT_SALES_TARGET_TYPE: ${{ steps.command.outputs.agent }}
        run: |
          set -euo pipefail
          python3 scripts/outreach_daily_batch_drafts_v2.py --target '${{ steps.command.outputs.target }}' --agent-type '${{ steps.command.outputs.agent }}' --country '${{ steps.command.outputs.country }}' --run-key '${{ steps.command.outputs.run_key }}' | tee daily-draft-run.log
          grep -q '^DAILY_LEAD_DRAFTS=green .*smtp_send=not_invoked$' daily-draft-run.log
          grep -q "drafts=${{ steps.command.outputs.target }}" daily-draft-run.log

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-lead-drafts-${{ github.run_id }}
          path: |
            daily-evidence/
            daily-draft-count.log
            daily-draft-selection.json
            daily-draft-receipts.json
            daily-draft-error.json
            daily-draft-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report result on command issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          [ "$JOB_STATUS" = success ] && result=green || result=blocked
          body="DAILY_LEAD_DRAFT_COMMAND=$result\nSOURCE_SET_VERSION=${{ steps.command.outputs.source_set }}\nTRANSPORT=IMAP_DRAFT_ONLY\nSMTP_SEND=not_invoked"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
          curl --fail-with-body --silent --show-error -X PATCH -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" -d '{"state":"closed","state_reason":"completed"}' >/dev/null