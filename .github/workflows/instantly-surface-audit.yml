name: Instantly Surface Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: instantly-surface-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'INSTANTLY SURFACE AUDIT'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run official OpenAPI surface audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/instantly_surface_audit.py --report instantly-surface-report.json

      - name: Post safe summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(jq -r '
            ["INSTANTLY_SURFACE_AUDIT=green", "OPERATIONS=" + ((.operation_count // 0)|tostring)] +
            (.surfaces | to_entries | map(.key + "=" + .value.control)) | join("\n")
          ' instantly-surface-report.json)"
          payload="$(jq -n --arg body "$summary" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$payload" >/dev/null

          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d "$close_payload" >/dev/null
