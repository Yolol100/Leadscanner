name: Leads Cancel Stale Content Runs

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: leads-cancel-stale-content-runs-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cancel:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[growth-cancel-stale-content-runs]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate and cancel only stale content-remediation runs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event=json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          req=json.loads(event["issue"].get("body") or "{}")
          if set(req) != {"run_ids","reason_code","confirm"}:
              raise SystemExit("request fields mismatch")
          run_ids=[int(x) for x in (req.get("run_ids") or [])]
          if not 1 <= len(run_ids) <= 10 or len(set(run_ids)) != len(run_ids) or any(x <= 0 for x in run_ids):
              raise SystemExit("invalid run_ids")
          if req.get("reason_code") != "presence_audit_superseded":
              raise SystemExit("unsupported reason_code")
          if req.get("confirm") is not True:
              raise SystemExit("confirm=true required")
          Path("run-ids.txt").write_text("".join(f"{x}\n" for x in run_ids),encoding="utf-8")
          PY
          : > cancel-result.txt
          while IFS= read -r run_id; do
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            name="$(META="$meta" python3 -c 'import json,os; print(json.loads(os.environ["META"]).get("name",""))')"
            title="$(META="$meta" python3 -c 'import json,os; print(json.loads(os.environ["META"]).get("display_title",""))')"
            status="$(META="$meta" python3 -c 'import json,os; print(json.loads(os.environ["META"]).get("status",""))')"
            if [ "$name" != "Leads Content Remediation" ]; then
              echo "$run_id rejected wrong_workflow" >> cancel-result.txt
              continue
            fi
            case "$title" in
              "[growth-content-remediate] "*"apply proven fixes"*) ;;
              *) echo "$run_id rejected wrong_title" >> cancel-result.txt; continue ;;
            esac
            if [ "$status" = "completed" ]; then
              echo "$run_id already_completed" >> cancel-result.txt
              continue
            fi
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
            echo "$run_id cancel_requested" >> cancel-result.txt
          done < run-ids.txt
          cat cancel-result.txt

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -s cancel-result.txt ]; then
            {
              echo "STALE_CONTENT_RUN_CANCEL=processed"
              echo '~~~'
              cat cancel-result.txt
              echo '~~~'
              echo "No mailbox content was changed by this cancellation workflow."
            } > comment.txt
          else
            echo "STALE_CONTENT_RUN_CANCEL=failed_closed. No mailbox content was changed." > comment.txt
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file comment.txt
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Remove residue
        if: always()
        run: rm -f run-ids.txt cancel-result.txt comment.txt
