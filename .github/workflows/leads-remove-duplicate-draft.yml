name: Leads Remove Duplicate Draft

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: leads-remove-duplicate-draft
  cancel-in-progress: false

jobs:
  remove:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[growth-draft-remove-duplicate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve duplicate-removal request
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          mkdir -p results/source
          python3 - <<'PY'
          import json
          import re
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          request = json.loads(event["issue"].get("body") or "{}")
          artifact_ids = [int(x) for x in (request.get("artifact_ids") or [])]
          remove_id = str(request.get("remove_lead_id") or "").strip()
          keep_id = str(request.get("keep_lead_id") or "").strip()
          lead_re = re.compile(r"^growth-[0-9a-f]{20}$")
          if not 1 <= len(artifact_ids) <= 10 or any(x <= 0 for x in artifact_ids):
              raise SystemExit("artifact_ids must contain 1-10 positive IDs")
          if not lead_re.fullmatch(remove_id) or not lead_re.fullmatch(keep_id) or remove_id == keep_id:
              raise SystemExit("remove/keep lead IDs must be distinct canonical growth IDs")
          Path("results/artifact-ids.txt").write_text(
              "".join(f"{x}\n" for x in artifact_ids), encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"remove_id={remove_id}\n")
              out.write(f"keep_id={keep_id}\n")
          PY

      - name: Download draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r artifact_id; do
            n=$((n + 1))
            mkdir -p "results/source/$n"
            gh api -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"               > "results/source/$n.zip"
            unzip -q "results/source/$n.zip" -d "results/source/$n"
            test -s "results/source/$n/growth-batch.json"
          done < results/artifact-ids.txt

      - name: Prove duplicate evidence and canonical keep target
        env:
          REMOVE_ID: ${{ steps.request.outputs.remove_id }}
          KEEP_ID: ${{ steps.request.outputs.keep_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = {}
          for path in Path("results/source").glob("*/growth-batch.json"):
              payload = json.loads(path.read_text(encoding="utf-8"))
              for row in payload.get("rows") or []:
                  if row.get("status") == "review_draft":
                      rows[str(row.get("lead_id") or "")] = row

          remove = rows.get(os.environ["REMOVE_ID"])
          keep = rows.get(os.environ["KEEP_ID"])
          if not remove or not keep:
              raise SystemExit("remove/keep lead not found in supplied artifacts")

          remail = str(remove.get("email") or "").strip().casefold()
          kemail = str(keep.get("email") or "").strip().casefold()
          rcompany = str(remove.get("company") or "").strip().casefold()
          kcompany = str(keep.get("company") or "").strip().casefold()
          rdomain = str(remove.get("official_domain_hint") or "").strip().casefold()
          kdomain = str(keep.get("official_domain_hint") or "").strip().casefold()
          if not remail or remail != kemail:
              raise SystemExit("duplicate evidence requires the same non-empty email")
          if not rcompany or rcompany != kcompany:
              raise SystemExit("duplicate evidence requires the same company")
          if not rdomain.endswith("." + kdomain):
              raise SystemExit("keep target must be the parent canonical domain")
          if remove.get("contact_basis_status") != "review_required" or keep.get("contact_basis_status") != "review_required":
              raise SystemExit("both drafts must remain review_required")
          print("DUPLICATE_EVIDENCE=green canonical_parent_domain=true")
          PY

      - name: Remove only the proven duplicate draft
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
          REMOVE_ID: ${{ steps.request.outputs.remove_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/myhost_remove_duplicate_draft.py             --lead-id "$REMOVE_ID"             --output results/removal.json | tee results/removal.txt
          grep -q '^MYHOST_DUPLICATE_REMOVAL=green ' results/removal.txt
          grep -q 'automatic_send=false' results/removal.txt
          grep -q 'smtp_send=not_available' results/removal.txt

      - name: Read back removed and kept lead IDs
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
          REMOVE_ID: ${{ steps.request.outputs.remove_id }}
          KEEP_ID: ${{ steps.request.outputs.keep_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from myhost_draft import connect_imap, find_drafts_folder, find_message_ids

          client = connect_imap()
          try:
              folder = find_drafts_folder(client)
              removed = find_message_ids(client, folder, os.environ["REMOVE_ID"])
              kept = find_message_ids(client, folder, os.environ["KEEP_ID"])
              if removed:
                  raise SystemExit(f"removed duplicate still present: {len(removed)}")
              if len(kept) != 1:
                  raise SystemExit(f"canonical keep draft count={len(kept)}, expected 1")
              print("DUPLICATE_REMOVAL_READBACK=green removed=0 kept=1 automatic_send=false")
          finally:
              try:
                  client.logout()
              except Exception:
                  pass
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duplicate-draft-removal-${{ github.run_number }}
          path: |
            results/removal.json
            results/removal.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove source artifact residue
        if: always()
        run: rm -rf results/source results/*.zip results/artifact-ids.txt

      - name: Close owner request issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Proven duplicate review draft removed and canonical draft read back. Nothing was sent."
          gh issue close "$ISSUE_NUMBER"
