name: Leadscanner Quality Smoke Launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/lead-quality-smoke.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch quality preview smoke
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload=$(jq -c '{
            ref: "main",
            inputs: {
              execution_mode: "preview",
              confirm_review_drafts: false,
              approved_review_tokens: "",
              preview_run_id: "",
              region: .region,
              keywords: .keywords,
              target_candidates: (.target_candidates | tostring),
              verify_limit: (.verify_limit | tostring),
              radius_km: (.radius_km | tostring)
            }
          }' .github/lead-quality-smoke.json)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/leads-cold.yml/dispatches" \
            --data "$payload"
          echo QUALITY_SMOKE_DISPATCH=green
