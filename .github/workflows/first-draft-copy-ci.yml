name: Leadscanner first-draft copy safety
on:
  pull_request:
    paths:
      - 'scripts/auto_draft_new.py'
      - 'tests/test_auto_draft_new.py'
      - 'tests/test_auto_first_draft_e2e.py'
      - '.github/workflows/first-draft-copy-ci.yml'
permissions:
  contents: read
jobs:
  synthetic-copy-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Validate syntax and private draft copy contract without credentials
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_auto_draft_new.py' -q
          python3 -m unittest discover -s tests -p 'test_auto_first_draft_e2e.py' -q
