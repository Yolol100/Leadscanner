name: Temporary 50 Personalized mijn.host Drafts

on:
  push:
    branches:
      - run/leads-50-drafts-20260909
    paths:
      - '.github/workflows/run-50-personalized-drafts.yml'

permissions:
  contents: read

concurrency:
  group: temporary-leads-50-personalized-drafts-20260909
  cancel-in-progress: false

jobs:
  prepare-and-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
      OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
      OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
      OUTREACH_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
      OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
      OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
      OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
      OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
      OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
      OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
      OUTREACH_DAILY_LIMIT: '20'

    steps:
      - name: Checkout temporary execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Require bounded runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::GOOGLE_SERVICE_ACCOUNT_JSON is required'; exit 1; }
          test -n "${OUTREACH_MAIL_PASSWORD:-}" || { echo '::error::OUTREACH_MAIL_PASSWORD is required'; exit 1; }
          echo 'RUNTIME_CREDENTIALS=present'

      - name: Load private outreach footer config
        run: python3 scripts/outreach_private_config.py

      - name: Run bounded US quote-intake campaign and create 50 review drafts
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/run_50_personalized_drafts.py | tee run-50-personalized-drafts.log
          grep -q '^LEADS50_RESULT=green selected=50 drafts=50 smtp_send=not_invoked$' run-50-personalized-drafts.log

      - name: Write execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Temporary 50 personalized mijn.host drafts'
            echo '- campaign: `US manufacturing / quote_intake`'
            echo '- final copy: `evidence_personalized_v13_5`'
            echo '- selected: `50 new A-fit prospects`'
            echo '- mailbox: `info@andrewbaeten.nl via mijn.host IMAP`'
            echo '- queue state: `prepared/manual_review remains non-sendable`'
            echo '- SMTP: `not invoked`'
            echo '- temporary execution branch only; no main mutation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leads-50-personalized-drafts-${{ github.run_id }}
          path: |
            selected-50-leads.json
            draft-receipts.json
            run-50-personalized-drafts.log
            prospect-discovery-wave-*.json
            prospect-signal-wave-*.json
            agent-qualification-*.json
            campaign-gate-*.json
            agent-prepare-*.json
          if-no-files-found: ignore
          retention-days: 14
