name: Value-first 404 - draft-only guarded update
on:
  pull_request:
    paths:
      - 'scripts/sync_review_openings.py'
      - 'tests/test_sync_review_openings.py'
      - '.github/workflows/sync-review-openings.yml'
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  synthetic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Test synthetic safe scope and mailbox code
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_sync_review_openings.py' -q
          python3 -m unittest discover -s tests -p 'test_reconcile450_current.py' -q

  audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1659 &&
      github.actor == 'Yolol100' &&
      github.event.comment.body == 'LEADS_VALUEFIRST_404_AUDIT_ONLY: review450-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Test scope safety
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -p 'test_sync_review_openings.py' -q
      - name: Inspect actual Mijn.Host drafts; no writes
        env:
          PYTHONPATH: scripts
          MAILBOX_VALUEFIRST_MODE: audit
          MAILBOX_VALUEFIRST_TASK: review450-20261016
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/sync_review_openings.py

  sync:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1659 &&
      github.actor == 'Yolol100' &&
      github.event.comment.body == 'LEADS_VALUEFIRST_407_CLEAR_ALL_412_ONLY: review450-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: leadscanner-myhost-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Test scope safety
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m unittest discover -s tests -p 'test_sync_review_openings.py' -q
          python3 -m unittest discover -s tests -p 'test_reconcile450_current.py' -q
      - name: Append 407 reviewed drafts and clear 412 originals plus stale staged copy; never send
        env:
          PYTHONPATH: scripts
          MAILBOX_VALUEFIRST_MODE: sync
          MAILBOX_VALUEFIRST_TASK: review450-20261016
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEAD_REGISTRY_SERVICE_ACCOUNT_JSON: ${{ secrets.LEAD_REGISTRY_SERVICE_ACCOUNT_JSON }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: python3 scripts/sync_review_openings.py
