name: Chat mijn.host Draft Replace Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: chat-myhost-draft-replace-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  replace:
    if: >-
      github.actor == 'Yolol100' &&
      github.event.issue.title == 'REPLACE MYHOST DRAFT' &&
      contains(github.event.issue.body, 'COMMAND=REPLACE_MYHOST_DRAFT')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install isolated dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Parse bounded replacement command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lead_lines < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("LEAD_ID=")) | sub("^LEAD_ID="; "")' "$GITHUB_EVENT_PATH")
          mapfile -t replace_lines < <(jq -r '.issue.body // "" | split("\n")[] | select(startswith("REPLACE_TEST_ID=")) | sub("^REPLACE_TEST_ID="; "")' "$GITHUB_EVENT_PATH")
          if [ "${#lead_lines[@]}" -ne 1 ] || [ "${#replace_lines[@]}" -ne 1 ]; then
            echo 'Expected exactly one LEAD_ID and one REPLACE_TEST_ID line.' >&2
            exit 2
          fi
          lead_id="${lead_lines[0]}"
          replace_test_id="${replace_lines[0]}"
          if ! [[ "$lead_id" =~ ^[A-Za-z0-9._:-]{1,160}$ ]] || ! [[ "$replace_test_id" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]; then
            echo 'Command contains unsupported characters.' >&2
            exit 2
          fi
          echo "lead_id=$lead_id" >> "$GITHUB_OUTPUT"
          echo "replace_test_id=$replace_test_id" >> "$GITHUB_OUTPUT"

      - name: Load private outreach config
        env:
          OUTREACH_CONFIG_SPREADSHEET_ID: ${{ vars.OUTREACH_CONFIG_SPREADSHEET_ID || '1iOBCaBq3MpsrYQiESAhjS1NMRQDXAWmkTh-U-63qzs4' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/outreach_private_config.py

      - name: Replace and verify exact mijn.host queue draft
        id: replace
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTREACH_SPREADSHEET_ID: ${{ vars.OUTREACH_SPREADSHEET_ID || '1p4vZnCdcex9zpTAV-ssebXqZcBS2TU6KfXwS-4d2iSI' }}
          OUTREACH_DAILY_LIMIT: '20'
          OUTREACH_DRAFT_MAILBOX_ID: ${{ vars.OUTREACH_MAILBOX_ID || 'primary' }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_MAILBOXES_JSON: ${{ secrets.OUTREACH_MAILBOXES_JSON }}
          OUTREACH_DRAFT_TEST_ID: chat-draft-replace-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/outreach_queue_imap_draft_replace.py \
            --lead-id '${{ steps.command.outputs.lead_id }}' \
            --replace-test-id '${{ steps.command.outputs.replace_test_id }}' | tee replace-result.txt
          grep -q '^MYHOST_QUEUE_DRAFT_REPLACE=green ' replace-result.txt
          grep -q 'smtp_send=not_invoked' replace-result.txt

      - name: Report bounded readback on command issue
        if: always() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLACE_OUTCOME: ${{ steps.replace.outcome }}
          LEAD_ID: ${{ steps.command.outputs.lead_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPLACE_OUTCOME" = 'success' ] && grep -q '^MYHOST_QUEUE_DRAFT_REPLACE=green ' replace-result.txt 2>/dev/null; then
            result='MYHOST_DRAFT_REPLACE_COMMAND=green'
          else
            result='MYHOST_DRAFT_REPLACE_COMMAND=blocked'
          fi
          body="${result}\nLEAD_ID=${LEAD_ID}\nTRANSPORT=IMAP_DRAFT_REPLACE_ONLY\nSMTP_SEND=not_invoked"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -d "$payload" >/dev/null
          close_payload="$(jq -n '{state:"closed", state_reason:"completed"}')"
          curl --fail-with-body --silent --show-error -X PATCH \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" -d "$close_payload" >/dev/null

      - name: Fail closed when draft replacement failed
        if: steps.command.outcome == 'success' && steps.replace.outcome != 'success'
        run: |
          echo 'The IMAP draft replacement did not produce verified readback.' >&2
          exit 1
