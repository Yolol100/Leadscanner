name: Mailbox Execute

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: mailbox-execute-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[mailbox-execute]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Checkout pinned mailbox runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/myhost-mailbox
          ref: d7cdfc60d9e056650c733644099a39f92be192b3
          path: mailbox-runtime
          persist-credentials: false

      - name: Resolve mailbox request id
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          body = event.get("issue", {}).get("body") or ""
          try:
              request = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"issue body must be JSON: {exc}")
          if not isinstance(request, dict) or set(request) != {"request_id"}:
              raise SystemExit("issue body must contain only request_id")
          request_id = str(request.get("request_id") or "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{7,99}", request_id):
              raise SystemExit("invalid request_id")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"request_id={request_id}\n")
          print("MAILBOX_REQUEST_ID=green")
          PY

      - name: Fetch private mailbox request
        env:
          SITE_URL: https://andrewbaeten.nl
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox"
          rm -rf "$root"
          mkdir -p "$root"
          chmod 700 "$root"

          base="${SITE_URL%/}/wp-json/webactueel-mailbox-bridge/v1"
          audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$base")
          token_json=$(curl --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
          oidc=$(OIDC="$token_json" python3 -c 'import json,os; print(json.loads(os.environ["OIDC"])["value"])')
          unset token_json

          response="$root/request-envelope.json"
          code=$(curl --silent --show-error --output "$response" --write-out '%{http_code}'             --connect-timeout 10 --max-time 60             --header 'Accept: application/json'             --header "X-Webactueel-GitHub-OIDC: ${oidc}"             "$base/requests/$REQUEST_ID")
          unset oidc
          [[ "$code" == 200 ]]

          REQUEST_ID="$REQUEST_ID" python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mailbox"
          envelope = json.loads((root / "request-envelope.json").read_text(encoding="utf-8"))
          request_id = os.environ["REQUEST_ID"]
          if envelope.get("request_id") != request_id:
              raise SystemExit("mailbox request_id readback mismatch")
          request = envelope.get("request")
          if not isinstance(request, dict):
              raise SystemExit("mailbox request payload is invalid")
          digest = str(envelope.get("sha256") or "")
          expected = hashlib.sha256(
              json.dumps(request, ensure_ascii=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          if len(digest) != 64 or digest != expected:
              raise SystemExit("mailbox request digest mismatch")
          if int(envelope.get("expires_at") or 0) <= int(time.time()):
              raise SystemExit("mailbox request already expired")
          digest_path = root / "request.sha256"
          digest_path.write_text(digest + "\n", encoding="ascii")
          digest_path.chmod(0o600)
          target = root / "request.json"
          target.write_text(
              json.dumps(request, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          target.chmod(0o600)
          (root / "request-envelope.json").unlink(missing_ok=True)
          print("MAILBOX_PRIVATE_REQUEST=green")
          PY

      - name: Execute mailbox request without public payload output
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST || vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT || '587' }}
          OUTREACH_SMTP_MODE: ${{ vars.OUTREACH_SMTP_MODE || 'starttls' }}
          OUTREACH_SMTP_PASSWORD: ${{ secrets.OUTREACH_SMTP_PASSWORD || secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_SMTP_SEND_ENABLED: ${{ vars.OUTREACH_SMTP_SEND_ENABLED || 'false' }}
          OUTREACH_SENDER_NAME: ${{ vars.OUTREACH_SENDER_NAME || 'Andrew Baeten' }}
          OUTREACH_SENDER_EMAIL: ${{ vars.OUTREACH_SENDER_EMAIL || 'info@andrewbaeten.nl' }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/mailbox-runtime:$GITHUB_WORKSPACE/scripts"             python3 scripts/run_mailbox_bridge.py               --request "$RUNNER_TEMP/mailbox/request.json"               --output "$RUNNER_TEMP/mailbox/result.json"
          chmod 600 "$RUNNER_TEMP/mailbox/result.json"

      - name: Store private mailbox result
        env:
          SITE_URL: https://andrewbaeten.nl
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox"
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$base")
          token_json=$(curl --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
          oidc=$(OIDC="$token_json" python3 -c 'import json,os; print(json.loads(os.environ["OIDC"])["value"])')
          unset token_json

          request_sha=$(tr -d '\r\n' < "$root/request.sha256")
          [[ "$request_sha" =~ ^[a-f0-9]{64}$ ]]
          ack="$root/result-ack.json"
          code=$(curl --silent --show-error --output "$ack" --write-out '%{http_code}'             --connect-timeout 10 --max-time 120             --header 'Accept: application/json'             --header 'Content-Type: application/json'             --header "X-Webactueel-GitHub-OIDC: ${oidc}"             --header "X-Webactueel-Mailbox-Request-SHA256: ${request_sha}"             --data-binary "@$root/result.json"             "$base/results/$REQUEST_ID")
          unset oidc
          [[ "$code" == 201 ]]
          python3 - "$ack" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("mailbox result acknowledgement failed")
          print("MAILBOX_PRIVATE_RESULT=green")
          PY

      - name: Close public request shell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Mailbox request completed. The result was stored privately."
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Remove mailbox runtime residue
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mailbox"
