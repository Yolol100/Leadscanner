name: Leads Growth Draft Sample

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: growth-draft-sample-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sample:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[growth-draft-sample]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve read-only request
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          request = json.loads(event["issue"].get("body") or "{}")
          if not isinstance(request, dict) or set(request) != {"offset", "count", "read_only"}:
              raise SystemExit("request fields mismatch")
          offset = int(request.get("offset") or 0)
          count = int(request.get("count") or 0)
          if offset < 0 or not 1 <= count <= 10:
              raise SystemExit("offset/count out of bounds")
          if request.get("read_only") is not True:
              raise SystemExit("read_only=true required")
          Path("results/request.json").write_text(
              json.dumps({"offset": offset, "count": count}, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"GROWTH_DRAFT_SAMPLE_REQUEST=green offset={offset} count={count} read_only=true automatic_send=false")
          PY

      - name: Read sanitized current draft sample
        env:
          OUTREACH_IMAP_HOST: ${{ vars.OUTREACH_IMAP_HOST || 'mail.andrewbaeten.nl' }}
          OUTREACH_IMAP_PORT: ${{ vars.OUTREACH_IMAP_PORT || '993' }}
          OUTREACH_MAIL_USER: ${{ vars.OUTREACH_MAIL_USER || 'info@andrewbaeten.nl' }}
          OUTREACH_MAIL_PASSWORD: ${{ secrets.OUTREACH_MAIL_PASSWORD }}
          OUTREACH_DRAFT_FOLDER: ${{ vars.OUTREACH_DRAFT_FOLDER }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path

          from myhost_draft import connect_imap, find_drafts_folder, normalize_text, plain_body
          from myhost_fast_mailbox import bulk_fetch_uid_messages
          from myhost_short_first_touch_remediation import growth_uid_index
          from prepare_growth_batch import validate_short_first_touch

          req = json.loads(Path("results/request.json").read_text(encoding="utf-8"))
          client = connect_imap()
          try:
              folder = find_drafts_folder(client)
              pairs = growth_uid_index(client, folder)
              start = req["offset"]
              stop = start + req["count"]
              if stop > len(pairs):
                  raise SystemExit(f"requested sample exceeds current Growth draft count {len(pairs)}")
              selected = pairs[start:stop]
              messages = bulk_fetch_uid_messages(client, [uid for _lead_id, uid in selected])
              sample = []
              for index, (_lead_id, uid) in enumerate(selected, start=1):
                  msg = messages[uid]
                  review = normalize_text(msg.get("X-Webactueel-Review-Required", ""))
                  if review != "contact-basis":
                      raise SystemExit("sample contains non-review-required draft")
                  subject = normalize_text(msg.get("Subject", ""))
                  body = plain_body(msg)
                  validate_short_first_touch(subject, body)
                  sample.append(
                      {
                          "sample_index": index,
                          "subject": subject,
                          "body": body,
                          "review_status": review,
                      }
                  )
          finally:
              try:
                  client.logout()
              except Exception:
                  pass

          Path("results/sample.json").write_text(
              json.dumps(
                  {
                      "count": len(sample),
                      "read_only": True,
                      "automatic_send": False,
                      "samples": sample,
                  },
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"GROWTH_DRAFT_SAMPLE=green count={len(sample)} read_only=true automatic_send=false")
          PY

      - name: Upload sanitized sample
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: growth-draft-sample-${{ github.event.issue.number }}
          path: results/sample.json
          retention-days: 1
          if-no-files-found: error

      - name: Report aggregate result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "GROWTH_DRAFT_SAMPLE=green artifact_id=$ARTIFACT_ID read_only=true automatic_send=false. No recipient address or lead ID was published."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Close failed request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Growth draft sample failed closed. Nothing was changed or sent."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Remove residue
        if: always()
        run: rm -rf results
